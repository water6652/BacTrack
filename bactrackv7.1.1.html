<!DOCTYPE html>
<!-- BacTrack · v7.1.2 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>BacTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* ---------------------------------------------------------------
   TOKENS
   --------------------------------------------------------------- */
:root{
  --bg:#ffffff;
  --fg:#2b2b2b;
  --fg-mid:#6e6e6e;
  --fg-soft:#9a9a9a;
  --fg-faint:#c9c9c9;
  --line:#ededed;
  --line-strong:#dcdcdc;
  --field:#f6f6f6;
  --accent:#c0392b;
  --ok:#3f7d58;
  --dh:1.14em;              /* digit cell height */
  --ease:cubic-bezier(.16,1,.3,1);
  --speed:1;
  --radius:10px;
  --fs-scale:1;
  --ui-scale:1;
  --fw:400;
  --fw-display:200;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111111; --fg:#e4e4e4; --fg-mid:#a0a0a0; --fg-soft:#7a7a7a;
    --fg-faint:#3d3d3d; --line:#242424; --line-strong:#333333; --field:#1b1b1b;
  }
}
:root[data-theme="dark"]{
  --bg:#111111; --fg:#e4e4e4; --fg-mid:#a0a0a0; --fg-soft:#7a7a7a;
  --fg-faint:#3d3d3d; --line:#242424; --line-strong:#333333; --field:#1b1b1b;
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html{
  height:100%; overflow:hidden;
  font-size:calc(16px * var(--fs-scale));
  background:var(--bg);
  position:relative;
}
html::before,html::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  opacity:0; transition:opacity calc(1.2s * var(--speed)) var(--ease);
}
html::before{
  background-image:
    radial-gradient(circle at 8% 18%,rgba(255,255,255,.70) 0 1px,transparent 1.6px),
    radial-gradient(circle at 24% 72%,rgba(210,230,255,.52) 0 1px,transparent 1.5px),
    radial-gradient(circle at 43% 28%,rgba(255,255,255,.58) 0 1px,transparent 1.5px),
    radial-gradient(circle at 67% 16%,rgba(210,230,255,.62) 0 1px,transparent 1.5px),
    radial-gradient(circle at 82% 62%,rgba(255,255,255,.52) 0 1px,transparent 1.5px),
    radial-gradient(circle at 92% 31%,rgba(205,225,255,.48) 0 1px,transparent 1.5px);
  background-size:100% 100%;
  animation:skyDriftA 180s linear infinite;
}
html::after{
  background-image:
    radial-gradient(circle at 14% 48%,rgba(255,255,255,.38) 0 .8px,transparent 1.4px),
    radial-gradient(circle at 36% 12%,rgba(205,225,255,.34) 0 .8px,transparent 1.3px),
    radial-gradient(circle at 58% 82%,rgba(255,255,255,.32) 0 .8px,transparent 1.3px),
    radial-gradient(circle at 77% 42%,rgba(210,230,255,.30) 0 .8px,transparent 1.3px);
  background-size:100% 100%;
  animation:skyDriftB 260s linear infinite;
}
@keyframes skyDriftA{from{transform:translate3d(0,0,0)}to{transform:translate3d(18px,-9px,0)}}
@keyframes skyDriftB{from{transform:translate3d(0,0,0)}to{transform:translate3d(-13px,7px,0)}}
html[data-gradient-night="1"]::before{opacity:.52;}
html[data-gradient-night="1"]::after{opacity:.24;}
html[data-animations="off"]::before,html[data-animations="off"]::after{animation:none;}
body{
  width:calc(100% / var(--ui-scale)); height:calc(100% / var(--ui-scale));
  background:transparent; color:var(--fg);
  font-family:"Inter Tight","IBM Plex Sans Arabic","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:1rem; font-weight:var(--fw,400);
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum 1,""cv05" 1;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none; touch-action:none;
  zoom:var(--ui-scale);
}
:lang(ar), .rtl{ font-family:"IBM Plex Sans Arabic","Inter Tight",sans-serif; }
button,input,select,textarea{font:inherit; color:inherit; background:none; border:none; outline:none;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--fg); outline-offset:3px; border-radius:4px;}
@media (prefers-reduced-motion:reduce){ :root{--speed:0.001;} }

/* ---------------------------------------------------------------
   SHELL
   --------------------------------------------------------------- */
#app{position:fixed; inset:0; display:flex; flex-direction:column;}

#topbar{
  flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between;
  padding:18px 26px 0; font-size:.8rem; letter-spacing:.01em; color:var(--fg-mid);
  z-index:40; pointer-events:none;
}
#topbar .tb-date{font-weight:400;}
#topbar .tb-clock{font-weight:500; color:var(--fg); font-size:.95rem;}
#topbar .tb-sync{font-size:.68rem; color:var(--fg-faint); margin-left:10px;}

#viewport{flex:1 1 auto; position:relative; overflow:hidden;}
#track{
  position:absolute; inset:0; display:flex;
  transition:transform calc(.55s * var(--speed)) var(--ease);
  will-change:transform;
}
.screen{
  flex:0 0 100%; width:100%; height:100%; position:relative;
  display:flex; flex-direction:column; padding:8px 26px 0;
  overflow:hidden;
}
.screen-scroll{overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; padding-bottom:20px;}

#dots{
  flex:0 0 auto; display:flex; gap:7px; justify-content:center; align-items:center;
  padding:12px 0 6px; z-index:30;
}
#dots i{
  width:5px; height:5px; border-radius:50%; background:var(--fg-faint); display:block;
  transition:background calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease);
}
#dots i.on{background:var(--fg); transform:scale(1.35);}

#ticker{
  flex:0 0 auto; min-height:38px; display:flex; align-items:center; justify-content:center;
  padding:0 26px 16px; font-size:.82rem; color:var(--fg-mid); text-align:center;
  opacity:0; transform:translateY(6px);
  transition:opacity calc(.5s * var(--speed)) var(--ease), transform calc(.5s * var(--speed)) var(--ease);
}
#ticker.show{opacity:1; transform:none;}
#ticker b{font-weight:500; color:var(--fg);}

/* ---------------------------------------------------------------
   HOME / COUNTDOWN
   --------------------------------------------------------------- */
.home-wrap{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:34px; min-height:0;}

.count{display:flex; align-items:flex-start; justify-content:center; gap:clamp(18px,4vw,52px);}
.count-unit{display:flex; flex-direction:column; align-items:center; gap:6px;}
.count-num{
  display:flex; font-weight:200; line-height:1;
  font-size:clamp(3.4rem,13vw,8.5rem); letter-spacing:-.045em;
  color:var(--fg); transition:color calc(.8s * var(--speed)) var(--ease);
}
.count-label{font-size:.72rem; color:var(--fg-soft); letter-spacing:.06em; font-weight:400;}
.count.urgent .count-num{color:var(--accent);}

.digit{display:block; height:var(--dh); overflow:hidden; width:.60em;}
.digit .col{display:block; transition:transform calc(.75s * var(--speed)) var(--ease); will-change:transform;}
.digit .col span{display:block; height:var(--dh); line-height:var(--dh);}
.count-sep{width:.26em;}

.slot{border-top:1px solid var(--line); padding-top:18px; min-height:0; display:flex; flex-direction:column;}
.slot-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  font-size:.74rem; color:var(--fg-soft); margin-bottom:12px;
}
.slot-head .sh-r{color:var(--fg-faint);}
.slot-body{overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; min-height:0;}

.row{
  display:flex; align-items:center; gap:14px; padding:9px 0;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none;}
.row-time{font-size:.8rem; color:var(--fg-soft); flex:0 0 96px; font-variant-numeric:tabular-nums;}
.row-main{flex:1 1 auto; min-width:0;}
.row-title{font-size:.98rem; font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-sub{font-size:.74rem; color:var(--fg-soft); margin-top:2px;}
.row-tag{
  flex:0 0 auto; font-size:.68rem; color:var(--fg-mid);
  border:1px solid var(--line-strong); border-radius:99px; padding:2px 9px;
}
.row.now{position:relative;}
.row.now::before{
  content:""; position:absolute; left:-14px; top:50%; width:4px; height:4px;
  border-radius:50%; background:var(--accent); transform:translateY(-50%);
}
.row.tutor .row-tag{border-color:var(--fg); color:var(--fg);}

.todo{display:flex; align-items:flex-start; gap:13px; padding:14px 16px; margin-bottom:12px;
  border:1px solid var(--line); border-radius:var(--radius); cursor:pointer;}
.todo:last-child{margin-bottom:0;}
.todo.gone{visibility:hidden;}
.todo-badge{
  flex:0 0 auto; font-size:.65rem; font-weight:500; letter-spacing:.02em;
  padding:2px 8px; border-radius:99px; margin-top:2px;
  background:color-mix(in srgb, var(--badge-c) 16%, var(--bg)); color:var(--badge-t, var(--badge-c));
}
.todo-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.box{
  flex:0 0 auto; width:17px; height:17px; border:1.5px solid var(--fg-faint); border-radius:5px;
  margin-top:2px; position:relative;
  transition:border-color calc(.3s * var(--speed)) var(--ease), background calc(.3s * var(--speed)) var(--ease);
}
.box svg{position:absolute; inset:2px; stroke:var(--bg); stroke-width:2.6; fill:none;
  stroke-dasharray:14; stroke-dashoffset:14;
  transition:stroke-dashoffset calc(.35s * var(--speed)) var(--ease);}
.todo.done .box{background:var(--ok); border-color:var(--ok);}
.todo.done .box svg{stroke-dashoffset:0;}
.todo-main{flex:1 1 auto; min-width:0;}
.todo-title{font-size:.96rem; transition:color calc(.3s * var(--speed)) var(--ease);}
.todo.done .todo-title{color:var(--fg-faint); text-decoration:line-through; text-decoration-thickness:1px;}
.todo-meta{font-size:.72rem; color:var(--fg-soft); margin-top:3px;}
.todo-meta .dot{margin:0 6px; color:var(--fg-faint);}
.todo.overdue .todo-meta{color:var(--accent);}

.empty{padding:26px 0; text-align:center; color:var(--fg-soft); font-size:.86rem;}
.empty span{display:block; margin-top:6px; font-size:.75rem; color:var(--fg-faint);}

/* ---------------------------------------------------------------
   CALENDAR
   --------------------------------------------------------------- */
.cal-head{display:flex; align-items:baseline; justify-content:space-between; padding:10px 0 16px;}
.cal-title{font-size:1.15rem; font-weight:400;}
.cal-nav{display:flex; gap:4px; align-items:center;}
.cal-nav button{padding:5px 11px; font-size:.78rem; color:var(--fg-mid); border-radius:var(--radius);}
.cal-nav button:hover{background:var(--field);}

.cal-grid{display:flex; flex-direction:column; flex:1 1 auto; min-height:0;}
.tg-head{display:grid; grid-template-columns:44px repeat(7,1fr); flex:0 0 auto; border-bottom:1px solid var(--line); padding-bottom:8px;}
.tg-headcell{text-align:center; padding-top:2px;}
.tg-headcell .cd-name{font-size:.68rem; color:var(--fg-soft); letter-spacing:.05em; display:block;}
.tg-headcell .cd-num{font-size:.85rem; color:var(--fg-mid); margin-top:2px;}
.tg-headcell.today .cd-name{color:var(--fg); font-weight:500;}
.tg-headcell.today .cd-num{color:var(--fg); font-weight:500;}
.tg-headcell{position:relative;}
.tg-scroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; touch-action:pan-y; overscroll-behavior:contain;}
.tg-inner{display:grid; grid-template-columns:44px repeat(7,1fr); position:relative;}
.tg-hourlabels{display:flex; flex-direction:column;}
.tg-hourlabel{font-size:.6rem; color:var(--fg-faint); text-align:right; padding-right:8px; position:relative; top:-6px; white-space:nowrap;}
.tg-col{position:relative; border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hourpx));}
.tg-col.off{background-color:var(--field);}
.tg-block{
  position:absolute; left:3px; right:3px; border-radius:6px; overflow:hidden;
  background:color-mix(in srgb, var(--sub-c,var(--bg)) 16%, var(--bg));
  border:1px solid color-mix(in srgb, var(--sub-c,var(--bg)) 40%, var(--line-strong));
  font-size:.66rem; line-height:1.35; padding:4px 7px;
}
.tg-block .tg-sub{font-weight:500;}
.tg-block .tg-t{color:var(--fg-mid); font-size:.62rem;}
.tg-block.tutor{border-color:var(--fg); background:color-mix(in srgb, var(--sub-c,var(--bg)) 10%, var(--bg)); box-shadow:inset 2px 0 0 var(--fg);}

@media (max-width:760px){
  .tg-scroll{overflow-x:auto;}
  .tg-head, .tg-inner{grid-template-columns:36px repeat(7,84px); min-width:640px;}
}

/* ---------------------------------------------------------------
   STOPWATCH / TIMER
   --------------------------------------------------------------- */
.tool{flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; min-height:0;}
.tool-label{font-size:.72rem; color:var(--fg-soft); letter-spacing:.09em;}
.tool-time{
  font-size:clamp(3rem,11vw,6.6rem); font-weight:200; letter-spacing:-.04em; line-height:1;
  transition:color calc(.4s * var(--speed)) var(--ease);
}
.tool-time .ms{font-size:.42em; color:var(--fg-soft); letter-spacing:-.02em;}
.tool-time.fire{color:var(--accent);}
.tool-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.btn{
  border:1px solid var(--line-strong); border-radius:99px; padding:9px 24px; font-size:.84rem;
  color:var(--fg-mid);
  transition:border-color calc(.25s * var(--speed)) var(--ease), color calc(.25s * var(--speed)) var(--ease), background calc(.25s * var(--speed)) var(--ease), transform calc(.12s * var(--speed)) ease;
}
.btn:hover{border-color:var(--fg); color:var(--fg);}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--fg); color:var(--bg); border-color:var(--fg);}
.btn.primary:hover{opacity:.85;}
.btn.small{padding:6px 15px; font-size:.76rem;}
.btn.danger{color:var(--accent);}
.btn.danger:hover{border-color:var(--accent);}
.presets{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:460px;}
.preset{border:1px solid var(--line); border-radius:99px; padding:6px 15px; font-size:.78rem; color:var(--fg-mid); position:relative;
  transition:border-color calc(.25s * var(--speed)) var(--ease), color calc(.25s * var(--speed)) var(--ease), transform calc(.12s * var(--speed)) ease;}
.preset:hover{border-color:var(--fg-soft); color:var(--fg);}
.preset:active{transform:scale(.95);}
.laps{max-height:150px; overflow-y:auto; touch-action:pan-y; width:min(340px,80vw); border-top:1px solid var(--line);}
.lap{display:flex; justify-content:space-between; padding:7px 0; font-size:.8rem; color:var(--fg-mid); border-bottom:1px solid var(--line);}
.lap span:first-child{color:var(--fg-soft); font-size:.72rem;}

/* ---------------------------------------------------------------
   SHEETS / PANELS
   --------------------------------------------------------------- */
.scrim{
  position:fixed; inset:0; background:rgba(0,0,0,.28); opacity:0; pointer-events:none; z-index:60;
  transition:opacity calc(.4s * var(--speed)) var(--ease);
}
.scrim.on{opacity:1; pointer-events:auto;}

.sheet{
  position:fixed; left:50%; bottom:0; width:min(520px,100%); max-height:92vh; z-index:70;
  background:var(--bg); border-radius:18px 18px 0 0;
  border:1px solid var(--line); border-bottom:none;
  transform:translate(-50%,102%);
  transition:transform calc(.5s * var(--speed)) var(--ease);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 -8px 40px rgba(0,0,0,.07);
}
.sheet.on{transform:translate(-50%,0);}

#qaSheet{
  left:0; bottom:0; width:100%; height:100%; max-height:none;
  border-radius:0; border:none;
  transform:translateY(100%);
}
#qaSheet.on{transform:translateY(0);}
#qaSheet .sheet-grip{display:none;}
#qaSheet .sheet-head{
  padding:calc(16px + env(safe-area-inset-top,0px)) 22px 12px;
  border-bottom:1px solid var(--line); flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between;
}
#qaSheet .qa-clock{font-size:.82rem; color:var(--fg-mid); display:flex; gap:10px; align-items:baseline;}
#qaSheet .qa-clock b{color:var(--fg); font-weight:500;}
#qaSheet .sheet-body{flex:1 1 auto; max-width:640px; width:100%; margin:0 auto; padding:18px 22px calc(22px + env(safe-area-inset-bottom,0px));}
.sheet-grip{width:34px; height:3px; border-radius:99px; background:var(--fg-faint); margin:10px auto 0; flex:0 0 auto;}
.sheet-head{padding:14px 22px 10px; display:flex; align-items:baseline; justify-content:space-between; flex:0 0 auto;}
.sheet-title{font-size:1.02rem; font-weight:400;}
.sheet-body{padding:6px 22px 22px; overflow-y:auto; touch-action:pan-y; flex:1 1 auto;}

.panel{
  position:fixed; top:0; right:0; height:100%; width:min(430px,100%); z-index:70;
  background:var(--bg); border-left:1px solid var(--line);
  transform:translateX(102%);
  transition:transform calc(.5s * var(--speed)) var(--ease);
  display:flex; flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,0,0,.07);
}
.panel.on{transform:none;}
.panel-head{padding:20px 22px 12px; display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--line); flex:0 0 auto;}
.panel-body{padding:4px 22px 40px; overflow-y:auto; touch-action:pan-y; flex:1 1 auto;}
.x{font-size:.8rem; color:var(--fg-soft); padding:4px 8px; border-radius:6px;}
.x:hover{color:var(--fg); background:var(--field);}

/* form bits */
.f{margin-bottom:15px;}
.f > label{display:block; font-size:.72rem; color:var(--fg-soft); margin-bottom:6px; letter-spacing:.02em;}
.f input[type=text], .f input[type=password], .f input[type=email], .f input[type=date], .f input[type=time], .f input[type=number], .f select, .f textarea{
  width:100%; background:var(--field); border:1px solid transparent; border-radius:var(--radius);
  padding:11px 13px; font-size:.92rem;
  transition:border-color calc(.25s * var(--speed)) var(--ease), background calc(.25s * var(--speed)) var(--ease);
}
.f input:focus, .f select:focus, .f textarea:focus{border-color:var(--fg-faint); background:var(--bg);}
.f select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--fg-soft) 50%),linear-gradient(135deg,var(--fg-soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px;}
.f-row{display:flex; gap:10px;}
.f-row > *{flex:1 1 0; min-width:0;}
.f-hint{font-size:.71rem; color:var(--fg-soft); margin-top:5px; line-height:1.45;}
.f-actions{display:flex; gap:9px; margin-top:20px;}
.f-actions .btn{flex:1 1 auto; text-align:center;}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{border:1px solid var(--line-strong); border-radius:99px; padding:6px 13px; font-size:.79rem; color:var(--fg-mid);
  transition:border-color calc(.25s * var(--speed)) var(--ease), color calc(.25s * var(--speed)) var(--ease), background calc(.25s * var(--speed)) var(--ease), transform calc(.12s * var(--speed)) ease;}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg);}
.chip:active{transform:scale(.95);}
.switch{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.switch:last-child{border-bottom:none;}
.switch-t{font-size:.9rem;}
.switch-d{font-size:.71rem; color:var(--fg-soft); margin-top:3px; max-width:88%; line-height:1.4;}
.track{flex:0 0 auto; width:38px; height:22px; border-radius:99px; background:var(--fg-faint); position:relative; transition:background calc(.3s * var(--speed)) var(--ease);}
.track i{position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:99px; background:var(--bg); transition:transform calc(.3s * var(--speed)) var(--ease);}
.switch.on .track{background:var(--fg);}
.switch.on .track i{transform:translateX(16px);}

.sect{margin:26px 0 0;}
.sect > h3{font-size:.72rem; color:var(--fg-soft); letter-spacing:.06em; margin-bottom:10px; font-weight:400;}
.sect-list{border-top:1px solid var(--line);}
.item{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line);}
.item-main{flex:1 1 auto; min-width:0;}
.item-t{font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-d{font-size:.71rem; color:var(--fg-soft); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-btn{flex:0 0 auto; font-size:.74rem; color:var(--fg-soft); padding:5px 9px; border-radius:6px;}
.item-btn:hover{background:var(--field); color:var(--fg);}
.item-btn.danger:hover{color:var(--accent);}
.swatch{flex:0 0 auto; width:11px; height:11px; border-radius:3px; border:1px solid var(--line-strong);}
.add-line{display:flex; gap:8px; margin-top:12px;}
.add-line input{flex:1 1 auto;}
.add-line .btn{flex:0 0 auto;}

/* colour field */
.cf{display:flex; gap:8px; align-items:stretch;}
.cf input[type=text]{flex:1 1 auto; min-width:0;}
.cf input[type=color]{
  flex:0 0 46px; width:46px; padding:0;
  border:1px solid var(--line); border-radius:var(--radius);
  background:var(--field); cursor:pointer;
}
.cf input[type=color]::-webkit-color-swatch-wrapper{padding:3px;}
.cf input[type=color]::-webkit-color-swatch{border:none; border-radius:calc(var(--radius) - 3px);}
.cf input[type=color]::-moz-color-swatch{border:none; border-radius:calc(var(--radius) - 3px);}

/* ---------------------------------------------------------------
   EDIT MODE
   --------------------------------------------------------------- */
#editbar{
  position:fixed; left:50%; bottom:20px; transform:translate(-50%,calc(100% + 30px)); z-index:55;
  background:var(--fg); color:var(--bg); border-radius:99px; padding:9px 10px 9px 18px;
  display:flex; align-items:center; gap:12px; font-size:.79rem;
  transition:transform calc(.45s * var(--speed)) var(--ease);
  box-shadow:0 6px 26px rgba(0,0,0,.16);
}
#editbar.on{transform:translate(-50%,0);}
#editbar button{background:var(--bg); color:var(--fg); border-radius:99px; padding:5px 13px; font-size:.76rem;}

.gear{
  position:absolute; z-index:20; width:22px; height:22px; border-radius:50%;
  background:var(--bg); border:1px solid var(--line-strong);
  display:none; align-items:center; justify-content:center;
  opacity:0; transform:scale(.7);
  transition:opacity calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease), border-color calc(.2s * var(--speed)) var(--ease);
}
.gear svg{width:12px; height:12px; stroke:var(--fg-mid); fill:none; stroke-width:1.7;}
.gear:hover{border-color:var(--fg);}
.gear:hover svg{stroke:var(--fg);}
body.edit .gear{display:flex; opacity:1; transform:none;}
body.edit .editable{position:relative;}
body.edit .editable::after{
  content:""; position:absolute; inset:-5px -8px; border:1px dashed var(--fg-faint);
  border-radius:8px; pointer-events:none;
}
.gear.g-tr{top:-9px; right:-9px;}
.gear.g-inline{position:static; margin-left:6px; flex:0 0 auto;}

#toast{
  position:fixed; left:50%; bottom:74px; transform:translate(-50%,20px); z-index:90;
  background:var(--fg); color:var(--bg); font-size:.79rem; padding:9px 17px; border-radius:99px;
  opacity:0; pointer-events:none;
  transition:opacity calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease);
}
#toast.on{opacity:1; transform:translate(-50%,0);}
.range-wrap{
  display:flex; align-items:center; gap:12px; width:100%;
  background:var(--field); border-radius:var(--radius); padding:10px 13px;
}
.f input[type=range]{
  flex:1 1 auto; width:100%; padding:0; accent-color:var(--fg);
}
.range-val{
  flex:0 0 48px; text-align:right; font-size:.72rem; color:var(--fg-soft);
}

.hint-up{
  position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
  font-size:.7rem; color:var(--fg-faint); display:flex; align-items:center; gap:6px;
  pointer-events:none;
}

/* ---------------------------------------------------------------
   AUTH GATE / SETUP NOTICE  (macOS-style card)
   --------------------------------------------------------------- */
#gate{
  position:fixed; inset:0; z-index:200;
  background:color-mix(in srgb, var(--field) 55%, var(--bg));
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#gate.hidden{display:none;}
.gate-card{
  width:min(440px,100%);
  background:var(--bg); border:1px solid var(--line); border-radius:20px;
  padding:28px; box-shadow:0 18px 60px rgba(0,0,0,.14);
  animation:auRise calc(.35s * var(--speed)) var(--ease);
}
.gate-err{font-size:.78rem; color:var(--accent); min-height:1.2em; margin-top:10px;}
.gate-setup{
  width:min(540px,100%); font-size:.86rem; line-height:1.7; color:var(--fg-mid);
  background:var(--bg); border:1px solid var(--line); border-radius:20px;
  padding:28px; box-shadow:0 18px 60px rgba(0,0,0,.14);
  overflow-y:auto; touch-action:pan-y; max-height:calc(100vh - 48px);
  animation:auRise calc(.35s * var(--speed)) var(--ease);
}
.gate-setup h1{font-size:1.15rem; font-weight:400; color:var(--fg); margin-bottom:14px;}
.gate-setup ol{padding-left:1.15em; margin:12px 0;}
.gate-setup code{background:var(--field); padding:1px 6px; border-radius:4px; font-size:.85em;}
.gate-setup pre{background:var(--field); border-radius:var(--radius); padding:14px; font-size:.76rem;
  overflow-x:auto; white-space:pre; margin:12px 0; line-height:1.5;}
/* ---------------------------------------------------------------
   NEW: phase-block editor
   --------------------------------------------------------------- */
.phase-blocks{display:flex; flex-direction:column; gap:6px; margin:6px 0;}
.phase-block{display:flex; align-items:center; gap:8px; border:1px solid var(--line); border-radius:var(--radius); padding:7px 9px;}
.phase-block .phase-label{flex:1 1 auto; font-size:.82rem; background:none; border:none;}
.phase-pct{font-size:.72rem; color:var(--fg-soft); flex:0 0 auto;}
.phase-rm{flex:0 0 auto; color:var(--fg-faint); font-size:.8rem; padding:2px 6px;}
.phase-rm:hover{color:var(--accent);}

/* ---------------------------------------------------------------
   NEW: subject-tinted task cards + colored custom dropdowns
   --------------------------------------------------------------- */
.todo{ background:color-mix(in srgb, var(--card-c,var(--bg)) 9%, var(--bg)); position:relative; }
.todo.done .todo-title{ text-decoration:line-through; }

.csel{position:relative;}
.csel-btn{width:100%; text-align:left; display:flex; align-items:center; gap:8px; padding:9px 11px;
  border:1px solid var(--line); border-radius:var(--radius); background:var(--bg); cursor:pointer;}
.csel-dot{width:10px; height:10px; border-radius:99px; flex:0 0 auto; background:var(--dot-c,var(--fg-faint));}
.csel-pop{position:absolute; z-index:40; top:calc(100% + 4px); left:0; right:0; max-height:260px; overflow-y:auto; touch-action:pan-y;
  background:var(--bg); border:1px solid var(--line-strong); border-radius:var(--radius); box-shadow:0 6px 24px rgba(0,0,0,.14);}
.csel-opt{display:flex; align-items:center; gap:9px; padding:9px 11px; cursor:pointer; font-size:.86rem;
  background:color-mix(in srgb, var(--opt-c,transparent) 12%, var(--bg));}
.csel-opt:hover{background:color-mix(in srgb, var(--opt-c,transparent) 22%, var(--bg));}
.csel-opt .csel-dot{background:var(--opt-c,var(--fg-faint));}

.method-info{margin:8px 0 2px; padding:10px 12px; border-radius:var(--radius);
  border:1.5px dashed var(--info-c,var(--line-strong));
  background:color-mix(in srgb, var(--info-c,transparent) 10%, var(--bg));
  font-size:.78rem; color:var(--fg-mid); line-height:1.4;}

/* ---------------------------------------------------------------
   TASK DETAIL / RAPIDFIRE — the expanding card (FLIP)
   --------------------------------------------------------------- */
#taskDetail,#rfOverlay{
  position:fixed; inset:0; z-index:62; display:flex; align-items:center; justify-content:center;
  pointer-events:none; visibility:hidden;
  background:rgba(0,0,0,0);
  transition:background calc(.3s * var(--speed)) ease;
}
#taskDetail.on,#rfOverlay.on{
  pointer-events:auto; visibility:visible;
  background:rgba(0,0,0,.28);
}

.td-card{
  position:relative;
  display:flex; flex-direction:column;
  width:min(96vw,1000px); max-height:90vh; min-height:min(74vh,580px);
  overflow-y:auto; touch-action:pan-y;
  background:color-mix(in srgb, var(--card-c,var(--bg)) 7%, var(--bg));
  border:1px solid var(--line-strong); border-radius:calc(var(--radius) * 1.6);
  padding:26px 28px calc(24px + env(safe-area-inset-bottom,0px));
  box-shadow:0 24px 64px rgba(0,0,0,.25);
  transition:transform calc(.3s * var(--speed)) var(--ease), opacity calc(.26s * var(--speed)) ease;
}
.td-card.flip{
  min-height:0; overflow:hidden;
  transition:
    left   calc(.36s * var(--speed)) var(--ease),
    top    calc(.36s * var(--speed)) var(--ease),
    width  calc(.36s * var(--speed)) var(--ease),
    height calc(.36s * var(--speed)) var(--ease);
}
.td-card.zoomout{ transform:scale(1.22); opacity:0; }
.td-card.fadeout{ transform:scale(.97); opacity:0; }

.td-inner{
  flex:1 0 auto;
  max-width:360px;
  transition:opacity calc(.26s * var(--speed)) ease, transform calc(.26s * var(--speed)) ease;
}
.td-card.primed .td-inner{ opacity:0; transform:translateY(6px); pointer-events:none; }
.td-icons{
  position:absolute; top:16px; right:18px; display:flex; gap:8px; z-index:5;
  transition:opacity calc(.26s * var(--speed)) ease;
}
.td-card.primed .td-icons{ opacity:0; pointer-events:none; }
.td-actions{
  display:flex; gap:10px; margin-top:auto; align-self:center; padding-top:18px;
  transition:opacity calc(.26s * var(--speed)) ease;
}
.td-card.primed .td-actions{ opacity:0; pointer-events:none; }
.td-actions .btn{flex:0 0 auto;}

.td-ghost{
  position:absolute; inset:0; display:flex; align-items:flex-start; gap:13px;
  padding:14px 16px; overflow:hidden; pointer-events:none;
  transition:opacity calc(.18s * var(--speed)) ease;
}
.td-ghost.fade{ opacity:0; }
.td-ghost.btnish{
  align-items:center; justify-content:center; padding:0;
  color:var(--fg-mid); font-size:.79rem;
}

.td-badge{font-size:.68rem; padding:2px 9px; border-radius:99px; color:var(--badge-t, var(--badge-c)); background:color-mix(in srgb, var(--badge-c) 16%, var(--bg));}
.td-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.td-title-row .td-title{margin-bottom:0;}
.td-icon{width:30px; height:30px; border-radius:99px; display:flex; align-items:center; justify-content:center; color:var(--fg-mid); border:1px solid var(--line);}
.td-icon.danger{color:#c0392b; border-color:#c0392b55;}
.td-icon svg{width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.td-title{font-size:1.05rem; margin-bottom:4px;}
.td-meta{font-size:.8rem; color:var(--fg-mid); margin-bottom:16px;}
.td-window{font-size:.72rem; color:var(--fg-soft); margin-bottom:14px;}
.td-phases{border-top:1px solid var(--line); padding-top:12px; margin-bottom:4px;}
.td-phase{display:flex; justify-content:space-between; gap:12px; padding:6px 0; font-size:.82rem; border-bottom:1px solid var(--line);}
.td-phase:last-child{border-bottom:none;}
.td-ph-l{flex:1 1 auto; min-width:0; line-height:1.4;}
.td-ph-t{color:var(--fg-soft); flex:0 0 auto; font-variant-numeric:tabular-nums;}

.rf-card{display:flex; flex-direction:column;}
.rf-inner{max-width:none; display:flex; flex-direction:column; flex:1 1 auto; min-height:0;}
.rf-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:2px;}
.rf-list{flex:1 1 auto; overflow-y:auto; touch-action:pan-y; min-height:0; margin:12px 0 8px; padding-right:4px;}
.rfc.picked .box{background:var(--ok); border-color:var(--ok);}
.rfc.picked .box svg{stroke-dashoffset:0;}
.rfc:not(.picked){opacity:.55;}
.rf-total{font-size:.85rem; color:var(--fg-mid); line-height:1.4; text-align:center; padding:4px 0 2px;}
.rf-btnrow{display:flex; gap:10px; justify-content:center; margin-top:6px;}

@media (max-width:760px){
  .td-inner{max-width:none; padding-right:76px;}
}

/* ---------------------------------------------------------------
   TASK RUN (fullscreen, distraction-free)
   --------------------------------------------------------------- */
#taskRun{
  position:fixed; inset:0; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:var(--bg); opacity:0; pointer-events:none;
  transform:scale(1.12);
  transition:opacity calc(.5s * var(--speed)) var(--ease), transform calc(.5s * var(--speed)) var(--ease);
}
#taskRun.on{ opacity:1; pointer-events:auto; transform:scale(1); }
.tr-task{font-size:.8rem; color:var(--fg-soft); letter-spacing:.02em; margin-bottom:12px;
  max-width:80vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tr-phase{font-size:1.05rem; color:var(--fg-mid); text-align:center; max-width:80vw; margin-bottom:22px;}
.tr-clock{font-size:clamp(3rem,14vw,6.5rem); font-variant-numeric:tabular-nums; letter-spacing:.02em;}
.tr-clock.pulse{animation:trPulse .6s var(--ease);}
@keyframes trPulse{0%{transform:scale(1)}35%{transform:scale(1.05)}100%{transform:scale(1)}}
html[data-animations="off"] .tr-clock.pulse{animation:none;}
.tr-next{font-size:.78rem; color:var(--fg-faint); margin-top:14px;}
.tr-btns{display:flex; gap:16px; margin-top:34px;}
.tr-btns button{padding:11px 26px; border-radius:99px; border:1px solid var(--line-strong); font-size:.85rem;}
.tr-btns button.primary{background:var(--fg); color:var(--bg); border-color:var(--fg);}

/* ---------------------------------------------------------------
   ARCHIVE
   --------------------------------------------------------------- */
#archiveScreen{position:fixed; inset:0; z-index:52; background:var(--bg); display:flex; flex-direction:column;
  transform:translateY(100%); opacity:0; transition:transform calc(.4s * var(--speed)) var(--ease), opacity calc(.3s * var(--speed)) var(--ease); pointer-events:none;}
#archiveScreen.on{transform:translateY(0); opacity:1; pointer-events:auto;}
.ar-head{display:flex; align-items:center; justify-content:space-between; padding:calc(16px + env(safe-area-inset-top,0px)) 22px 10px; border-bottom:1px solid var(--line);}
.ar-filters{display:flex; gap:6px; flex-wrap:wrap;}
.ar-right{display:flex; align-items:center; gap:10px;}
.ar-search{width:170px; background:var(--field); border:1px solid transparent; border-radius:var(--radius); padding:7px 11px; font-size:.8rem;}
.ar-search:focus{border-color:var(--fg-faint); background:var(--bg);}
.ar-body{flex:1 1 auto; overflow-y:auto; touch-action:pan-y; padding:14px 22px 30px;}
.ar-daygroup{margin-bottom:22px;}
.ar-daylabel{font-size:.72rem; color:var(--fg-faint); letter-spacing:.06em; margin-bottom:8px;}
.ar-item{display:flex; align-items:flex-start; gap:12px; padding:12px 14px; margin-bottom:10px;
  border:1px solid var(--line); border-radius:var(--radius);
  background:color-mix(in srgb, var(--card-c,var(--bg)) 8%, var(--bg));}
.ar-item .ar-t{font-size:.92rem; overflow:hidden; text-overflow:ellipsis;}
.ar-item.done .ar-t{color:var(--fg-faint); text-decoration:line-through; text-decoration-thickness:1px;}
.ar-item .ar-m{font-size:.72rem; color:var(--fg-soft); margin-top:3px;}
.ar-item.missed .ar-m{color:var(--accent);}
.ar-empty{padding:30px 0; text-align:center; color:var(--fg-soft); font-size:.86rem;}

/* ---------------------------------------------------------------
   CALENDAR TASK BLOCKS (subject fill + finished/overdue stripes)
   --------------------------------------------------------------- */
.tg-task{
  position:absolute; left:3px; right:3px; border-radius:6px; overflow:hidden;
  border:2px solid var(--task-c,var(--line-strong));
  background:color-mix(in srgb, var(--task-c,transparent) 22%, var(--bg));
  font-size:.64rem; line-height:1.3; padding:4px 6px; cursor:pointer;
}
.tg-task .tg-sub{font-weight:500;}
.tg-task .tg-t{color:var(--fg-mid); font-size:.6rem;}
.tg-task.done::after, .tg-task.overdue::after{
  content:""; position:absolute; inset:0; pointer-events:none;
  background-image:repeating-linear-gradient(45deg, var(--stripe-c) 0 4px, transparent 4px 10px);
  opacity:.4;
}
.tg-task.done{ --stripe-c:var(--fg-faint); }
.tg-task.overdue{ --stripe-c:#c0392b; border-color:#c0392b; }

/* ---------------------------------------------------------------
   Centered home column
   --------------------------------------------------------------- */
.slot-body{max-width:1320px; margin:0 auto;}
.btn:disabled{opacity:.45; pointer-events:none;}

/* ---------------------------------------------------------------
   v7.0: STATS SCREEN + editbar fit
   --------------------------------------------------------------- */
#statsScreen{position:fixed; inset:0; z-index:52; background:var(--bg); display:flex; flex-direction:column;
  transform:translateY(100%); opacity:0; transition:transform calc(.4s * var(--speed)) var(--ease), opacity calc(.3s * var(--speed)) var(--ease); pointer-events:none;}
#statsScreen.on{transform:translateY(0); opacity:1; pointer-events:auto;}
.st-head{display:flex; align-items:center; justify-content:space-between; padding:calc(16px + env(safe-area-inset-top,0px)) 22px 10px; border-bottom:1px solid var(--line);}
.st-title{font-size:1.02rem; font-weight:400;}
.st-body{flex:1 1 auto; overflow-y:auto; touch-action:pan-y; padding:16px 22px 34px; width:100%; max-width:1000px; margin:0 auto;}
.st-sect{margin:28px 0 0;}
.st-sect > h3{font-size:.72rem; color:var(--fg-soft); letter-spacing:.06em; margin-bottom:12px; font-weight:400;}
.st-cards{display:grid; grid-template-columns:repeat(4,1fr); gap:10px;}
.st-card{border:1px solid var(--line); border-radius:calc(var(--radius)*1.2); padding:14px 16px;}
.st-card .st-num{font-size:1.75rem; font-weight:200; letter-spacing:-.02em; line-height:1.15;}
.st-card .st-sub{font-size:.71rem; color:var(--fg-soft); margin-top:4px; line-height:1.4;}
.st-card.wide{grid-column:1 / -1;}
.st-mini{margin-top:10px;}
.st-mini svg{display:block; width:100%; max-width:360px; height:auto;}
.st-chart svg{display:block; width:100%; height:auto;}
.st-headrow{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
.st-big{font-size:1.02rem; color:var(--fg-mid);}
.st-big b{font-weight:500; color:var(--fg);}
.st-chart{border:1px solid var(--line); border-radius:calc(var(--radius)*1.2); padding:14px 10px 8px; overflow:hidden;}
.st-bars .st-hrow{display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--line);}
.st-bars .st-hrow:last-child{border-bottom:none;}
.st-hlabel{flex:0 0 128px; font-size:.78rem; display:flex; align-items:center; gap:7px; min-width:0;}
.st-hlabel span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.st-htrack{flex:1 1 auto; height:10px; border-radius:99px; background:var(--field); overflow:hidden; position:relative;}
.st-hfill{position:absolute; top:0; bottom:0; left:0; border-radius:99px;}
.st-hval{flex:0 0 86px; text-align:right; font-size:.74rem; color:var(--fg-mid); font-variant-numeric:tabular-nums; white-space:nowrap;}
.st-dual .st-hrow{display:block; padding:9px 0;}
.st-dualline{display:flex; align-items:center; gap:10px; padding:2px 0;}
.st-dualline .st-htrack{height:7px;}
.st-note{font-size:.78rem; color:var(--fg-soft); padding:6px 0;}
.st-legend{display:flex; gap:16px; font-size:.7rem; color:var(--fg-soft); margin:0 0 10px; flex-wrap:wrap;}
.st-legend span{display:flex; align-items:center; gap:6px;}
.st-legend i{display:inline-block; width:10px; height:10px; border-radius:3px;}
@media (max-width:760px){
  .st-cards{grid-template-columns:repeat(2,1fr);}
  .st-hlabel{flex-basis:104px;}

  #editbar{left:12px; right:12px; transform:translateY(calc(100% + 30px)); justify-content:center; flex-wrap:wrap; padding:7px 8px 7px 14px; gap:8px;}
  #editbar.on{transform:translateY(0);}
  #editbar button{padding:5px 9px; font-size:.72rem;}
}

/* ---------------------------------------------------------------
   v7.1: SETUP WIZARD + modern auth
   v7.1.2: dots centred ABOVE the card · fixed 820px two-column card ·
   gradient theme shows through a transparent backdrop
   --------------------------------------------------------------- */
#app{transition:opacity .55s var(--ease), transform .55s var(--ease);}
#app.wiz-veiled{opacity:0; transform:scale(.965);}

#wizard{position:fixed; inset:0; z-index:50;
  background:color-mix(in srgb, var(--field) 55%, var(--bg));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  padding:calc(16px + env(safe-area-inset-top,0px)) 20px calc(16px + env(safe-area-inset-bottom,0px));
  transition:opacity .45s var(--ease), transform .45s var(--ease);}
#wizard[hidden]{display:none;}
#wizard.wz-pre{opacity:0; transform:scale(1.015);}
#wizard.zoomaway{opacity:0; transform:scale(.92); pointer-events:none;}
#wizard.wz-grad{background:transparent;}   /* the live time-of-day gradient shows through */

.wz-dotsrow {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 9999;
  padding-top: 34px; /* Optional: keeps dots from touching the raw top edge */
  
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  gap: 6px; 
  flex: 0 0 auto;
}

.wz-dots { display: flex; gap: 6px; }

.wz-dots i {
  width: 6px; 
  height: 6px; 
  border-radius: 50%; 
  background: var(--fg-faint);
  transition: background calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease);
}

.wz-dots i.on { background: var(--fg); transform: scale(1.4); }

.wz-count { font-size: .64rem; color: var(--fg-faint); letter-spacing: .08em; }

.wz-card{width:820px; max-width:100%; max-height:calc(100% - 72px); display:flex; flex-direction:column;
  background:var(--bg); border:1px solid var(--line); border-radius:22px;
  box-shadow:0 24px 70px rgba(0,0,0,.16); overflow:hidden;}

.wz-body{flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y;
  display:flex; flex-direction:column; min-height:0; padding:0 28px;}
.wz-stage{width:100%; margin:auto; padding:12px 0 16px;
  transition:opacity .17s var(--ease), transform .32s var(--ease);}
.wz-stage.wz-out-f{opacity:0; transform:translateX(-26px);}
.wz-stage.wz-out-b{opacity:0; transform:translateX(26px);}
.wz-stage.wz-out-x{opacity:0;}
.wz-stage.wz-jump-f{transition:none; opacity:0; transform:translateX(26px);}
.wz-stage.wz-jump-b{transition:none; opacity:0; transform:translateX(-26px);}
.wz-stage.wz-jump-x{transition:none; opacity:0;}

.wz-foot{flex:0 0 auto; display:flex; justify-content:space-between; gap:10px;
  padding:14px 28px 18px; border-top:1px solid var(--line);}
.wz-foot .btn{min-width:132px;}

/* two-column step layout: icon/title/description left, controls right */
.wz-cols{display:flex; gap:30px;}
.wz-left{flex:0 0 225px;}
.wz-left .wz-icon{width:46px; height:46px; margin:0 0 14px;}
.wz-left .wz-title{text-align:left; font-size:1.28rem; margin-bottom:8px;}
.wz-left .wz-sub{text-align:left; margin-bottom:0;}
.wz-right{flex:1 1 auto; min-width:0;}
.wz-stage.wz-wide{max-width:460px; margin-left:auto; margin-right:auto;}

.wz-icon{width:60px; height:60px; display:block; margin:0 auto 16px;}
.wz-title{font-size:1.5rem; font-weight:var(--fw-display,200); letter-spacing:-.02em; text-align:center; margin-bottom:8px;}
.wz-sub{font-size:.88rem; color:var(--fg-mid); text-align:center; line-height:1.55; margin-bottom:24px;}
.wz-label{font-size:.72rem; color:var(--fg-soft); margin:14px 0 8px; letter-spacing:.02em;}
.wz-cap{font-size:.64rem; color:var(--fg-faint); text-align:center; margin:4px 0 18px; letter-spacing:.05em;}

/* modern auth card (gate + wizard account step) — rises in on every build,
   so tab switches and the existing-account swap animate for free */
@keyframes auRise{from{opacity:0; transform:translateY(10px);}to{opacity:1; transform:none;}}
.au-card{width:min(400px,100%); margin:0 auto; animation:auRise calc(.35s * var(--speed)) var(--ease);}
.au-icon{width:44px; height:44px; display:block; margin:0 auto 14px;}
.au-title{font-size:1.45rem; font-weight:var(--fw-display,200); letter-spacing:-.02em; text-align:center; margin-bottom:6px;}
.au-sub{font-size:.85rem; color:var(--fg-mid); text-align:center; margin-bottom:22px; line-height:1.5;}
.au-tabs{display:flex; gap:4px; background:var(--field); border-radius:99px; padding:4px; margin-bottom:18px;}
.au-tabs button{flex:1 1 0; padding:8px 0; font-size:.82rem; color:var(--fg-mid); border-radius:99px;
  transition:background calc(.25s * var(--speed)) var(--ease), color calc(.25s * var(--speed)) var(--ease), transform calc(.12s * var(--speed)) ease;}
.au-tabs button:active{transform:scale(.96);}
.au-tabs button.on{background:var(--bg); color:var(--fg); box-shadow:0 1px 4px rgba(0,0,0,.10);}
.au-pw{position:relative;}
.au-pw input{padding-right:44px;}
.au-eye{position:absolute; right:7px; top:50%; transform:translateY(-50%);
  width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  color:var(--fg-soft); border-radius:7px;}
.au-eye:hover{color:var(--fg); background:var(--field);}
.au-eye svg{width:16px; height:16px; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.au-go{width:100%; margin-top:16px; padding:12px 0; font-size:.9rem;}
.wz-signed{border:1px solid var(--line); border-radius:calc(var(--radius)*1.2); padding:16px; text-align:center; font-size:.85rem; color:var(--fg-mid);}
.wz-signed b{color:var(--fg); font-weight:500; display:block; margin-top:5px; word-break:break-all;}

/* the "account already exists" panel that fades in after signing in
   with an existing account during setup */
.wz-existing{text-align:left; animation:auRise calc(.35s * var(--speed)) var(--ease);}
.wz-ex-check{width:42px; height:42px; margin-bottom:14px;}
.wz-ex-check svg{width:100%; height:100%; stroke:var(--ok); fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round;}
.wz-ex-title{font-size:1.2rem; font-weight:var(--fw-display,200); letter-spacing:-.02em; margin-bottom:6px;}
.wz-ex-sub{font-size:.84rem; color:var(--fg-mid); line-height:1.55; margin-bottom:20px;}
.wz-ex-sub b{color:var(--fg); font-weight:500; word-break:break-all;}
.wz-ex-btns{display:flex; flex-direction:column; gap:9px;}
.wz-ex-btns .btn{width:100%;}

/* wizard widgets */
.wz-prev{display:flex; gap:clamp(18px,6vw,44px); justify-content:center; margin:6px 0 26px;}
.wz-prev .u{display:flex; flex-direction:column; align-items:center; gap:5px;}
.wz-prev b{font-size:2.5rem; font-weight:var(--fw-display,200); letter-spacing:-.03em; line-height:1;}
.wz-prev span{font-size:.68rem; color:var(--fg-soft); letter-spacing:.06em;}

.wz-subs{border-top:1px solid var(--line);}
.wz-sub-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
.wz-dot{position:relative; flex:0 0 26px; width:26px; height:26px; border-radius:8px;
  border:1px solid var(--line-strong); cursor:pointer; overflow:hidden;}
.wz-dot input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;}
.wz-sub-name{flex:1 1 auto; min-width:0; background:var(--field); border:1px solid transparent;
  border-radius:var(--radius); padding:8px 11px; font-size:.9rem;}
.wz-sub-name:focus{border-color:var(--fg-faint); background:var(--bg); outline:none;}
.wz-sub-wt{flex:0 0 66px; background:var(--field); border:1px solid transparent;
  border-radius:var(--radius); padding:8px 4px; font-size:.85rem; text-align:center;}
.wz-sub-wt:focus{border-color:var(--fg-faint); background:var(--bg); outline:none;}
.wz-sub-rm{flex:0 0 auto; color:var(--fg-faint); font-size:.85rem; padding:5px 8px; border-radius:6px;}
.wz-sub-rm:hover{color:var(--accent);}

.wz-tl{position:relative; height:34px; border-radius:8px; background:var(--field); overflow:hidden; margin-top:4px;}
.wz-tl .seg{position:absolute; top:4px; bottom:4px; border-radius:5px;}
.wz-tl .seg.m,.wz-tl .seg.a{background:color-mix(in srgb, var(--fg) 20%, var(--bg));}
.wz-tl .seg.e{background:color-mix(in srgb, var(--accent) 14%, var(--bg));
  border:1.5px dashed color-mix(in srgb, var(--accent) 50%, var(--bg));}

.wz-eve{position:relative; height:34px; border-radius:8px; background:var(--field); overflow:hidden; margin-top:4px;}
.wz-eve .z{position:absolute; top:4px; bottom:4px;}
.wz-eve .z.ok{background:color-mix(in srgb, var(--ok) 20%, var(--bg)); border-radius:5px 0 0 5px;}
.wz-eve .z.warn{background:color-mix(in srgb, var(--accent) 22%, var(--bg));}
.wz-eve .z.stop{background:color-mix(in srgb, var(--accent) 48%, var(--bg)); border-radius:0 5px 5px 0;}

.wz-btnrow{display:flex; gap:9px; margin-bottom:16px;}
.wz-btnrow .btn{flex:1 1 0;}

.wz-tickerdemo{margin-top:20px; padding:11px; border:1px dashed var(--line-strong);
  border-radius:var(--radius); text-align:center; font-size:.82rem; color:var(--fg-mid);}
.wz-tickerdemo b{font-weight:500; color:var(--fg);}

.wz-clockcards{display:flex; gap:10px;}
.wz-clockcard{flex:1 1 0; border:1px solid var(--line-strong); border-radius:calc(var(--radius)*1.2);
  padding:22px 10px; text-align:center; cursor:pointer;
  transition:border-color calc(.2s * var(--speed)) var(--ease), transform calc(.12s * var(--speed)) ease;}
.wz-clockcard:active{transform:scale(.97);}
.wz-clockcard.on{border-color:var(--fg); box-shadow:0 0 0 1px var(--fg);}
.wz-clockcard b{display:block; font-size:1.5rem; font-weight:var(--fw-display,200); letter-spacing:-.02em; margin-bottom:8px;}
.wz-clockcard span{font-size:.72rem; color:var(--fg-soft);}

.wz-themecards{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:16px;}
.wz-thcard{border:1px solid var(--line-strong); border-radius:calc(var(--radius)*1.2);
  padding:9px; cursor:pointer; text-align:center;
  transition:border-color calc(.2s * var(--speed)) var(--ease), transform calc(.12s * var(--speed)) ease;}
.wz-thcard:active{transform:scale(.97);}
.wz-thcard.on{border-color:var(--fg); box-shadow:0 0 0 1px var(--fg);}
.wz-thprev{position:relative; height:56px; border-radius:8px; margin-bottom:8px; overflow:hidden; border:1px solid var(--line);}
.wz-thprev i{position:absolute; left:11%; right:11%; height:4px; border-radius:2px;}
.wz-thprev i:first-child{top:14px;}
.wz-thprev i:last-child{top:26px;}
.wz-thcard span{font-size:.74rem; color:var(--fg-mid);}

.wz-typeprev{border:1px solid var(--line); border-radius:calc(var(--radius)*1.2);
  padding:18px 14px; text-align:center; margin-bottom:6px;}
.wz-typeprev b{display:block; font-size:2rem; font-weight:var(--fw-display,200); letter-spacing:-.02em; margin-bottom:8px;}
.wz-typeprev span{font-size:.85rem; color:var(--fg-mid); line-height:1.5;}

@media (max-width:760px){
  #wizard{padding:10px; gap:10px;}
  .wz-card{border-radius:18px; max-height:calc(100% - 52px);}
  .wz-body{padding:0 18px;}
  .wz-foot{padding:12px 18px 14px;}
  .wz-foot .btn{min-width:0; flex:1 1 0;}
  .wz-cols{flex-direction:column; gap:14px;}
  .wz-left{flex:0 0 auto;}
  .wz-left .wz-icon{margin:0 auto 10px;}
  .wz-left .wz-title{text-align:center;}
  .wz-left .wz-sub{text-align:center;}
}

/* ---------------------------------------------------------------
   v7.1.1: first-run tutorial coach pill

#tut{position:fixed; left:50%; bottom:calc(88px + env(safe-area-inset-bottom,0px)); z-index:82;
  transform:translate(-50%,12px);

  font-size:.76rem; padding:6px 10px; border-radius:99px;}

async function writeDoc(ref, body){
  const key=ref.path;
  if(writeLocks[key]){ writeLocks[key]=body; return; }
  writeLocks[key]=true;
  try{
    await ref.set(body, {merge:false});
    const queued=writeLocks[key];
    writeLocks[key]=null;
    if(queued && queued!==true) await writeDoc(ref,queued);
  }catch(err){
    writeLocks[key]=null;
    if(err && err.code==="resource-exhausted"){ toast("Firestore's free quota is used up for now."); }
  }
}

/* ---- boot sequence ---- */
let liveUnsubs=[];
function teardownListeners(){ liveUnsubs.forEach(u=>{ try{u();}catch(e){} }); liveUnsubs=[]; }

async function initSync(){
  if(!FIREBASE_CONFIGURED){ showGate("setup"); markSync("not connected"); return; }

  firebase.initializeApp(FIREBASE_CONFIG);
  fsDB=firebase.firestore();
  try{ await fsDB.enablePersistence({synchronizeTabs:true}); }
  catch(e){ /* multiple tabs open, or unsupported browser: app still works, just without offline cache */ }

  firebase.auth().onAuthStateChanged(async user=>{
    teardownListeners();
    if(!user){
      fsUser=null; fsReady=false; markSync("signed out");
      closeAll();
      // v7.1.2: the wizard shows whenever you're signed out — signing back
      // in with an existing account offers skip / re-setup / reset / cancel
      if(FIREBASE_CONFIGURED) showWizard();
      else showGate("signin");
      return;
    }
    fsUser=user; fsReady=true; hideGate(); markSync("");
    attachListeners();
  });

  window.addEventListener("online", ()=>{ if(fsReady) markSync(""); });
  window.addEventListener("offline", ()=>{ if(fsReady) markSync("offline"); });
}

function attachListeners(){
  ["settings","taxonomy","schedule"].forEach(which=>{
    const un=configDoc(which).onSnapshot(snap=>{
      if(!snap.exists) return;
      const d=snap.data();
      if(!d || typeof d.updatedAt!=="number") return;
      if(d.updatedAt <= (State._v[which]||0)) return;
      State._v[which]=d.updatedAt;
      if(which==="settings") Object.assign(State.settings, d.payload||{});
      else if(which==="taxonomy") State.taxonomy=mergeTaxonomy(d.payload);
      else State[which]=d.payload||State[which];
      saveLocal(); applyTokens(); renderAll();
      if(WIZ.active) wizRerender();
      markSync(snap.metadata.fromCache?"offline":"");
    }, err=>{ markSync("offline"); });
    liveUnsubs.push(un);
  });

  const un2=todosCol().onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      const d=ch.doc.data();
      if(ch.type==="removed"){ delete State.todos[ch.doc.id]; }
      else if(d && d.id){
        const cur=State.todos[d.id];
        if(!cur || (d.updatedAt||0) >= (cur.updatedAt||0)) State.todos[d.id]=d;
      }
    });
    saveLocal(); renderAll();
    markSync(snap.metadata.fromCache?"offline":"");
  }, err=>{ markSync("offline"); });
  liveUnsubs.push(un2);

  configDoc("settings").get().then(s=>{
    if(!s.exists){ pushConfig("settings"); pushConfig("taxonomy"); pushConfig("schedule"); }
  }).catch(()=>{});
}

/* ---- readable ink for colour-coded pills ---- */
function effBgHex(){
  try{
    const v=(getComputedStyle(document.documentElement).getPropertyValue("--bg")||"").trim();
    if(/^#([0-9a-f]{6}|[0-9a-f]{3})$/i.test(v)) return v.toLowerCase();
  }catch(e){}
  return effTheme()==="dark" ? "#111111" : "#ffffff";
}
function inkFor(colorHex,tint){
  try{
    const pillBg=lerpColor(effBgHex(),colorHex,tint);
    if(contrastRatio(colorHex,pillBg)>=4.5) return colorHex;
    const pole=contrastRatio(pillBg,"#2b2b2b")>=contrastRatio(pillBg,"#e4e4e4") ? "#2b2b2b" : "#e4e4e4";
    for(let i=1;i<=10;i++){
      const c=lerpColor(colorHex,pole,i/10);
      if(contrastRatio(c,pillBg)>=4.5) return c;
    }
    return pole;
  }catch(e){ return colorHex; }
}

/* ---------------------------------------------------------------
   GRADIENT THEME (time-of-day, driven by real sunrise/sunset)
   --------------------------------------------------------------- */
function hexToRgb(hex){
  const h=hex.replace("#","");
  const n=parseInt(h.length===3?h.split("").map(c=>c+c).join(""):h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function lerpColor(a,b,t){
  const A=hexToRgb(a), B=hexToRgb(b);
  const c=A.map((v,i)=>Math.round(v+(B[i]-v)*clamp(t,0,1)));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
const SUN_COLORS={ night:"#07111f", dawn:"#2e4968", day:"#e9f1f6", dusk:"#3f5877" };

function fallbackSunTimes(base){
  const mk=(h,m)=>{ const d=new Date(base); d.setHours(h,m,0,0); return d; };
  return {civilBegin:mk(5,45), sunrise:mk(6,15), sunset:mk(18,15), civilEnd:mk(18,45)};
}
async function fetchSunTimes(dateISO,lat,lng){
  const cacheKey="bacdash.sun."+lat+","+lng+"."+dateISO;
  try{
    const c=localStorage.getItem(cacheKey);
    if(c) return JSON.parse(c);
  }catch(e){}
  try{
    const res=await fetch("https://api.sunrise-sunset.org/json?lat="+lat+"&lng="+lng+"&date="+dateISO+"&formatted=0");
    const j=await res.json();
    if(j.status!=="OK") throw new Error("bad status");
    const out={
      civilBegin:j.results.civil_twilight_begin,
      sunrise:j.results.sunrise,
      sunset:j.results.sunset,
      civilEnd:j.results.civil_twilight_end
    };
    try{ localStorage.setItem(cacheKey,JSON.stringify(out)); }catch(e){}
    return out;
  }catch(e){ return null; }
}
let sunCache=null, sunCacheDate=null, sunFetchInFlight=false;
function ensureSunTimes(){
  const today=iso(new Date());
  if(sunCache && sunCacheDate===today) return;
  if(sunFetchInFlight) return;
  sunFetchInFlight=true;
  const s=State.settings;
  fetchSunTimes(today,s.gradientLat,s.gradientLng).then(r=>{
    sunFetchInFlight=false;
    if(r){
      sunCache={
        civilBegin:new Date(r.civilBegin), sunrise:new Date(r.sunrise),
        sunset:new Date(r.sunset), civilEnd:new Date(r.civilEnd)
      };
    }else{
      sunCache=fallbackSunTimes(new Date());
    }
    sunCacheDate=today;
    if(State.settings.theme==="gradient") updateGradientTheme();
    applyAmbientTint();
  });
}
function updateGradientTheme(){
  if(!sunCache) sunCache=fallbackSunTimes(new Date());
  const now=new Date();
  const {civilBegin,sunrise,sunset,civilEnd}=sunCache;
  const dayMs=86400000;
  const anchors=[
    {t:civilEnd.getTime()-dayMs, c:SUN_COLORS.night},
    {t:civilBegin.getTime(),     c:SUN_COLORS.night},
    {t:sunrise.getTime(),        c:SUN_COLORS.dawn},
    {t:sunrise.getTime()+45*60000, c:SUN_COLORS.day},
    {t:sunset.getTime()-45*60000,  c:SUN_COLORS.day},
    {t:sunset.getTime(),        c:SUN_COLORS.dusk},
    {t:civilEnd.getTime(),      c:SUN_COLORS.night},
    {t:civilBegin.getTime()+dayMs, c:SUN_COLORS.night}
  ];
  const nt=now.getTime();
  let seg=anchors[0];
  for(let i=0;i<anchors.length-1;i++){
    if(nt>=anchors[i].t && nt<anchors[i+1].t){
      const frac=(nt-anchors[i].t)/(anchors[i+1].t-anchors[i].t);
      const color=lerpColor(anchors[i].c,anchors[i+1].c,frac);
      applyGradient(color);
      return;
    }
    seg=anchors[i+1];
  }
  applyGradient(seg.c);
}
function relativeLuminance(hex){
  const rgb=hexToRgb(hex).map(v=>v/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*rgb[0]+0.7152*rgb[1]+0.0722*rgb[2];
}
function contrastRatio(a,b){
  const la=relativeLuminance(a), lb=relativeLuminance(b);
  const hi=Math.max(la,lb), lo=Math.min(la,lb);
  return (hi+0.05)/(lo+0.05);
}
function gradientThemeFor(color){
  return contrastRatio(color,"#2b2b2b") >= contrastRatio(color,"#e4e4e4") ? "light" : "dark";
}
function applyGradient(color){
  const r=document.documentElement;
  const themeMode=gradientThemeFor(color);
  r.setAttribute("data-theme",themeMode);
  const edge=lerpColor(color, themeMode==="dark"?"#02070e":"#f8fbfd", 0.10);
  document.documentElement.style.backgroundImage="linear-gradient(165deg,"+color+","+edge+")";
  r.setAttribute("data-gradient-night", themeMode==="dark" ? "1" : "0");
  gradientColorNow=color;
  applyDynamicText();
}

/* ---------------------------------------------------------------
   AMBIENT DAWN/DUSK TINT
   --------------------------------------------------------------- */
const darkMQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
const AMBIENT_TINTS={
  dawn:{ light:{bg:"#fff3e9", field:"#f9f1ea"}, dark:{bg:"#111521", field:"#161b26"} },
  dusk:{ light:{bg:"#fdeade", field:"#f5ebe3"}, dark:{bg:"#191310", field:"#1e1815"} }
};
let _ambientKey="";
function effTheme(){
  const dt=document.documentElement.getAttribute("data-theme");
  if(dt==="dark") return "dark";
  if(dt==="light") return "light";
  return (darkMQ && darkMQ.matches) ? "dark" : "light";
}
function ambientFactors(){
  if(!sunCache) return null;
  const now=Date.now(), span=75*60000;
  const tri=c=>clamp(1-Math.abs(now-c)/span,0,1);
  return {dawn:tri(sunCache.sunrise.getTime()), dusk:tri(sunCache.sunset.getTime())};
}
function applyAmbientTint(){
  const r=document.documentElement, s=State.settings;
  const key=(sunCacheDate||"-")+"|"+s.theme+"|"+effTheme()+"|"+Math.floor(Date.now()/60000);
  if(key===_ambientKey) return;
  _ambientKey=key;
  const clear=()=>{
    if(r.style.getPropertyValue("--bg")){
      r.style.setProperty("--bg","");
      r.style.setProperty("--field","");
    }
  };
  if(s.theme==="gradient"){ clear(); applyDynamicText(); return; }
  const f=ambientFactors();
  if(!f || (f.dawn<=0 && f.dusk<=0)){ clear(); applyDynamicText(); return; }
  const mode=effTheme()==="dark" ? "dark" : "light";
  const which=f.dawn>=f.dusk ? "dawn" : "dusk";
  const k=Math.max(f.dawn,f.dusk);
  const tints=AMBIENT_TINTS[which][mode];
  const baseBg=mode==="dark" ? "#111111" : "#ffffff";
  const baseField=mode==="dark" ? "#1b1b1b" : "#f6f6f6";
  r.style.setProperty("--bg", lerpColor(baseBg,tints.bg,k));
  r.style.setProperty("--field", lerpColor(baseField,tints.field,k));
  applyDynamicText();
}

/* ---------------------------------------------------------------
   DYNAMIC TEXT TOKENS
   --------------------------------------------------------------- */
const STATIC_TOKENS={
  light:{base:"#ffffff", fg:"#2b2b2b", mid:"#6e6e6e", soft:"#9a9a9a", faint:"#c9c9c9"},
  dark: {base:"#111111", fg:"#e4e4e4", mid:"#a0a0a0", soft:"#7a7a7a", faint:"#3d3d3d"}
};
let gradientColorNow=null;
function liveBgHex(){
  if(State.settings.theme==="gradient" && gradientColorNow) return gradientColorNow;
  const v=document.documentElement.style.getPropertyValue("--bg").trim();
  if(/^#([0-9a-f]{6})$/i.test(v)) return v.toLowerCase();
  return STATIC_TOKENS[effTheme()==="dark"?"dark":"light"].base;
}
function applyDynamicText(){
  const r=document.documentElement;
  const bg=liveBgHex();
  const st=STATIC_TOKENS[effTheme()==="dark"?"dark":"light"];
  const pole=contrastRatio(bg,"#1c1c1c")>=contrastRatio(bg,"#f4f4f4") ? "#1c1c1c" : "#f4f4f4";
  const pick=(target)=>{
    for(let i=1;i<=24;i++){
      const c=lerpColor(bg,pole,i/24);
      if(contrastRatio(c,bg)>=target) return c;
    }
    return pole;
  };
  r.style.setProperty("--fg",      pick(Math.max(12,  contrastRatio(st.fg,   st.base))));
  r.style.setProperty("--fg-mid",   pick(Math.max(6,   contrastRatio(st.mid,  st.base))));
  r.style.setProperty("--fg-soft",  pick(Math.max(4.5, contrastRatio(st.soft, st.base))));
  r.style.setProperty("--fg-faint", pick(Math.max(3.4, contrastRatio(st.faint,st.base))));
}

const digitCache={};
function renderDigits(container,key,str){
  let wrap=digitCache[key];
  if(!wrap || wrap.parentNode!==container || wrap.dataset.len!==String(str.length)){
    container.innerHTML="";
    wrap=el("div"); wrap.style.display="flex"; wrap.dataset.len=String(str.length);
    for(let i=0;i<str.length;i++){
      const d=el("div","digit"); const col=el("div","col");
      for(let n=0;n<10;n++) col.appendChild(el("span",null,String(n)));
      d.appendChild(col); wrap.appendChild(d);
    }
    container.appendChild(wrap); digitCache[key]=wrap;
  }
  const cols=wrap.children;
  for(let i=0;i<str.length;i++){
    const n=Number(str[i]);
    cols[i].firstChild.style.transform="translateY(calc("+(-n)+" * var(--dh)))";
  }
}

function buildCountShell(){
  const s=State.settings;
  const c=$("#count"); c.innerHTML="";
  const units = s.showDaysOnly ? ["days"] : (s.showSeconds?["days","hours","minutes","seconds"]:["days","hours","minutes"]);
  units.forEach(u=>{
    const box=el("div","count-unit");
    const num=el("div","count-num"); num.id="cn-"+u;
    const lab=el("div","count-label", u);
    box.appendChild(num); box.appendChild(lab); c.appendChild(box);
  });
  c._units=units;
  Object.keys(digitCache).forEach(k=>delete digitCache[k]);
}

function tickCountdown(){
  const s=State.settings, c=$("#count");
  const units=c._units||[];
  const diff=targetDate().getTime()-Date.now();
  const past = diff<=0;
  const ms=Math.max(0,diff);
  const totalMin=Math.floor(ms/60000);
  const days=Math.floor(ms/86400000);
  const hours=Math.floor(ms/3600000)%24;
  const mins=Math.floor(ms/60000)%60;
  const secs=Math.floor(ms/1000)%60;
  const vals={days:String(days), hours:pad(hours), minutes:pad(mins), seconds:pad(secs)};
  units.forEach(u=>{ const t=$("#cn-"+u); if(t) renderDigits(t,u,vals[u]); });
  c.classList.toggle("urgent", s.urgentColor && !past && days<=s.urgentDays);
}
