function tickClock(){
  const n=new Date();
  const clock=fmtHourMin(n.getHours(),n.getMinutes());
  const date=DAY_NAMES[n.getDay()]+" "+n.getDate()+" "+n.toLocaleString(undefined,{month:"long"});
  $("#tbClock").textContent = clock;
  $("#tbDate").textContent  = date;
  const qc=$("#qaClock"), qd=$("#qaHeadDate");
  if(qc) qc.textContent=clock;
  if(qd) qd.textContent=date;
  sweepOverdueToArchive();
  applyAmbientTint();
}
function sweepOverdueToArchive(){
  const today=iso(new Date());
  let swept=0;
  todosArray().forEach(t=>{
    if(!t.done && !t.archived && t.due && t.due<today){
      t.archived=true; t.missed=true; t.updatedAt=Date.now();
      State.todos[t.id]=t; pushTodo(t); swept++;
    }
  });
  if(swept){
    renderAll();
    toast(swept+" overdue task"+(swept===1?"":"s")+" moved to the archive");
  }
}

/* =====================================================================
   7. HOME SLOT (dynamic morning / afternoon / tasks)
   ===================================================================== */
function currentSlot(){
  const s=State.settings, n=new Date(), dow=n.getDay();
  const cur=n.getHours()*60+n.getMinutes();
  if(isWeekend(dow) && s.weekendShowsTasks) return "tasks";
  if(cur>=minOf(s.morningStart) && cur<minOf(s.morningEnd))     return "morning";
  if(cur>=minOf(s.afternoonStart) && cur<minOf(s.afternoonEnd)) return "afternoon";
  return "tasks";
}

function renderSlot(){
  const s=State.settings;
  const mode=currentSlot();
  const body=$("#slotBody"); body.innerHTML="";
  const now=new Date(), dow=now.getDay(), cur=now.getHours()*60+now.getMinutes();

  if(mode==="tasks"){
    $("#slotTitle").textContent="Tasks";
    let list=todosArray().filter(t=>{
      if(t.archived) return false;
      if(!t.done) return true;
      if(s.doneStyle==="hide") return false;
      if(s.autoClearDays>0 && t.doneAt && (Date.now()-t.doneAt)/86400000 > s.autoClearDays) return false;
      return true;
    });
    const horizon=iso(addDays(now,14));
    list=list.filter(t=>!t.due || t.due<=horizon);
    const open=list.filter(t=>!t.done).length;
    $("#slotRight").textContent = open ? open+" open" : "";
    $("#rapidBtn").hidden = open===0;
    if(!list.length){
      body.appendChild(emptyState("Nothing queued.","Swipe up to add a task."));
      return;
    }
    sortTodos(list).forEach(t=> body.appendChild(todoRow(t)));
    return;
  }

  const isM = mode==="morning";
  $("#rapidBtn").hidden = true;
  const from=isM?minOf(s.morningStart):minOf(s.afternoonStart);
  const to  =isM?minOf(s.morningEnd):minOf(s.afternoonEnd);
  $("#slotTitle").textContent = isM ? "This morning" : "This afternoon";
  $("#slotRight").textContent = fmtHHMM(isM?s.morningStart:s.afternoonStart)+" – "+fmtHHMM(isM?s.morningEnd:s.afternoonEnd);

  const list=sessionsFor(dow).filter(x=>minOf(x.start)<to && minOf(x.end)>from);
  if(!list.length){ body.appendChild(emptyState("No sessions in this block.","Right-click to edit "+DAY_NAMES[dow]+".")); return; }

  list.forEach(x=>{
    const r=el("div","row"+(x.kind==="tutoring"?" tutor":"")+((cur>=minOf(x.start)&&cur<minOf(x.end))?" now":""));
    r.appendChild(el("div","row-time", fmtHHMM(x.start)+" – "+fmtHHMM(x.end)));
    const m=el("div","row-main");
    m.appendChild(el("div","row-title", subjectName(x.subject)));
    r.appendChild(m);
    if(x.kind==="tutoring") r.appendChild(el("div","row-tag","tutoring"));
    body.appendChild(r);
  });
}

function emptyState(a,b){
  const e=el("div","empty",a);
  if(b) e.appendChild(el("span",null,b));
  return e;
}

function checkSVG(){
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 12 12");
  const p=document.createElementNS("http://www.w3.org/2000/svg","polyline");
  p.setAttribute("points","1,6 4.5,9.5 11,2"); p.setAttribute("stroke-linecap","round"); p.setAttribute("stroke-linejoin","round");
  svg.appendChild(p); return svg;
}

function todoRow(t){
  const today=iso(new Date());
  const overdue = !t.done && t.due && t.due<today;
  const row=el("div","todo"+(t.done?" done":"")+(overdue?" overdue":""));
  row.style.setProperty("--card-c", taskColor(t));
  const box=el("div","box"); box.appendChild(checkSVG()); row.appendChild(box);
  box.addEventListener("click",e=>{ e.stopPropagation(); toggleTodo(t); });
  const m=el("div","todo-main");
  const titleRow=el("div","todo-title-row");
  titleRow.appendChild(el("div","todo-title", t.title));
  if(t.method){
    const badge=el("span","todo-badge", methodName(t.method));
    setBadge(badge, methodColor(t.method));
    titleRow.appendChild(badge);
  }
  const sb=el("span","todo-badge", subjectName(t.subject));
  setBadge(sb, subjectColor(t.subject));
  titleRow.appendChild(sb);
  m.appendChild(titleRow);
  const meta=el("div","todo-meta");
  const bits=[typeName(t.type), fmtMin(t.duration||State.settings.defaultDuration)];
  if(t.step) bits.push(t.step);
  if(t.due) bits.push(t.due===today?"today":(overdue?"overdue · "+t.due:t.due));
  bits.filter(Boolean).forEach((b,i)=>{
    if(i) meta.appendChild(el("span","dot","·"));
    meta.appendChild(document.createTextNode(b));
  });
  m.appendChild(meta); row.appendChild(m);

  if(editMode){
    row.appendChild(gearBtn(()=>openTodoEditor(t)));
  }else{
    row.addEventListener("click",()=>openTaskDetail(t,row));
  }
  return row;
}

function toggleTodo(t){
  t.done=!t.done; t.doneAt = t.done?Date.now():null; t.updatedAt=Date.now();
  State.todos[t.id]=t; pushTodo(t); renderAll();
}

/* =====================================================================
   8. REMINDER TICKER
   ===================================================================== */
function renderTicker(){
  const s=State.settings, box=$("#ticker");
  if(!s.reminderOn){ box.classList.remove("show"); box.innerHTML=""; return; }
  const now=new Date();
  let best=null;
  for(let off=0; off<=2; off++){
    const d=addDays(now,off), dow=d.getDay();
    sessionsFor(dow).forEach(x=>{
      if(s.reminderTutoringOnly && x.kind!=="tutoring") return;
      const when=new Date(d.getFullYear(),d.getMonth(),d.getDate(),...x.start.split(":").map(Number));
      const hrs=(when-now)/3600000;
      if(hrs>0 && hrs<=s.reminderLeadHours && (!best||when<best.when)) best={when,x,off};
    });
  }
  if(!best){ box.classList.remove("show"); return; }
  const when = best.off===0?"today":(best.off===1?"tomorrow":DAY_NAMES[best.when.getDay()]);
  box.innerHTML="";
  const label = best.x.kind==="tutoring" ? "tutoring" : "class";
  box.appendChild(document.createTextNode(subjectName(best.x.subject)+" "+label+" "+when+" at "));
  box.appendChild(el("b",null,fmtHHMM(best.x.start)));
  box.classList.add("show");
}

/* =====================================================================
   9. CALENDAR
   ===================================================================== */
let calOffset=0;
function weekStartDate(){
  const s=State.settings, n=new Date();
  const diff=(n.getDay()-s.weekStart+7)%7;
  return addDays(new Date(n.getFullYear(),n.getMonth(),n.getDate()), -diff + calOffset*7);
}
const TG_START_HOUR=8, TG_END_HOUR=24, TG_HOUR_PX=52;
function hourLabel(h){
  if(State.settings.clock24!==false) return (h<10?"0"+h:h)+":00";
  const h12=h%12===0?12:h%12;
  return h12+" "+(h<12?"AM":"PM");
}
function renderCalendar(){
  const s=State.settings;
  const grid=$("#calGrid"); grid.innerHTML="";
  const start=weekStartDate(), today=new Date(), todayStr=iso(today);
  $("#calTitle").textContent = calOffset===0 ? "This week" :
    (calOffset===1?"Next week":(calOffset===-1?"Last week":
      start.getDate()+" "+start.toLocaleString(undefined,{month:"short"})));

  const totalPx=(TG_END_HOUR-TG_START_HOUR)*TG_HOUR_PX;
  const winStart=TG_START_HOUR*60, winEnd=TG_END_HOUR*60;

  const head=el("div","tg-head");
  head.appendChild(el("div"));
  const days=[];
  for(let i=0;i<7;i++){
    const d=addDays(start,i), dow=d.getDay(), isToday=sameDay(d,today);
    days.push({d,dow});
    const cell=el("div","tg-headcell"+(isToday?" today":""));
    cell.appendChild(el("div","cd-name", DAY_ABBR[dow]));
    cell.appendChild(el("div","cd-num", String(d.getDate())));
    if(editMode) cell.appendChild(gearBtn(()=>openDayEditor(dow)));
    head.appendChild(cell);
  }
  grid.appendChild(head);

  const scroll=el("div","tg-scroll");
  const inner=el("div","tg-inner");

  const hourCol=el("div","tg-hourlabels");
  for(let h=TG_START_HOUR;h<TG_END_HOUR;h++){
    const lb=el("div","tg-hourlabel", hourLabel(h));
    lb.style.height=TG_HOUR_PX+"px";
    hourCol.appendChild(lb);
  }
  inner.appendChild(hourCol);

  days.forEach(({d,dow})=>{
    const col=el("div","tg-col"+(isWeekend(dow)?" off":""));
    col.style.setProperty("--hourpx",TG_HOUR_PX+"px");
    col.style.height=totalPx+"px";

    sessionsFor(dow).forEach(x=>{
      const st=minOf(x.start), en=minOf(x.end);
      if(en<=winStart || st>=winEnd) return;
      const top=(clamp(st,winStart,winEnd)-winStart)/60*TG_HOUR_PX;
      const h=Math.max(18,(clamp(en,winStart,winEnd)-clamp(st,winStart,winEnd))/60*TG_HOUR_PX);
      const blk=el("div","tg-block"+(x.kind==="tutoring"?" tutor":""));
      blk.style.top=top+"px"; blk.style.height=h+"px";
      blk.style.setProperty("--sub-c", subjectColor(x.subject));
      blk.appendChild(el("div","tg-sub", subjectName(x.subject)));
      blk.appendChild(el("div","tg-t", fmtHHMM(x.start)+" – "+fmtHHMM(x.end)+(x.kind==="tutoring"?" · tutoring":"")));
      col.appendChild(blk);
    });

    let cursor=s.calAnchorHour*60;
    sortTodos(todosOn(iso(d))).forEach(t=>{
      if(cursor>=winEnd) return;
      const dur=t.duration||s.defaultDuration||25;
      const top=(cursor-winStart)/60*TG_HOUR_PX;
      const h=Math.max(20, Math.min(dur, winEnd-cursor)/60*TG_HOUR_PX);
      const done=!!t.done;
      const over=!done && (t.missed || (t.due && t.due<todayStr));
      const blk=el("div","tg-task"+(done?" done":"")+(over?" overdue":""));
      blk.style.top=top+"px"; blk.style.height=h+"px";
      blk.style.setProperty("--task-c", subjectColor(t.subject));
      blk.appendChild(el("div","tg-sub", t.title));
      blk.appendChild(el("div","tg-t", fmtMin(dur)+(t.step?" · "+t.step:"")+(over?" · missed":"")));
      blk.addEventListener("click",()=>openTaskDetail(t,blk,false));
      col.appendChild(blk);
      cursor+=dur;
    });

    inner.appendChild(col);
  });

  scroll.appendChild(inner);
  grid.appendChild(scroll);
}

/* =====================================================================
   10. STOPWATCH
   ===================================================================== */
const SW={running:false,base:0,acc:0,laps:[],raf:null};
function swFmt(ms){
  const t=Math.floor(ms/10), cs=t%100, sec=Math.floor(t/100)%60,
        min=Math.floor(t/6000)%60, hr=Math.floor(t/360000);
  return (hr?hr+":":"")+pad(min)+":"+pad(sec)+'<span class="ms">.'+pad(cs)+"</span>";
}
function swNow(){ return SW.acc + (SW.running?Date.now()-SW.base:0); }
function swPaint(){
  $("#swDisplay").innerHTML = swFmt(swNow());
  if(SW.running) SW.raf=requestAnimationFrame(swPaint);
}
function swToggle(){
  if(SW.running){ SW.acc=swNow(); SW.running=false; cancelAnimationFrame(SW.raf); $("#swStart").textContent="Start"; }
  else{ SW.base=Date.now(); SW.running=true; $("#swStart").textContent="Pause"; swPaint(); }
}
function swResetFn(){ SW.running=false; cancelAnimationFrame(SW.raf); SW.acc=0; SW.laps=[]; $("#swStart").textContent="Start"; swPaint(); swRenderLaps(); }
function swLapFn(){
  if(!SW.running) return;
  SW.laps.unshift(swNow()); swRenderLaps();
}
function swRenderLaps(){
  const box=$("#swLaps");
  box.hidden = !State.settings.swLaps || !SW.laps.length;
  box.innerHTML="";
  SW.laps.forEach((l,i)=>{
    const prev=SW.laps[i+1]||0;
    const r=el("div","lap");
    r.appendChild(el("span",null,"Lap "+(SW.laps.length-i)));
    const v=el("span"); v.innerHTML=swFmt(l-prev); r.appendChild(v);
    box.appendChild(r);
  });
}

/* =====================================================================
   11. TIMER
   ===================================================================== */
const TM={running:false,end:0,left:0,dur:0,int:null};
function tmFmt(ms){
  const t=Math.ceil(ms/1000), s=t%60, m=Math.floor(t/60)%60, h=Math.floor(t/3600);
  return (h?h+":"+pad(m):String(m).padStart(2,"0"))+":"+pad(s);
}
function tmPaint(){
  const left = TM.running ? Math.max(0,TM.end-Date.now()) : TM.left;
  const d=$("#tmDisplay");
  d.textContent = tmFmt(left);
  d.classList.toggle("fire", TM.running && left<=10000 && left>0);
  if(TM.running && left<=0) tmFire();
}
function tmSet(mins){ TM.dur=mins*60000; TM.left=TM.dur; TM.running=false; clearInterval(TM.int); $("#tmStart").textContent="Start"; tmPaint(); }
function tmToggle(){
  if(TM.running){ TM.left=Math.max(0,TM.end-Date.now()); TM.running=false; clearInterval(TM.int); $("#tmStart").textContent="Start"; }
  else{
    if(TM.left<=0) return;
    TM.end=Date.now()+TM.left; TM.running=true; $("#tmStart").textContent="Pause";
    TM.int=setInterval(tmPaint,100);
  }
  tmPaint();
}
function tmFire(){
  TM.running=false; clearInterval(TM.int); TM.left=0; $("#tmStart").textContent="Start";
  $("#tmDisplay").classList.add("fire");
  if(State.settings.timerSound) beep();
  toast("Timer finished");
  setTimeout(()=>$("#tmDisplay").classList.remove("fire"),4000);
}
function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=new C();
    [0,0.28,0.56].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=660;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.22);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.25);
    });
    setTimeout(()=>ctx.close(),1400);
  }catch(e){}
}

/* gesture layer: trackpad wheel, touch, keyboard
   v7.1.2 fix: the old bug where pressing ↑ then ↓ left focus inside the
   hidden quick-add input (the 320ms focus timer fired into an already-
   closing sheet, and closing never released focus) — every keydown then
   hit the input's early-return and swallowed all shortcuts until a
   random click. Now: the timer checks the sheet is still open before
   focusing, closing blurs any focus trapped inside, and the keydown
   handler rescues a stuck focus and processes the key normally. */
let wheelX=0, wheelY=0, wheelDecided=false, wheelQuietTimer=null, wheelCapTimer=null, wheelLockUntil=0;
let qaDownAccum=0, qaDownTimer=null, qaFocusT=null;
const WHEEL_QUIET_MS=180;
const WHEEL_CAP_MS=900;
const WHEEL_NAV_LOCK_MS=650;
function navStep(dir){
  if(TUT.active && TUT.step===0) tutAdvance();
  goTo(screenIdx+dir);
}

function wheelGestureEnd(){
  wheelX=0; wheelY=0; wheelDecided=false; wheelLockUntil=0;
  clearTimeout(wheelQuietTimer); clearTimeout(wheelCapTimer);
  wheelQuietTimer=null; wheelCapTimer=null;
}

window.addEventListener("wheel", e=>{
  if(sheetOpen()){
    const qa=$("#qaSheet");
    if(qa.classList.contains("on") && e.target && e.target.closest && e.target.closest("#qaSheet")){
      if(e.deltaY>0){
        const sc=e.target.closest(".sheet-body");
        const atEnd=!sc || (sc.scrollHeight - sc.scrollTop - sc.clientHeight) <= 4;
        if(atEnd){
          qaDownAccum+=e.deltaY;
          clearTimeout(qaDownTimer);
          qaDownTimer=setTimeout(()=>{qaDownAccum=0;},350);
          if(qaDownAccum>180){ qaDownAccum=0; closeQuickAdd(); }
        }else qaDownAccum=0;
      }else qaDownAccum=0;
    }
    return;
  }
  if(overlayOpen()){
    const t=(e.target && e.target.closest) ? e.target : null;
    if(t && t.closest(".ar-body,.st-body,.rf-list,.td-card,.wz-body")) return;
    return;
  }
  const now=Date.now();
  const tgtEl = (e.target && e.target.closest) ? e.target : null;
  if(tgtEl && tgtEl.closest(".slot-body,.cal-day,.laps,.screen-scroll,.cal-grid,.tg-scroll")) {
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)) return;
  }

  clearTimeout(wheelQuietTimer);
  wheelQuietTimer=setTimeout(wheelGestureEnd,WHEEL_QUIET_MS);
  if(!wheelCapTimer) wheelCapTimer=setTimeout(wheelGestureEnd,WHEEL_CAP_MS);

  if(now < wheelLockUntil || wheelDecided) return;

  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){
    wheelX+=e.deltaX; wheelY=0;
    if(Math.abs(wheelX)>85){
      navStep(wheelX>0?1:-1);
      wheelDecided=true; wheelLockUntil=now+WHEEL_NAV_LOCK_MS;
    }
  }else{
    wheelY+=e.deltaY; wheelX=0;
    const up = State.settings.invertVertical ? wheelY<0 : wheelY>0;
    if(Math.abs(wheelY)>110 && up && ORDER()[screenIdx]==="home"){
      openQuickAdd();
      wheelDecided=true; wheelLockUntil=now+WHEEL_NAV_LOCK_MS;
    }
  }
},{passive:true});

let tStart=null, tMoved=false, pressTimer=null;
window.addEventListener("touchstart", e=>{
  if(e.touches.length!==1) return;
  const t=e.touches[0];
  tStart={x:t.clientX,y:t.clientY,time:Date.now(),scroll:!!e.target.closest(".slot-body,.cal-day,.laps,.sheet-body,.panel-body,.cal-grid")};
  tMoved=false;
  clearTimeout(pressTimer);
  const tgt=e.target;
  pressTimer=setTimeout(()=>{ if(!tMoved && !tgt.closest(".sheet,.panel,#taskDetail,#rfOverlay,#taskRun,#archiveScreen,#statsScreen,#wizard")) toggleEdit(); },600);
},{passive:true});
window.addEventListener("touchmove", e=>{
  if(!tStart) return;
  const t=e.touches[0];
  if(Math.abs(t.clientX-tStart.x)>8||Math.abs(t.clientY-tStart.y)>8){ tMoved=true; clearTimeout(pressTimer); }
},{passive:true});
window.addEventListener("touchend", e=>{
  clearTimeout(pressTimer);
  if(!tStart || sheetOpen() || overlayOpen()){ tStart=null; return; }
  const t=e.changedTouches[0];
  const dx=t.clientX-tStart.x, dy=t.clientY-tStart.y, dt=Date.now()-tStart.time;
  tStart=null;
  if(dt>700) return;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.4){ navStep(dx<0?1:-1); return; }
  if(dy<-70 && Math.abs(dy)>Math.abs(dx)*1.4 && ORDER()[screenIdx]==="home"){ openQuickAdd(); }
},{passive:true});

/* app-level key handling, shared by the direct path and the stuck-focus rescue */
function appKeydown(e){
  if(WIZ.active){
    if(sheetOpen()){
      if(e.key==="Escape") closeAll();
      return;
    }
    if(e.key.toLowerCase()==="u" && WIZ.step===0 && !e.ctrlKey && !e.metaKey && !e.altKey){
      skipWizard();
    }else if(e.key==="Enter" && !(e.target.closest && e.target.closest("button"))){
      wizNext();
    }
    return;
  }
  if(e.key==="ArrowDown" && $("#qaSheet").classList.contains("on")){ closeQuickAdd(); return; }
  if(overlayOpen()){
    if(e.key==="Escape"){
      if(sheetOpen()) closeAll();
      else if($("#taskRun").classList.contains("on")) trStop();
      else if($("#rfOverlay").classList.contains("on")) RF.close();
      else if($("#archiveScreen").classList.contains("on")) closeArchive();
      else if($("#statsScreen").classList.contains("on")) closeStats();
      else if($("#taskDetail").classList.contains("on")) TD.close();
    }else if(e.key===" " && $("#taskRun").classList.contains("on")){
      e.preventDefault(); trTogglePause();
    }
    return;
  }
  if(e.key==="ArrowRight") navStep(1);
  else if(e.key==="ArrowLeft") navStep(-1);
  else if(e.key==="ArrowUp" && ORDER()[screenIdx]==="home") openQuickAdd();
  else if(e.key==="Escape"){ if(qaHasDraft()) closeQuickAdd(); else if(sheetOpen()) closeAll(); else if(editMode) toggleEdit(); }
  else if(e.key===" " && ORDER()[screenIdx]==="stopwatch"){ e.preventDefault(); swToggle(); }
  else if(e.key===" " && ORDER()[screenIdx]==="timer"){ e.preventDefault(); tmToggle(); }
}

window.addEventListener("keydown", e=>{
  if(e.target.matches("input,select,textarea")){
    if(e.key==="Escape"){ e.target.blur(); return; }
    if(e.key==="ArrowDown"
        && $("#qaSheet").classList.contains("on")
        && e.target.tagName!=="SELECT"
        && e.target.tagName!=="TEXTAREA"
        && e.target.type!=="range"){
      closeQuickAdd(); return;
    }
    // focus stuck inside a sheet that isn't open → release it and treat
    // this keypress as app-level instead of swallowing it
    const box=e.target.closest ? e.target.closest(".sheet,#stPanel") : null;
    if(box && !box.classList.contains("on")){
      e.target.blur();
      appKeydown(e);
      return;
    }
    return;
  }
  appKeydown(e);
});

window.addEventListener("contextmenu", e=>{
  if(e.target.closest(".sheet,.panel,#taskDetail,#rfOverlay,#taskRun,#archiveScreen,#statsScreen,#wizard")) return;
  e.preventDefault(); toggleEdit();
});

  // v7.1.2: release any focus trapped inside a just-closed sheet —
  // otherwise every keypress keeps hitting the hidden input
  const ae=document.activeElement;
  if(ae && ae.blur && ae.closest){
    const inSheet=ae.closest(".sheet");
    if((inSheet && !inSheet.classList.contains("on")) ||
       (ae.closest("#stPanel") && !$("#stPanel").classList.contains("on"))) ae.blur();

/* ---- colored dropdown (wraps a native <select>, keeps its value/events) ---- */
function mountColorSelect(select,colorFn){
  select.style.display="none";
  const wrap=el("div","csel");
  const btn=el("div","csel-btn");
  const dot=el("span","csel-dot"); btn.appendChild(dot);
  const label=el("span",null,""); btn.appendChild(label);
  wrap.appendChild(btn);
  select.parentNode.insertBefore(wrap,select.nextSibling);

  function sync(){
    const opt=select.options[select.selectedIndex];
    label.textContent = opt?opt.textContent:"— none —";
    dot.style.setProperty("--dot-c", opt&&opt.value?colorFn(opt.value):"#c9c9c9");
  }
  function closePop(){ const p=wrap.querySelector(".csel-pop"); if(p) p.remove(); document.removeEventListener("click",onDocClick,true); }
  function onDocClick(e){ if(!wrap.contains(e.target)) closePop(); }
  btn.addEventListener("click",e=>{
    e.stopPropagation();
    if(wrap.querySelector(".csel-pop")){ closePop(); return; }
    const pop=el("div","csel-pop");
    Array.from(select.options).forEach(opt=>{
      const row=el("div","csel-opt",opt.textContent);
      row.style.setProperty("--opt-c", opt.value?colorFn(opt.value):"#c9c9c9");
      row.addEventListener("click",()=>{
        select.value=opt.value; select.dispatchEvent(new Event("change")); sync(); closePop();
      });
      pop.appendChild(row);
    });
    wrap.appendChild(pop);
    setTimeout(()=>document.addEventListener("click",onDocClick,true),0);
  });
  select._cselSync=sync; sync();
}

function saveQuickAdd(){
  const title=$("#qaName").value.trim();
  if(!title){ $("#qaName").focus(); toast("Give the task a name."); return; }
  const type=$("#qaType").value, subject=$("#qaSubject").value;
  const ty=typeById(type);
  const method=(ty&&ty.method)?$("#qaMethod").value:"";
  const due=$("#qaDate").value||iso(new Date());
  const rep=repeatById($("#qaRepeat").value);
  const duration=clamp(Number($("#qaDuration").value)||State.settings.defaultDuration||25,10,60);

  const s=State.settings;
  const endMin=s.calAnchorHour*60 + dayLoadMinutes(due) + duration;
  if(endMin > s.dueBlockHour*60){
    toast("That day is full — the queue would run to "+fmtHourMin(s.dueBlockHour,0)+".");
    return;
  }

  const series=(rep&&rep.intervals&&rep.intervals.length)?uid():null;
  const base=fromISO(due);

  const mk=(d,step)=>{
    const t={id:uid(),title,type,subject,method:method||null,due:iso(d),duration,done:false,doneAt:null,
             seriesId:series,step:step||null,createdAt:Date.now(),updatedAt:Date.now()};
    State.todos[t.id]=t; pushTodo(t);
  };
  mk(base, series?"1/"+(rep.intervals.length+1):null);
  if(series) rep.intervals.forEach((off,i)=> mk(addDays(base,off), (i+2)+"/"+(rep.intervals.length+1)));

  closeAll(); renderAll();
  toast(series ? (rep.intervals.length+1)+" tasks scheduled" : "Task added");
}

function field(parent,label,type,value,opts){
  const f=el("div","f");

  if(type==="select"){
    input=el("select"); fillSelect(input,opts||[],value);

    if(type==="text") input.autocomplete="off";
  }
  const id="f_"+uid(); input.id=id; l.setAttribute("for",id);
  f.appendChild(input); parent.appendChild(f);

function normalizeHex(v){
  if(typeof v!=="string") return null;
  let s=v.trim();
  if(/^#[0-9a-f]{6}$/i.test(s)) return s.toLowerCase();
  if(/^#[0-9a-f]{3}$/i.test(s)) return "#"+s.slice(1).split("").map(c=>c+c).join("").toLowerCase();
  if(/^[0-9a-f]{6}$/i.test(s)) return "#"+s.toLowerCase();
  return null;
}
function colorField(parent,label,value){
  const f=el("div","f");
  const l=el("label",null,label); f.appendChild(l);
  const row=el("div","cf");
  const txt=el("input"); txt.type="text"; txt.value=value==null?"":value; txt.autocomplete="off";
  const col=el("input"); col.type="color"; col.value=normalizeHex(value)||"#000000";
  txt.addEventListener("input",()=>{
    const v=normalizeHex(txt.value);
    if(v) col.value=v;
  });
  col.addEventListener("input",()=>{ txt.value=col.value; });
  col.addEventListener("change",()=>{
    txt.value=col.value;
    txt.dispatchEvent(new Event("change"));
  });
  row.appendChild(txt); row.appendChild(col);
  const id="f_"+uid(); txt.id=id; l.setAttribute("for",id);
  f.appendChild(row); parent.appendChild(f);
  return txt;
}

}

function openTodoEditor(t){
  openEditor("Task", b=>{
    const name=field(b,"What is it","text",t.title);
    let ty,su,me;
    rowOf(b,r=>{
      ty=field(r,"Type","select",t.type,State.taxonomy.types);
      su=field(r,"Subject","select",t.subject,State.taxonomy.subjects);
    });
    me=field(b,"Method","select",t.method||"",[{id:"",name:"— none —"}].concat(methodsFor(t.subject)));
    const due=field(b,"Due","date",t.due);
    const dur=field(b,"Duration (minutes)","number",String(t.duration||State.settings.defaultDuration||25));
    if(t.seriesId) hint(b,"Part of a repeating series ("+(t.step||"")+"). Deleting this one leaves the rest.");
    actions(b,"Save",()=>{
      t.title=name.value.trim()||t.title; t.type=ty.value; t.subject=su.value;
      t.method=me.value||null; t.due=due.value;
      t.duration=clamp(Number(dur.value)||State.settings.defaultDuration||25,10,600);
      t.updatedAt=Date.now();
      State.todos[t.id]=t; pushTodo(t); closeEditor(); renderAll();
    },"Delete",()=>{
      confirmDelete("this task",async()=>{ await removeTodo(t.id); renderAll(); toast("Task deleted"); });
    });
    if(t.seriesId){
      const extra=el("button","btn small","Delete whole series");
      extra.style.marginTop="10px";
      extra.addEventListener("click",()=>{
        confirmDelete("the whole series",async()=>{
          const ids=todosArray().filter(x=>x.seriesId===t.seriesId).map(x=>x.id);
          for(const id of ids) await removeTodo(id);
          renderAll(); toast(ids.length+" tasks deleted");
        });
      });
      b.appendChild(extra);
    }
  });
}

function openDayEditor(dow){
  openEditor(DAY_NAMES[dow], b=>{
    const list=el("div","sect-list");
    sessionsFor(dow).forEach(x=>{
      const it=el("div","item");
      const m=el("div","item-main");
      m.appendChild(el("div","item-t", subjectName(x.subject)));
      m.appendChild(el("div","item-d", fmtHHMM(x.start)+"–"+fmtHHMM(x.end)+(x.kind==="tutoring"?" · tutoring":"")));
      it.appendChild(m);
      const e=el("button","item-btn","Edit"); e.addEventListener("click",()=>openSessionEditor(dow,x)); it.appendChild(e);
      const d=el("button","item-btn danger","Remove");
      d.addEventListener("click",()=>confirmDelete("this session",()=>{
        State.schedule.days[dow]=sessionsFor(dow).filter(y=>y.id!==x.id);
        pushConfig("schedule"); openDayEditor(dow); renderAll();
      }));
      it.appendChild(d);
      list.appendChild(it);
    });
    if(!sessionsFor(dow).length) list.appendChild(el("div","empty","No sessions on this day."));
    b.appendChild(list);
    actions(b,"Add a session",()=>openSessionEditor(dow,null));
  });
}
function openSessionEditor(dow,x){
  const isNew=!x;
  x=x||{id:uid(),subject:State.taxonomy.subjects[0].id,start:"08:00",end:"10:00",kind:"class"};
  openEditor(isNew?"New session":"Session", b=>{
    const su=field(b,"Subject","select",x.subject,State.taxonomy.subjects);
    let st,en;
    rowOf(b,r=>{ st=field(r,"Starts","time",x.start); en=field(r,"Ends","time",x.end); });
    const kd=field(b,"Kind","select",x.kind,[{id:"class",name:"Class"},{id:"tutoring",name:"Tutoring"}]);
    hint(b,"Tutoring sessions are what the reminder line at the bottom watches for.");
    actions(b,"Save",()=>{
      x.subject=su.value; x.start=st.value||x.start; x.end=en.value||x.end; x.kind=kd.value;
      const arr=State.schedule.days[dow]||[];
      if(isNew) arr.push(x); else{ const i=arr.findIndex(y=>y.id===x.id); if(i>=0) arr[i]=x; }
      State.schedule.days[dow]=arr; pushConfig("schedule");
      openDayEditor(dow); renderAll();
    },"Back",()=>openDayEditor(dow));
  });
}

function sw(parent,title,desc,val,fn){
  const s=el("div","switch"+(val?" on":""));
  const m=el("div"); m.appendChild(el("div","switch-t",title));
  if(desc) m.appendChild(el("div","switch-d",desc));
  s.appendChild(m);
  const t=el("div","track"); t.appendChild(el("i")); s.appendChild(t);
  s.addEventListener("click",()=>{ const v=!s.classList.contains("on"); s.classList.toggle("on",v); fn(v); });
  parent.appendChild(s); return s;
}
function section(parent,title,id){
  const s=el("div","sect"); if(id) s.id="sect-"+id;
  s.appendChild(el("h3",null,title)); parent.appendChild(s); return s;
}
function bindInput(input,fn){ input.addEventListener("change",()=>fn(input.value)); }
function rangeField(parent,label,value,min,max,step,onInput,onChange,format){
  const f=el("div","f");
  f.appendChild(el("label",null,label));
  const wrap=el("div","range-wrap");
  const input=el("input"); input.type="range"; input.min=String(min); input.max=String(max); input.step=String(step); input.value=String(value);
  const val=el("span","range-val",format?format(Number(value)):String(value));
  wrap.appendChild(input); wrap.appendChild(val); f.appendChild(wrap); parent.appendChild(f);
  input.addEventListener("input",()=>{ const v=Number(input.value); val.textContent=format?format(v):String(v); if(onInput) onInput(v); });
  input.addEventListener("change",()=>{ const v=Number(input.value); if(onChange) onChange(v); });
  return input;
}

}

/* =====================================================================
   THE EXPANDING CARD (FLIP)
   ===================================================================== */
function makeFlip(overlayId, cardId){
  const overlay=$("#"+overlayId), card=$("#"+cardId);
  const st={busy:false, ghost:null, source:null, timers:[]};

  function after(ms,fn){
    const id=setTimeout(()=>{ st.timers=st.timers.filter(x=>x!==id); fn(); },ms);
    st.timers.push(id);
  }
  function clearStyles(){
    card.style.position=""; card.style.left=""; card.style.top="";
    card.style.width=""; card.style.height="";
    card.style.maxHeight=""; card.style.margin="";
  }
  function zoom(){
    return parseFloat(getComputedStyle(document.body).zoom)||1;
  }
  function dismiss(){
    st.timers.forEach(clearTimeout); st.timers=[];
    overlay.classList.remove("on");
    overlay.style.background="";
    card.classList.remove("flip","primed","zoomout","fadeout");
    clearStyles();
    if(st.ghost){ st.ghost.remove(); st.ghost=null; }
    if(st.source && st.source.isConnected) st.source.classList.remove("gone");
    st.source=null;
    st.busy=false;
  }
  function open(sourceEl, ghostHTML, btnish){
    if(st.busy) return;
    st.source=sourceEl||null;
    card.classList.add("primed");
    if(sourceEl && sourceEl.isConnected && State.settings.animations){
      try{
        const z=zoom();
        const src=sourceEl.getBoundingClientRect();
        const dest=card.getBoundingClientRect();
        if(!(src.width>4 && dest.width>4)) throw 0;
        const ghost=el("div","td-ghost"+(btnish?" btnish":""));
        if(ghostHTML!=null) ghost.innerHTML=ghostHTML;
        card.appendChild(ghost); st.ghost=ghost;
        sourceEl.classList.add("gone");
        card.classList.add("flip");
        card.style.position="fixed";
        card.style.left=(src.left/z)+"px"; card.style.top=(src.top/z)+"px";
        card.style.width=(src.width/z)+"px"; card.style.height=(src.height/z)+"px";
        card.style.maxHeight="none"; card.style.margin="0";
        overlay.classList.add("on");
        void card.offsetWidth;
        card.style.left=(dest.left/z)+"px"; card.style.top=(dest.top/z)+"px";
        card.style.width=(dest.width/z)+"px"; card.style.height=(dest.height/z)+"px";
        requestAnimationFrame(()=>{ ghost.classList.add("fade"); });
        st.busy=true;
        after(210,()=>{ card.classList.remove("primed"); });
        after(390,()=>{
          card.classList.remove("flip");
          card.style.position=""; card.style.left=""; card.style.top="";
          card.style.margin=""; card.style.maxHeight="";
          if(st.ghost){ st.ghost.remove(); st.ghost=null; }
          st.busy=false;
        });
        return;
      }catch(e){
        if(st.ghost){ st.ghost.remove(); st.ghost=null; }
        card.classList.remove("flip");
        clearStyles();
        if(sourceEl.classList) sourceEl.classList.remove("gone");
      }
    }
    overlay.classList.add("on");
    card.classList.remove("primed");
  }
  function close(){
    if(st.busy) return;
    const src=st.source;
    if(src && src.isConnected && State.settings.animations && overlay.classList.contains("on")){
      card.classList.add("primed");
      try{
        const z=zoom();
        const cur=card.getBoundingClientRect();
        const tgt=src.getBoundingClientRect();
        if(!(cur.width>4 && tgt.width>4)) throw 0;
        card.classList.add("flip");
        card.style.position="fixed";
        card.style.left=(cur.left/z)+"px"; card.style.top=(cur.top/z)+"px";
        card.style.width=(cur.width/z)+"px"; card.style.height=(cur.height/z)+"px";
        card.style.maxHeight="none"; card.style.margin="0";
        overlay.style.background="rgba(0,0,0,0)";
        void card.offsetWidth;
        card.style.left=(tgt.left/z)+"px"; card.style.top=(tgt.top/z)+"px";
        card.style.width=(tgt.width/z)+"px"; card.style.height=(tgt.height/z)+"px";
        st.busy=true;
        after(370,()=>{ dismiss(); });
        return;
      }catch(e){
        card.classList.remove("flip");
        clearStyles();
      }
    }
    if(State.settings.animations && overlay.classList.contains("on")){
      card.classList.add("fadeout");
      st.busy=true;
      after(270,()=>{ dismiss(); });
      return;
    }
    dismiss();
  }
  return {open, close, dismiss, st};
}

/* ---- task run engine ---- */
const runState={
  active:false, rapid:false, queue:[], qi:0,
  task:null, phases:[], pi:0, mode:"task",
  running:false, endAt:0, leftMs:0, int:null,
  elapsedMs:0, lastTickAt:null
};
function pulseClock(){
  const c=$("#trClock");
  c.classList.remove("pulse"); void c.offsetWidth; c.classList.add("pulse");
}
function runPaint(){
  const left=runState.running ? Math.max(0,runState.endAt-Date.now()) : runState.leftMs;
  $("#trClock").textContent=tmFmt(left);
  if(runState.mode==="rest"){
    $("#trTask").textContent="Rest";
    $("#trPhase").textContent="Five minutes off";
    $("#trNext").textContent="Next: "+runState.queue[runState.qi+1].title;
  }else{
    $("#trTask").textContent=(runState.rapid?((runState.qi+1)+" of "+runState.queue.length+" · "):"")+runState.task.title;
    $("#trPhase").textContent=runState.phases[runState.pi].label;
    let next="";
    if(runState.pi<runState.phases.length-1){
      const p=runState.phases[runState.pi+1];
      next="Next: "+p.label+" · "+fmtSecs(p.secs);
    }else if(runState.rapid && runState.qi<runState.queue.length-1){
      next="Then five minutes of rest";
    }else{
      next="Last block — this finishes it";
    }
    $("#trNext").textContent=next;
  }
  $("#trPause").textContent=runState.running?"Pause":"Resume";
}
function runTick(){
  const now=Date.now();
  if(runState.running){
    if(runState.lastTickAt!=null) runState.elapsedMs+=now-runState.lastTickAt;
    runState.lastTickAt=now;
    if(now>=runState.endAt){ phaseDone(); return; }
    runPaint();
  }else{
    runState.lastTickAt=now;
  }
}
function startPhase(i){
  runState.pi=i;
  runState.running=true;
  runState.endAt=Date.now()+runState.phases[i].secs*1000;
  runState.leftMs=runState.phases[i].secs*1000;
  runPaint();
}
function phaseDone(){
  if(runState.pi<runState.phases.length-1){
    startPhase(runState.pi+1); pulseClock();
    return;
  }
  if(runState.mode==="task"){
    const t=runState.task;
    t.done=true; t.doneAt=Date.now(); t.updatedAt=Date.now();
    t.timeSpent=(t.timeSpent||0)+Math.round(runState.elapsedMs/1000);
    State.todos[t.id]=t; pushTodo(t);
  }
  if(runState.mode==="rest"){
    beginTask(runState.qi+1);
    return;
  }
  if(runState.rapid && runState.qi<runState.queue.length-1){
    enterRest();
    return;
  }
  if(State.settings.timerSound) beep();
  endRun(runState.rapid ? "Rapidfire done — "+runState.queue.length+" tasks" : "\""+runState.task.title+"\" complete");
}
function enterRest(){
  runState.mode="rest";
  runState.phases=[{label:"Rest",secs:300}];
  startPhase(0); pulseClock();
}
function beginTask(i){
  runState.qi=i;
  const t=runState.queue[i];
  runState.task=t;
  runState.phases=phasesFor(t);
  runState.mode="task";
  runState.elapsedMs=0;
  runState.lastTickAt=Date.now();
  $("#trSkip").hidden=!runState.rapid;
  startPhase(0);
}
function startTaskRun(t){
  runState.active=true; runState.rapid=false;
  runState.queue=[t];
  $("#taskRun").classList.add("on");
  beginTask(0);
  if(!runState.int) runState.int=setInterval(runTick,250);
}
function startRapidfire(list){
  if(!list.length) return;
  runState.active=true; runState.rapid=true;
  runState.queue=list;
  $("#taskRun").classList.add("on");
  beginTask(0);
  if(!runState.int) runState.int=setInterval(runTick,250);
}
function trTogglePause(){
  if(!runState.active) return;
  if(runState.running){
    runState.leftMs=Math.max(0,runState.endAt-Date.now());
    runState.running=false;
  }else{
    if(runState.leftMs<=0) return;
    runState.endAt=Date.now()+runState.leftMs;
    runState.running=true;
  }
  runPaint();
}
function trStop(){
  clearInterval(runState.int); runState.int=null;
  runState.active=false;
  $("#taskRun").classList.remove("on");
  renderAll();
}
function trSkip(){
  if(!runState.rapid) return;
  if(runState.mode==="rest"){ beginTask(runState.qi+1); return; }
  if(runState.qi<runState.queue.length-1){ enterRest(); return; }
  endRun("Skipped the last task");
}
function endRun(msg){
  clearInterval(runState.int); runState.int=null;
  runState.active=false;
  $("#taskRun").classList.remove("on");
  renderAll();
  if(msg) toast(msg);
}

    const c=el("button","btn","Close"); c.addEventListener("click",()=>RF.close());
    btnrow.appendChild(c); inner.appendChild(btnrow);
    return;
  }

  const head=el("div","rf-head");
  head.appendChild(el("div","td-title","Rapidfire"));
  const closeB=el("button","x","Close"); closeB.addEventListener("click",()=>RF.close());
  head.appendChild(closeB);
  inner.appendChild(head);
  inner.appendChild(el("div","f-hint",
    "Everything still open for today, back to back, five minutes of rest between tasks. Tap a card to leave it out."));

  const shrow=el("div","chips");
  shrow.style.margin="6px 0 0";
  const sh=el("button","chip"+(rfShuffle?" on":""),"Shuffle order");
  sh.type="button";
  sh.addEventListener("click",()=>{ rfShuffle=!rfShuffle; sh.classList.toggle("on",rfShuffle); });
  shrow.appendChild(sh);
  inner.appendChild(shrow);

  const list=el("div","rf-list");
  rfTasks.forEach(t=>{
    const row=rfRow(t, rfPicked.has(t.id));
    row.addEventListener("click",()=>{
      if(rfPicked.has(t.id)) rfPicked.delete(t.id); else rfPicked.add(t.id);
      row.classList.toggle("picked", rfPicked.has(t.id));
      rfRecalc();
    });
    list.appendChild(row);
  });
  inner.appendChild(list);

  const total=el("div","rf-total"); total.id="rfTotal";
  const btnrow=el("div","rf-btnrow");
  const cancel=el("button","btn","Cancel"); cancel.addEventListener("click",()=>RF.close());
  const start=el("button","btn primary","Start"); start.id="rfStart";
  start.addEventListener("click",rfStart);
  btnrow.appendChild(cancel); btnrow.appendChild(start);
  inner.appendChild(total);
  inner.appendChild(btnrow);
  rfRecalc();
}
function rfRecalc(){
  const sel=rfTasks.filter(t=>rfPicked.has(t.id));
  const work=sel.reduce((a,t)=>a+(t.duration||State.settings.defaultDuration||25),0);
  const span=work+Math.max(0,sel.length-1)*5;
  const tot=$("#rfTotal"), st=$("#rfStart");
  if(tot) tot.textContent=sel.length+" task"+(sel.length===1?"":"s")+" · "+fmtMin(work)+" of work · done by "+fmtClock(new Date(Date.now()+span*60000));
  if(st) st.disabled=!sel.length;
}
function rfStart(){
  let sel=rfTasks.filter(t=>rfPicked.has(t.id));
  if(!sel.length) return;
  if(rfShuffle) sel=shuffleArr(sel);
  RF.dismiss();
  startRapidfire(sel);
}
function openRapidfireCard(){
  if(RF.st.busy) return;
  const today=iso(new Date());
  const tasks=todosArray().filter(t=>!t.archived && !t.done && t.due && t.due<=today);
  if(!tasks.length){ toast("Nothing open for today."); return; }
  rfPicked=new Set(tasks.map(t=>t.id));
  fillRapidfire();
  RF.open($("#rapidBtn"), "Rapidfire", true);
}
 $("#rapidBtn").addEventListener("click",e=>{ e.stopPropagation(); openRapidfireCard(); });
 $("#rfOverlay").addEventListener("click",e=>{
  if(e.target===$("#rfOverlay")) RF.close();
});

let statsResizeT=null;

function actualSecs(t){
  if(t.timeSpent) return t.timeSpent;
  if(t.done) return (t.duration||State.settings.defaultDuration||25)*60;
  return 0;
}
function fullDateStr(d){
  return DAY_NAMES[d.getDay()]+" "+d.getDate()+" "+d.toLocaleString(undefined,{month:"long"});
}
function fmtHours(sec){
  let h=Math.floor(sec/3600), m=Math.round((sec-h*3600)/60);
  if(m===60){ h++; m=0; }
  if(h>=48) return h+"h";
  if(!h) return m+"m";
  return m? h+"h "+m+"m" : h+"h";
}
function currentWeekStart(){
  const n=new Date();
  const diff=(n.getDay()-State.settings.weekStart+7)%7;
  return addDays(new Date(n.getFullYear(),n.getMonth(),n.getDate()),-diff);
}

function barChartSVG(W,labels,vals,avgSecs){
  const H=170,padL=6,padR=6,padT=8,padB=18;
  const n=vals.length;
  const max=Math.max.apply(null,vals.concat([1]));
  const gap=n>1?Math.min(8,Math.max(2,(W-padL-padR)/n/5)):0;
  const bw=(W-padL-padR-gap*(n-1))/n;
  const plotH=H-padT-padB;
  const yOf=v=>padT+plotH-Math.max(1.5,v/max*plotH);
  const svg=sv("svg",{viewBox:"0 0 "+W+" "+H});
  vals.forEach((v,i)=>{
    const x=padL+i*(bw+gap), y=yOf(v);
    const r=sv("rect",{x:x.toFixed(1),y:y.toFixed(1),width:Math.max(2,bw).toFixed(1),height:(padT+plotH-y).toFixed(1),rx:2});
    r.style.fill="var(--fg-mid)";
    const t=sv("title"); t.textContent=labels[i].full+" · "+fmtHours(v);
    r.appendChild(t); svg.appendChild(r);
  });
  if(avgSecs>0){
    const ay=yOf(avgSecs);
    const ln=sv("line",{x1:padL,x2:(W-padR).toFixed(1),y1:ay.toFixed(1),y2:ay.toFixed(1)});
    ln.setAttribute("stroke-dasharray","4 4");
    ln.style.stroke="var(--accent)"; ln.style.strokeWidth="1.2";
    svg.appendChild(ln);
  }
  const step=Math.max(1,Math.ceil(n/Math.max(3,Math.floor(W/110))));
  labels.forEach((L,i)=>{
    if(i%step!==0 && i!==n-1) return;
    const tx=sv("text",{x:(padL+i*(bw+gap)+bw/2).toFixed(1),y:H-4,"text-anchor":"middle"});
    tx.setAttribute("font-size","10");
    tx.style.fill="var(--fg-soft)";
    tx.textContent=L.short;
    svg.appendChild(tx);
  });
  return svg;
}
function lineChartSVG(W,labels,vals){
  const H=150,padL=8,padR=8,padT=12,padB=18;
  const n=vals.length;
  const max=Math.max.apply(null,vals.concat([1]));
  const xOf=i=>padL+(W-padL-padR)*(n===1?0.5:i/(n-1));
  const yOf=v=>padT+(H-padT-padB)*(1-v/max);
  const svg=sv("svg",{viewBox:"0 0 "+W+" "+H});
  const bl=sv("line",{x1:padL,x2:(W-padR).toFixed(1),y1:H-padB,y2:H-padB});
  bl.style.stroke="var(--line)"; bl.style.strokeWidth="1";
  svg.appendChild(bl);
  const pts=vals.map((v,i)=>xOf(i).toFixed(1)+","+yOf(v).toFixed(1)).join(" ");
  const pl=sv("polyline",{points:pts});
  pl.style.stroke="var(--accent)"; pl.style.fill="none"; pl.style.strokeWidth="2";
  pl.setAttribute("stroke-linejoin","round"); pl.setAttribute("stroke-linecap","round");
  svg.appendChild(pl);
  vals.forEach((v,i)=>{
    const c=sv("circle",{cx:xOf(i).toFixed(1),cy:yOf(v).toFixed(1),r:3});
    c.style.fill="var(--accent)";
    const t=sv("title"); t.textContent=labels[i].full+" · "+v+" missed";
    c.appendChild(t); svg.appendChild(c);
  });
  const step=Math.max(1,Math.ceil(n/Math.max(3,Math.floor(W/110))));
  labels.forEach((L,i)=>{
    if(i%step!==0 && i!==n-1) return;
    const tx=sv("text",{x:xOf(i).toFixed(1),y:H-4,"text-anchor":i===n-1?"end":"middle"});
    tx.setAttribute("font-size","10");
    tx.style.fill="var(--fg-soft)";
    tx.textContent=L.short;
    svg.appendChild(tx);
  });
  return svg;
}

function renderStatsView(){
  const body=$("#statsBody");
  const keep=body.scrollTop;
  body.innerHTML="";
  const CW=Math.max(280,(body.clientWidth||710)-66);

  const all=todosArray();
  const done=all.filter(t=>t.done);
  const missed=all.filter(t=>t.missed && !t.done);
  const resolved=done.length+missed.length;
  const dayMap={};
  done.forEach(t=>{
    if(t.doneAt){
      const k=iso(new Date(t.doneAt));
      dayMap[k]=(dayMap[k]||0)+actualSecs(t);
    }
  });

  const cards=el("div","st-cards");
  const mkCard=(num,sub)=>{
    const c=el("div","st-card");
    c.appendChild(el("div","st-num",num));
    c.appendChild(el("div","st-sub",sub));
    return c;
  };
  cards.appendChild(mkCard(String(done.length),"tasks completed · all time"));
  let streak=0;
  {
    let d=new Date();
    if(!(dayMap[iso(d)]>0)) d=addDays(d,-1);
    while(dayMap[iso(d)]>0){ streak++; d=addDays(d,-1); }
  }
  cards.appendChild(mkCard(String(streak),streak===1?"day streak":"day streak"));
  cards.appendChild(mkCard(resolved?Math.round(done.length/resolved*100)+"%":"—",
    resolved?("of "+resolved+" resolved"):"nothing resolved yet"));
  const totalSecs=done.reduce((a,t)=>a+actualSecs(t),0);
  cards.appendChild(mkCard(fmtHours(totalSecs),"time studied · all time"));

  const wide=el("div","st-card wide");
  wide.appendChild(el("div","st-sub","Time studied · last 15 days"));
  const mini=el("div","st-mini");
  let sum15=0; const vals15=[];
  for(let i=14;i>=0;i--){
    const v=dayMap[iso(addDays(new Date(),-i))]||0;
    vals15.push(v); sum15+=v;
  }
  {
    const max15=Math.max.apply(null,vals15.concat([1]));
    const W=230,H=58,gap=3,bw=(W-gap*14)/15;
    const svg=sv("svg",{viewBox:"0 0 "+W+" "+H});
    vals15.forEach((v,i)=>{
      const h=Math.max(2,Math.round(v/max15*(H-2)));
      const r=sv("rect",{x:(i*(bw+gap)).toFixed(1),y:(H-h).toFixed(1),width:bw.toFixed(1),height:h,rx:2});
      r.style.fill=i===14?"var(--accent)":"var(--fg-mid)";
      const d=addDays(new Date(),-(14-i));
      const t=sv("title"); t.textContent=fullDateStr(d)+" · "+fmtHours(v);
      r.appendChild(t); svg.appendChild(r);
    });
    mini.appendChild(svg);
  }
  wide.appendChild(mini);
  wide.appendChild(el("div","st-sub",fmtHours(sum15)+" total"));
  cards.appendChild(wide);
  body.appendChild(cards);

  const sec1=el("div","st-sect");
  sec1.appendChild(el("h3",null,"Study hours"));
  const headrow=el("div","st-headrow");
  const big=el("div","st-big");
  headrow.appendChild(big);
  const gran=el("div","chips");
  [["day","Days"],["week","Weeks"],["month","Months"]].forEach(pair=>{
    const c=el("button","chip"+(stGran===pair[0]?" on":""),pair[1]);
    c.addEventListener("click",()=>{ stGran=pair[0]; renderStatsView(); });
    gran.appendChild(c);
  });
  headrow.appendChild(gran);
  sec1.appendChild(headrow);

  let labels,vals;
  if(stGran==="day"){
    labels=[]; vals=[];
    for(let i=29;i>=0;i--){
      const d=addDays(new Date(),-i);
      labels.push({short:d.getDate()+"/"+(d.getMonth()+1),full:fullDateStr(d)});
      vals.push(dayMap[iso(d)]||0);
    }
  }else if(stGran==="week"){
    labels=[]; vals=[];
    const curWS=currentWeekStart();
    for(let i=11;i>=0;i--){
      const w=addDays(curWS,-7*i);
      let s=0;
      for(let j=0;j<7;j++) s+=dayMap[iso(addDays(w,j))]||0;
      labels.push({short:w.getDate()+"/"+(w.getMonth()+1),full:"Week of "+fullDateStr(w)});
      vals.push(s);
    }
  }else{
    labels=[]; vals=[];
    const now=new Date();
    for(let i=11;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
      let s=0;
      for(let j=0;j<dim;j++) s+=dayMap[iso(new Date(d.getFullYear(),d.getMonth(),1+j))]||0;
      labels.push({short:d.toLocaleString(undefined,{month:"short"}),full:d.toLocaleString(undefined,{month:"long"})+" "+d.getFullYear()});
      vals.push(s);
    }
  }
  const tot=vals.reduce((a,b)=>a+b,0);
  const avg=tot/vals.length;
  big.appendChild(document.createTextNode("Total "));
  big.appendChild(el("b",null,fmtHours(tot)));
  big.appendChild(document.createTextNode(" · avg "));
  big.appendChild(el("b",null,fmtHours(avg)));
  const chartBox=el("div","st-chart");
  chartBox.appendChild(barChartSVG(CW,labels,vals,avg));
  sec1.appendChild(chartBox);
  body.appendChild(sec1);

  const sec2=el("div","st-sect");
  sec2.appendChild(el("h3",null,"Busiest weekday"));
  const wd=[0,0,0,0,0,0,0];
  done.forEach(t=>{ if(t.doneAt) wd[new Date(t.doneAt).getDay()]+=actualSecs(t); });
  const wdMax=Math.max.apply(null,wd);
  const wdOrder=[]; for(let i=0;i<7;i++) wdOrder.push((State.settings.weekStart+i)%7);
  const best=wdMax>0? wdOrder.slice().sort((a,b)=>wd[b]-wd[a])[0] : -1;
  const head2=el("div","st-headrow");
  const big2=el("div","st-big");
  if(best>=0){
    big2.appendChild(document.createTextNode("Busiest: "));
    big2.appendChild(el("b",null,DAY_NAMES[best]));
    big2.appendChild(document.createTextNode(" · "+fmtHours(wd[best])));
  }else{
    big2.appendChild(document.createTextNode("No completed tasks yet"));
  }
  head2.appendChild(big2);
  sec2.appendChild(head2);
  if(best>=0){
    const rows=el("div","st-bars");
    wdOrder.forEach(dow=>{
      const row=el("div","st-hrow");
      row.appendChild(el("div","st-hlabel",DAY_ABBR[dow]));
      const track=el("div","st-htrack");
      const fill=el("div","st-hfill");
      fill.style.width=(wdMax?Math.round(wd[dow]/wdMax*100):0)+"%";
      fill.style.background=dow===best?"var(--fg)":"var(--fg-faint)";
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("div","st-hval",fmtHours(wd[dow])));
      rows.appendChild(row);
    });
    sec2.appendChild(rows);
  }
  body.appendChild(sec2);

  const sec3=el("div","st-sect");
  sec3.appendChild(el("h3",null,"Study time vs coefficient weight"));
  const perSub={}; let totTime=0;
  done.forEach(t=>{
    perSub[t.subject]=(perSub[t.subject]||0)+actualSecs(t);
    totTime+=actualSecs(t);
  });
  if(totTime>0){
    const totW=State.taxonomy.subjects.reduce((a,s)=>a+subjectWeight(s.id),0)||1;
    const legend=el("div","st-legend");
    const l1=el("span");
    const i1=el("i"); i1.style.background="var(--fg-mid)";
    l1.appendChild(i1); l1.appendChild(document.createTextNode("share of study time"));
    const l2=el("span");
    const i2=el("i"); i2.style.background="var(--fg-faint)";
    l2.appendChild(i2); l2.appendChild(document.createTextNode("share of total weight"));
    legend.appendChild(l1); legend.appendChild(l2);
    sec3.appendChild(legend);
    const rows=el("div","st-bars st-dual");
    State.taxonomy.subjects.map(s=>{
      const ts=(perSub[s.id]||0)/totTime;
      const ws=subjectWeight(s.id)/totW;
      return {s,ts,ws,d:Math.abs(ts-ws)};
    }).sort((a,b)=>b.d-a.d).forEach(r=>{
      const row=el("div","st-hrow");
      const lab=el("div","st-hlabel");
      const dot=el("i","swatch"); dot.style.background=subjectColor(r.s.id);
      lab.appendChild(dot);
      const nm=el("span",null,r.s.name);
      lab.appendChild(nm);
      row.appendChild(lab);
      const line1=el("div","st-dualline");
      const t1=el("div","st-htrack");
      const f1=el("div","st-hfill");
      f1.style.width=(r.ts*100).toFixed(1)+"%";
      f1.style.background=subjectColor(r.s.id);
      t1.appendChild(f1);
      line1.appendChild(t1);
      line1.appendChild(el("div","st-hval",Math.round(r.ts*100)+"%"));
      row.appendChild(line1);
      const line2=el("div","st-dualline");
      const t2=el("div","st-htrack");
      const f2=el("div","st-hfill");
      f2.style.width=(r.ws*100).toFixed(1)+"%";
      f2.style.background="var(--fg-faint)";
      t2.appendChild(f2);
      line2.appendChild(t2);
      line2.appendChild(el("div","st-hval","×"+subjectWeight(r.s.id)+" · "+Math.round(r.ws*100)+"%"));
      row.appendChild(line2);
      rows.appendChild(row);
    });
    sec3.appendChild(rows);
  }else{
    sec3.appendChild(el("div","st-note","Complete some tasks to see how your study time splits against each subject's weight."));
  }
  body.appendChild(sec3);

  const sec4=el("div","st-sect");
  sec4.appendChild(el("h3",null,"Missed per subject"));
  const dSub={},mSub={};
  all.forEach(t=>{
    if(t.done) dSub[t.subject]=(dSub[t.subject]||0)+1;
    else if(t.missed) mSub[t.subject]=(mSub[t.subject]||0)+1;
  });
  const mrows=State.taxonomy.subjects.map(s=>{
    const d=dSub[s.id]||0, m=mSub[s.id]||0, r=d+m;
    return {s,d,m,r,rate:r?m/r:0};
  }).filter(x=>x.r>0).sort((a,b)=>b.rate-a.rate);
  if(mrows.length){
    const rows=el("div","st-bars");
    mrows.forEach(x=>{
      const row=el("div","st-hrow");
      const lab=el("div","st-hlabel");
      const dot=el("i","swatch"); dot.style.background=subjectColor(x.s.id);
      lab.appendChild(dot);
      lab.appendChild(el("span",null,x.s.name));
      row.appendChild(lab);
      const track=el("div","st-htrack");
      const fill=el("div","st-hfill");
      fill.style.width=(x.rate*100).toFixed(1)+"%";
      fill.style.background="var(--accent)";
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("div","st-hval",Math.round(x.rate*100)+"% · "+x.m+" of "+x.r));
      rows.appendChild(row);
    });
    sec4.appendChild(rows);
  }else{
    sec4.appendChild(el("div","st-note","Nothing resolved yet — missed rates appear once tasks are completed or missed."));
  }
  body.appendChild(sec4);

  const sec5=el("div","st-sect");
  sec5.appendChild(el("h3",null,"Missed trend · last 12 weeks"));
  const curWS=currentWeekStart();
  const mw=new Array(12).fill(0);
  missed.forEach(t=>{
    if(!t.due) return;
    const d=fromISO(t.due);
    const dd=Math.round((curWS.getTime()-d.getTime())/86400000);
    if(dd>=0){
      const w=Math.floor(dd/7);
      if(w<12) mw[11-w]++;
    }
  });
  const wlabels=[];
  for(let i=11;i>=0;i--){
    const w=addDays(curWS,-7*i);
    wlabels.push({short:w.getDate()+"/"+(w.getMonth()+1),full:"Week of "+fullDateStr(w)});
  }
  const totM=mw.reduce((a,b)=>a+b,0);
  const head5=el("div","st-headrow");
  const big5=el("div","st-big");
  big5.appendChild(document.createTextNode(totM? totM+" missed in the last 12 weeks" : "No missed tasks in the last 12 weeks"));
  head5.appendChild(big5);
  sec5.appendChild(head5);
  const chart5=el("div","st-chart");
  chart5.appendChild(lineChartSVG(CW,wlabels,mw));
  sec5.appendChild(chart5);
  body.appendChild(sec5);

  body.scrollTop=keep;
}

/* =====================================================================
   18.6  SETUP WIZARD  (v7.1 · v7.1.2 layout + existing-account flow)

   the wizard is just a different face on the settings panel.
   The wizard appears whenever you're signed out; signing in with an
   EXISTING account fades the login form into a panel offering skip /
   re-setup / reset-account / cancel. "u" on the welcome step escapes
   to the plain login card for testing.
   ===================================================================== */
const WIZ={active:false, step:-1, existing:false};
let wzNavSeq=0;

function iconImg(name,cls){
  const img=document.createElement("img");
  img.className=cls||"wz-icon";
  img.alt=""; img.draggable=false;
  img.addEventListener("error",()=>{ img.style.display="none"; });
  img.src="icons/"+name+".svg";
  return img;
}
function wzHHMM(h){
  const tot=Math.round((Number(h)||0)*60);
  return pad(clamp(Math.floor(tot/60),0,23))+":"+pad(clamp(tot%60,0,59));
}
function timeFieldFromHour(parent,label,h){
  return field(parent,label,"time",wzHHMM(h));
}

/* ---- modern auth card (gate + wizard account step) ---- */
const EYE_ON='<svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.7"/></svg>';
const EYE_OFF='<svg viewBox="0 0 24 24"><path d="M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.7"/><path d="M4.5 4.5l15 15"/></svg>';
function buildAuthCard(mode, compact){
  const signup=mode==="signup";
  const c=el("div","au-card");
  if(!compact){
    c.appendChild(iconImg("account","au-icon"));
    c.appendChild(el("div","au-title", signup?"Create your account":"Welcome back"));
    c.appendChild(el("div","au-sub", signup?"One account keeps this laptop and your phone in sync.":"Sign in to BacTrack."));
  }
  // tab selector — switching rebuilds the card so it rises in again
  const tabs=el("div","au-tabs");
  const tIn=el("button",null,"Sign in"); tIn.type="button";
  const tUp=el("button",null,"Create account"); tUp.type="button";
  if(!signup) tIn.classList.add("on"); else tUp.classList.add("on");
  const pick=m=>{ if(m===mode) return; c.replaceWith(buildAuthCard(m, compact)); };
  tIn.addEventListener("click",()=>pick("signin"));
  tUp.addEventListener("click",()=>pick("signup"));
  tabs.append(tIn,tUp);
  c.appendChild(tabs);

  const email=field(c,"Email","text","");
  email.type="email"; email.inputMode="email";
  email.autocomplete=signup?"email":"username";
  const pwf=el("div","f");
  const pl=el("label",null,"Password"); pwf.appendChild(pl);
  const wrap=el("div","au-pw");
  const pass=el("input");
  pass.type="password";
  pass.autocomplete=signup?"new-password":"current-password";
  const pid="f_"+uid(); pass.id=pid; pl.setAttribute("for",pid);
  wrap.appendChild(pass);
  const eye=el("button","au-eye");
  eye.type="button"; eye.title="Show password";
  eye.innerHTML=EYE_ON;
  let shown=false;
  eye.addEventListener("click",()=>{
    shown=!shown; pass.type=shown?"text":"password";
    eye.innerHTML=shown?EYE_OFF:EYE_ON;
    eye.title=shown?"Hide password":"Show password";
  });
  wrap.appendChild(eye);
  pwf.appendChild(wrap);
  c.appendChild(pwf);
  const err=el("div","gate-err"); c.appendChild(err);
  const go=el("button","btn primary au-go", signup?"Create account":"Sign in");
  c.appendChild(go);
  const submit=async()=>{
    err.textContent="";
    const e=email.value.trim(), p=pass.value;
    if(!e || p.length<6){ err.textContent="Enter an email and a password of at least 6 characters."; return; }
    go.textContent="…"; go.disabled=true;
    try{
      if(signup) await firebase.auth().createUserWithEmailAndPassword(e,p);
      else await firebase.auth().signInWithEmailAndPassword(e,p);
      if(WIZ.active && WIZ.step===1){
        if(signup){
          WIZ.existing=false;
          renderWizChrome();
          wizGoTo(2);                              // brand new account → straight into setup
        }else{
          WIZ.existing=true;                        // existing account → the choice panel fades in
          renderWizChrome();
          wizGoTo(1,true,"fade");
        }
      }
    }catch(ex){
      err.textContent=authErrorText(ex);
      go.textContent=signup?"Create account":"Sign in";
      go.disabled=false;
    }
  };
  go.addEventListener("click",submit);
  pass.addEventListener("keydown",ev=>{ if(ev.key==="Enter") submit(); });
  return c;
}

/* ---- the "this account already exists" panel ---- */
function buildExistingPanel(){
  const c=el("div","au-card wz-existing");
  const check=el("div","wz-ex-check");
  check.innerHTML='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
  c.appendChild(check);
  c.appendChild(el("div","wz-ex-title","This account already exists"));
  const sub=el("div","wz-ex-sub");
  sub.appendChild(document.createTextNode("You're signed in as "));
  sub.appendChild(el("b",null,(fsUser&&fsUser.email)||""));
  sub.appendChild(document.createTextNode(". It may already have subjects, tasks and settings saved — set it up again, or jump straight in."));
  c.appendChild(sub);
  const btns=el("div","wz-ex-btns");
  const b1=el("button","btn primary","Skip setup");
  b1.addEventListener("click",()=>{
    WIZ.existing=false;
    wizFinish("Welcome back", true);
  });
  const b2=el("button","btn","Go through setup");
  b2.addEventListener("click",()=>{
    WIZ.existing=false;
    renderWizChrome();
    wizGoTo(2);
  });
  const b3=el("button","btn danger","Reset account data");
  b3.addEventListener("click",()=>confirmDelete("everything on this account — tasks, subjects and settings",async()=>{
    for(const id of Object.keys(State.todos)) await removeTodo(id);
    State.settings=JSON.parse(JSON.stringify(DEFAULTS.settings));
    State.taxonomy=JSON.parse(JSON.stringify(DEFAULTS.taxonomy));
    State.schedule=JSON.parse(JSON.stringify(DEFAULTS.schedule));
    pushConfig("settings"); pushConfig("taxonomy"); pushConfig("schedule");
    buildCountShell(); layoutScreens(); renderAll();
    WIZ.existing=false;
    renderWizChrome();
    wizGoTo(2);
    toast("Account data reset");
  }));
  const b4=el("button","btn","Cancel");
  b4.addEventListener("click",async ()=>{
    try{ await firebase.auth().signOut(); }catch(e){}
    WIZ.existing=false;
    renderWizChrome();
    wizGoTo(1,true,"fade");
  });
  btns.append(b1,b2,b3,b4);
  c.appendChild(btns);
  return c;
}

/* ---- wizard chrome + navigation ---- */
function renderWizChrome(){
  const dots=$("#wzDots"); dots.innerHTML="";
  WIZ_STEPS.forEach((_,k)=>dots.appendChild(el("i",k===WIZ.step?"on":"")));
  $("#wzCount").textContent=(WIZ.step+1)+" of "+WIZ_STEPS.length;
  $("#wzBack").hidden=WIZ.step===0;
  const n=$("#wzNext");
  n.textContent=WIZ.step===0?"Start":(WIZ.step===WIZ_STEPS.length-1?"Finish":"Continue");
  n.disabled=(WIZ.step===1 && !fsUser);
  // the existing-account panel carries its own controls — hide the footer
  $("#wzFoot").style.display=(WIZ.step===1 && WIZ.existing)?"none":"";
}
function wizBuildStage(i, anim){
  const stage=$("#wzStage");
  stage.innerHTML="";
  stage.classList.remove("wz-wide");
  const st=WIZ_STEPS[i];
  if(st.wide){
    stage.classList.add("wz-wide");
    if(st.icon) stage.appendChild(iconImg(st.icon));
    stage.appendChild(el("div","wz-title",st.title));
    stage.appendChild(el("div","wz-sub",st.sub));
    const ctr=el("div","wz-controls");
    st.build(ctr);
    stage.appendChild(ctr);
  }else{
    const cols=el("div","wz-cols");
    const left=el("div","wz-left");
    if(st.icon) left.appendChild(iconImg(st.icon));
    left.appendChild(el("div","wz-title",st.title));
    left.appendChild(el("div","wz-sub",st.sub));
    const right=el("div","wz-right");
    st.build(right);
    cols.append(left,right);
    stage.appendChild(cols);
  }
  if(State.settings.animations && anim){
    const cls=anim==="fade"?"wz-jump-x":(anim==="f"?"wz-jump-f":"wz-jump-b");
    stage.classList.add(cls);
    void stage.offsetWidth;
    stage.classList.remove(cls);
  }
}
function wizGoTo(i, force, anim){
  i=clamp(i,0,WIZ_STEPS.length-1);
  if(i===WIZ.step && WIZ.active && !force) return;
  const dir=(WIZ.step<0||i>=WIZ.step)?1:-1;
  WIZ.step=i;
  renderWizChrome();
  const stage=$("#wzStage");
  const seq=++wzNavSeq;
  const build=()=>{
    if(seq!==wzNavSeq) return;
    wizBuildStage(i, anim||(dir>0?"f":"b"));
  };
  if(State.settings.animations && WIZ.active && stage.childNodes.length){
    const out=anim==="fade"?"wz-out-x":(dir>0?"wz-out-f":"wz-out-b");
    stage.classList.add(out);
    setTimeout(()=>{
      if(seq!==wzNavSeq) return;
      stage.classList.remove("wz-out-f","wz-out-b","wz-out-x");
      build();
    },165);
  }else{
    build();
  }
}
function wizRerender(){
  // remote config arrived mid-wizard: re-fill the current step with the
  // real values (scroll position preserved, no animation)
  if(!WIZ.active) return;
  const body=$(".wz-body"), stage=$("#wzStage");
  const keep=body?body.scrollTop:0;
  wizBuildStage(WIZ.step, null);
  if(body) body.scrollTop=keep;
}
function wizNext(){
  if(!WIZ.active) return;
  if(WIZ.step===1 && !fsUser) return;
  if(WIZ.step===WIZ_STEPS.length-1){ wizFinish(); return; }
  wizGoTo(WIZ.step+1);
}
function wizBack(){
  if(!WIZ.active || WIZ.step<=0) return;
  wizGoTo(WIZ.step-1);
}
function showWizard(){
  if(WIZ.active) return;
  // clear every possible overlay before the wizard takes the screen
  closeAll();
  $("#statsScreen").classList.remove("on");
  $("#archiveScreen").classList.remove("on");
  if(editMode) toggleEdit();
  hideGate();
  WIZ.active=true; WIZ.step=-1; WIZ.existing=false;
  const app=$("#app");
  app.style.transition="none";
  app.classList.add("wiz-veiled");
  try{ app.inert=true; }catch(e){}
  void app.offsetWidth;
  app.style.transition="";
  const wz=$("#wizard");
  wz.hidden=false;
  if(State.settings.animations){
    wz.classList.add("wz-pre");
    void wz.offsetWidth;
    wz.classList.remove("wz-pre");
  }
  wizGoTo(0);
}
function hideWizard(){
  const wz=$("#wizard");
  wz.hidden=true;
  wz.classList.remove("wz-pre","zoomaway");
  const app=$("#app");
  app.style.transition="none";
  app.classList.remove("wiz-veiled");
  try{ app.inert=false; }catch(e){}
  void app.offsetWidth;
  app.style.transition="";
  WIZ.active=false;
}
function skipWizard(){
  hideWizard();
  showGate("signin");
}
function wizFinish(msg, withTut){
  const wz=$("#wizard"), app=$("#app");
  const unveil=()=>{
    wz.hidden=true;
    wz.classList.remove("wz-pre","zoomaway");
    WIZ.active=false; WIZ.existing=false;
    try{ app.inert=false; }catch(e){}
    app.classList.remove("wiz-veiled");   // #app's own transition animates the zoom-in
    renderAll();
    toast(msg||"All set — good luck with BacTrack!");
    if(withTut!==false) setTimeout(tutStart, 800);
  };
  if(!State.settings.animations){
    unveil();
    return;
  }
  wz.classList.add("zoomaway");           // fade + zoom out …
  setTimeout(unveil,430);                 // … then fade + zoom in to home
}
 $("#wzNext").addEventListener("click",wizNext);
 $("#wzBack").addEventListener("click",wizBack);

function wzRenderSchedList(list){
  list.innerHTML="";
  DAY_NAMES.forEach((n,i)=>{
    const it=el("div","item");
    const m=el("div","item-main");
    m.appendChild(el("div","item-t",n));
    const l=sessionsFor(i);
    m.appendChild(el("div","item-d", l.length? l.map(x=>subjectName(x.subject)+" "+fmtHHMM(x.start)).join(", ") : "Nothing scheduled"));
    it.appendChild(m);
    const e=el("button","item-btn","Edit"); e.addEventListener("click",()=>openDayEditor(i)); it.appendChild(e);
    list.appendChild(it);
  });
}

/* ---- the steps: {icon, title, sub} in the left column, build() fills the right ---- */
const WIZ_STEPS=[
/* 0 · welcome (wide, centred) */
{wide:true, icon:"welcome", title:"BacTrack",
 sub:"Welcome. A few quick steps and your study dashboard is ready — everything you choose here can be changed later in settings.",
 build(){}},

}},
/* 2 · the exam */
{icon:"exam", title:"The big day",
 sub:"What is the countdown counting down to?",
 build(parent){
  const s=State.settings;
  const prev=el("div","wz-prev");
  function upd(){
    prev.innerHTML="";
    const ms=Math.max(0,targetDate().getTime()-Date.now());
    [["days",Math.floor(ms/86400000)],["hours",Math.floor(ms/3600000)%24],["minutes",Math.floor(ms/60000)%60]]
    .forEach(u=>{
      const d=el("div","u");
      d.appendChild(el("b",null,String(u[1])));
      d.appendChild(el("span",null,u[0]));
      prev.appendChild(d);

  upd();
  parent.appendChild(prev);

  rowOf(parent,r=>{
    const d=field(r,"Date","date",s.targetDate);
    bindInput(d,v=>{ if(v){ s.targetDate=v; pushConfig("settings"); tickCountdown(); upd(); } });

}},
/* 3 · subjects */
{icon:"subjects", title:"Your subjects",
 sub:"Colour, name and coefficient (weight) for each subject you study. The weight is how much it counts toward the final score — the stats lean on it later.",
 build(parent){
  const list=el("div","wz-subs");
  function redraw(){
    list.innerHTML="";
    State.taxonomy.subjects.forEach(su=>{
      const row=el("div","wz-sub-row");
      const dotLab=el("label","wz-dot");
      dotLab.style.background=su.color||"#8a8a8a";
      const cin=el("input");
      cin.type="color"; cin.value=normalizeHex(su.color)||"#888888";
      cin.addEventListener("input",()=>{ su.color=cin.value; dotLab.style.background=cin.value; });
      cin.addEventListener("change",()=>{ pushConfig("taxonomy"); renderAll(); });
      dotLab.appendChild(cin);
      row.appendChild(dotLab);
      const nm=el("input","wz-sub-name");
      nm.value=su.name;
      nm.addEventListener("change",()=>{ su.name=nm.value.trim()||su.name; pushConfig("taxonomy"); renderAll(); });
      row.appendChild(nm);
      const wt=el("input","wz-sub-wt");
      wt.type="number"; wt.min="0.5"; wt.max="50"; wt.step="0.5"; wt.value=String(su.weight||1);
      wt.title="Coefficient";
      wt.addEventListener("change",()=>{
        const wv=Number(wt.value);
        su.weight=clamp(isFinite(wv)&&wv>0?wv:1,0.5,50);
        wt.value=String(su.weight);
        pushConfig("taxonomy");
      });
      row.appendChild(wt);
      const rm=el("button","wz-sub-rm","✕");
      rm.type="button"; rm.title="Remove";
      rm.addEventListener("click",()=>{
        State.taxonomy.subjects=State.taxonomy.subjects.filter(z=>z.id!==su.id);
        pushConfig("taxonomy"); renderAll(); redraw();
      });
      row.appendChild(rm);
      list.appendChild(row);
    });
  }
  redraw();
  parent.appendChild(list);
  addLine(parent,"Add a subject",name=>{
    const pool=["#3f6fb5","#7a4fb0","#3f9d6a","#b5763f","#3f9dae","#b53f6f","#b59a3f","#5a8a3f"];
    State.taxonomy.subjects.push({id:uid(),name,color:pool[State.taxonomy.subjects.length%pool.length],weight:1});
    pushConfig("taxonomy"); renderAll(); redraw();
  });
}},
/* 4 · the shape of a day */
{icon:"day", title:"The shape of a day",
 sub:"When school happens. Everything outside these blocks — and all of your days off — belongs to your tasks.",
 build(parent){
  const s=State.settings;
  const tl=el("div","wz-tl");
  const segM=el("div","seg m"); segM.title="Morning block";
  const segA=el("div","seg a"); segA.title="Afternoon block";
  const segE=el("div","seg e"); segE.title="Evening tasks";
  tl.append(segM,segA,segE);
  parent.appendChild(tl);
  parent.appendChild(el("div","wz-cap","06:00 — 24:00 · morning · afternoon · evening tasks"));
  function upd(){
    const S=6*60,E=24*60;
    const pc=v=>clamp((minOf(v)-S)/(E-S)*100,0,100);
    const m1=pc(s.morningStart), m2=pc(s.morningEnd);
    const a1=pc(s.afternoonStart), a2=pc(s.afternoonEnd);
    const e1=clamp((s.calAnchorHour*60-S)/(E-S)*100,0,100);
    const e2=clamp((s.dueBlockHour*60-S)/(E-S)*100,0,100);
    segM.style.left=m1+"%";  segM.style.width=Math.max(0,m2-m1)+"%";
    segA.style.left=a1+"%";  segA.style.width=Math.max(0,a2-a1)+"%";
    segE.style.left=e1+"%";  segE.style.width=Math.max(0,e2-e1)+"%";
  }
  upd();
  rowOf(parent,r=>{
    const f1=field(r,"Morning from","time",s.morningStart);
    bindInput(f1,v=>{ if(v){ s.morningStart=v; pushConfig("settings"); upd(); } });
    const f2=field(r,"until","time",s.morningEnd);
    bindInput(f2,v=>{ if(v){ s.morningEnd=v; pushConfig("settings"); upd(); } });
  });
  rowOf(parent,r=>{
    const f1=field(r,"Afternoon from","time",s.afternoonStart);
    bindInput(f1,v=>{ if(v){ s.afternoonStart=v; pushConfig("settings"); upd(); } });
    const f2=field(r,"until","time",s.afternoonEnd);
    bindInput(f2,v=>{ if(v){ s.afternoonEnd=v; pushConfig("settings"); upd(); } });
  });
  const dof=el("div","f");
  dof.appendChild(el("label",null,"Days off"));
  const chips=el("div","chips");
  DAY_ABBR.forEach((d,i)=>{
    const c=el("button","chip"+(isWeekend(i)?" on":""),d);
    c.type="button";
    c.addEventListener("click",()=>{
      const k=s.weekendDays.indexOf(i);
      if(k>=0) s.weekendDays.splice(k,1); else s.weekendDays.push(i);
      c.classList.toggle("on"); pushConfig("settings"); renderAll();
    });
    chips.appendChild(c);
  });
  dof.appendChild(chips); parent.appendChild(dof);
  const ws=field(parent,"Week starts on","select",String(s.weekStart),DAY_NAMES.map((n,i)=>({id:String(i),name:n})));
  bindInput(ws,v=>{ s.weekStart=Number(v); pushConfig("settings"); renderAll(); });
}},

/* 7 · reminders */
{icon:"reminders", title:"Reminders",

/* 9 · theme */
{icon:"theme", title:"Appearance",
 sub:"Pick a theme — the whole setup changes with it.",
 build(parent){
  const s=State.settings;
  const grid=el("div","wz-themecards");
  const opts=[
    {id:"light",name:"Light",bg:"#ffffff",b1:"#2b2b2b",b2:"#c9c9c9"},
    {id:"dark",name:"Dark",bg:"#111111",b1:"#e4e4e4",b2:"#3d3d3d"},
    {id:"auto",name:"Follow the system",bg:"linear-gradient(100deg,#ffffff 50%,#111111 50%)",b1:"#8a8a8a",b2:"#8a8a8a"},
    {id:"gradient",name:"Gradient · time of day",bg:"linear-gradient(135deg,#2e4968,#e9f1f6,#3f5877)",b1:"#ffffff",b2:"#12233a"}
  ];
  function draw(){
    grid.innerHTML="";
    opts.forEach(o=>{
      const c=el("button","wz-thcard"+(s.theme===o.id?" on":""));
      c.type="button";
      const p=el("div","wz-thprev");
      p.style.background=o.bg;
      const i1=el("i"); i1.style.background=o.b1;
      const i2=el("i"); i2.style.background=o.b2;
      p.append(i1,i2);
      c.appendChild(p);
      c.appendChild(el("span",null,o.name));
      c.addEventListener("click",()=>{ s.theme=o.id; pushConfig("settings"); applyTokens(); draw(); });
      grid.appendChild(c);
    });
  }
  draw();
  parent.appendChild(grid);
  const acc=colorField(parent,"Accent colour",s.accent);
  bindInput(acc,v=>{ s.accent=v.trim()||"#c0392b"; pushConfig("settings"); applyTokens(); });
}},

/* =====================================================================
   18.7  FIRST-RUN TUTORIAL  (v7.1.1)
   ===================================================================== */
const TUT_KEY="bacdash.tut";
const TUT={active:false, step:0};
const TUT_STEPS=[
  "Swipe left or right — or use the arrow keys — to move between the screens.",
  "Swipe up here — or press the up arrow — to create a task.",
  "Tap a task card to open it, start its timer and see its details.",
  "Right-click (or long-press on the phone) to enter edit mode — stats, settings and the archive live there."
];
function tutDoneFlag(){
  try{ return !!localStorage.getItem(TUT_KEY); }
  catch(e){ return true; }
}
function tutStart(){
  if(TUT.active || tutDoneFlag()) return;
  TUT.active=true; TUT.step=0;
  tutPaint();
}
function tutPaint(){
  $("#tutStep").textContent=TUT_STEPS[TUT.step];
  $("#tutNum").textContent=(TUT.step+1)+" of "+TUT_STEPS.length;
  $("#tut").classList.add("on");
}
function tutAdvance(){
  if(!TUT.active) return;
  TUT.step++;
  if(TUT.step>=TUT_STEPS.length){
    tutEnd(true);
    toast("That's the basics — everything else lives in settings");
  }else tutPaint();
}
function tutEnd(save){
  TUT.active=false;
  $("#tut").classList.remove("on");
  if(save){ try{ localStorage.setItem(TUT_KEY,"1"); }catch(e){} }
}
 $("#tutSkip").addEventListener("click",()=>tutEnd(true));

/* =====================================================================
   19. BOOT
   ===================================================================== */
function boot(){
  loadLocal();
  applyTokens();
  buildCountShell();
  layoutScreens();
  renderPresets();
  tmSet(State.settings.timerPresets[2]||25);
  swPaint();
  tickClock(); tickCountdown(); renderAll();

  const s=State.settings;
  const narrow=window.matchMedia("(max-width:760px)").matches;
  if(s.startScreen==="quickadd" || (s.startScreen==="auto" && narrow)){
    setTimeout(()=>{
      if(WIZ.active) return;
      if(!$("#gate").classList.contains("hidden")) return;
      openQuickAdd();
    },450);
  }

  setInterval(tickClock,1000);
  setInterval(tickCountdown, State.settings.showSeconds?500:15000);
  setInterval(()=>{ renderSlot(); renderTicker(); },60000);
  setInterval(()=>{ ensureSunTimes(); if(State.settings.theme==="gradient") updateGradientTheme(); },60000);

  if(darkMQ){
    const onScheme=()=>{ _ambientKey=""; applyAmbientTint(); };
    if(darkMQ.addEventListener) darkMQ.addEventListener("change",onScheme);
    else if(darkMQ.addListener) darkMQ.addListener(onScheme);
  }

  window.addEventListener("resize",()=>{
    clearTimeout(statsResizeT);
    statsResizeT=setTimeout(()=>{ if($("#statsScreen").classList.contains("on")) renderStatsView(); },150);
  });

  $("#swStart").addEventListener("click",swToggle);
  $("#swReset").addEventListener("click",swResetFn);
  $("#swLap").addEventListener("click",swLapFn);
  $("#tmStart").addEventListener("click",tmToggle);
  $("#tmReset").addEventListener("click",()=>tmSet(TM.dur/60000||25));
  $("#calPrev").addEventListener("click",()=>{ calOffset--; renderCalendar(); });
  $("#calNext").addEventListener("click",()=>{ calOffset++; renderCalendar(); });
  $("#calToday").addEventListener("click",()=>{ calOffset=0; renderCalendar(); });

  initSync();
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();

})();
</script>
