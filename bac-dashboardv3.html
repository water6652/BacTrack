<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
/* ---------------------------------------------------------------
   TOKENS
   --------------------------------------------------------------- */
:root{
  --bg:#ffffff;
  --fg:#2b2b2b;
  --fg-mid:#6e6e6e;
  --fg-soft:#9a9a9a;
  --fg-faint:#c9c9c9;
  --line:#ededed;
  --line-strong:#dcdcdc;
  --field:#f6f6f6;
  --accent:#c0392b;
  --ok:#3f7d58;
  --dh:1.14em;              /* digit cell height */
  --ease:cubic-bezier(.16,1,.3,1);
  --speed:1;
  --radius:10px;
  --fs-scale:1;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111111; --fg:#e4e4e4; --fg-mid:#a0a0a0; --fg-soft:#7a7a7a;
    --fg-faint:#3d3d3d; --line:#242424; --line-strong:#333333; --field:#1b1b1b;
  }
}
:root[data-theme="dark"]{
  --bg:#111111; --fg:#e4e4e4; --fg-mid:#a0a0a0; --fg-soft:#7a7a7a;
  --fg-faint:#3d3d3d; --line:#242424; --line-strong:#333333; --field:#1b1b1b;
}

*{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; overflow:hidden;}
body{
  background:var(--bg); color:var(--fg);
  font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:calc(16px * var(--fs-scale));
  font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"cv05" 1;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior:none; touch-action:none;
}
button,input,select,textarea{font:inherit; color:inherit; background:none; border:none; outline:none;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--fg); outline-offset:3px; border-radius:4px;}
@media (prefers-reduced-motion:reduce){ :root{--speed:0.001;} }

/* ---------------------------------------------------------------
   SHELL
   --------------------------------------------------------------- */
#app{position:fixed; inset:0; display:flex; flex-direction:column;}

#topbar{
  flex:0 0 auto; display:flex; align-items:baseline; justify-content:space-between;
  padding:18px 26px 0; font-size:.8rem; letter-spacing:.01em; color:var(--fg-mid);
  z-index:40; pointer-events:none;
}
#topbar .tb-date{font-weight:400;}
#topbar .tb-clock{font-weight:500; color:var(--fg); font-size:.95rem;}
#topbar .tb-sync{font-size:.68rem; color:var(--fg-faint); margin-left:10px;}

#viewport{flex:1 1 auto; position:relative; overflow:hidden;}
#track{
  position:absolute; inset:0; display:flex;
  transition:transform calc(.55s * var(--speed)) var(--ease);
  will-change:transform;
}
.screen{
  flex:0 0 100%; width:100%; height:100%; position:relative;
  display:flex; flex-direction:column; padding:8px 26px 0;
  overflow:hidden;
}
.screen-scroll{overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; padding-bottom:20px;}

#dots{
  flex:0 0 auto; display:flex; gap:7px; justify-content:center; align-items:center;
  padding:12px 0 6px; z-index:30;
}
#dots i{
  width:5px; height:5px; border-radius:50%; background:var(--fg-faint); display:block;
  transition:background calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease);
}
#dots i.on{background:var(--fg); transform:scale(1.35);}

#ticker{
  flex:0 0 auto; min-height:38px; display:flex; align-items:center; justify-content:center;
  padding:0 26px 16px; font-size:.82rem; color:var(--fg-mid); text-align:center;
  opacity:0; transform:translateY(6px);
  transition:opacity calc(.5s * var(--speed)) var(--ease), transform calc(.5s * var(--speed)) var(--ease);
}
#ticker.show{opacity:1; transform:none;}
#ticker b{font-weight:500; color:var(--fg);}

/* ---------------------------------------------------------------
   HOME / COUNTDOWN
   --------------------------------------------------------------- */
.home-wrap{flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:34px; min-height:0;}

.count{display:flex; align-items:flex-start; justify-content:center; gap:clamp(18px,4vw,52px);}
.count-unit{display:flex; flex-direction:column; align-items:center; gap:6px;}
.count-num{
  display:flex; font-weight:200; line-height:1;
  font-size:clamp(3.4rem,13vw,8.5rem); letter-spacing:-.045em;
  color:var(--fg); transition:color calc(.8s * var(--speed)) var(--ease);
}
.count-label{font-size:.72rem; color:var(--fg-soft); letter-spacing:.06em; font-weight:400;}
.count.urgent .count-num{color:var(--accent);}

.digit{display:block; height:var(--dh); overflow:hidden; width:.60em;}
.digit .col{display:block; transition:transform calc(.75s * var(--speed)) var(--ease); will-change:transform;}
.digit .col span{display:block; height:var(--dh); line-height:var(--dh);}
.count-sep{width:.26em;}

.slot{border-top:1px solid var(--line); padding-top:18px; min-height:0; display:flex; flex-direction:column;}
.slot-head{
  display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  font-size:.74rem; color:var(--fg-soft); margin-bottom:12px;
}
.slot-head .sh-r{color:var(--fg-faint);}
.slot-body{overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y; min-height:0;}

.row{
  display:flex; align-items:center; gap:14px; padding:9px 0;
  border-bottom:1px solid var(--line);
}
.row:last-child{border-bottom:none;}
.row-time{font-size:.8rem; color:var(--fg-soft); flex:0 0 96px; font-variant-numeric:tabular-nums;}
.row-main{flex:1 1 auto; min-width:0;}
.row-title{font-size:.98rem; font-weight:400; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.row-sub{font-size:.74rem; color:var(--fg-soft); margin-top:2px;}
.row-tag{
  flex:0 0 auto; font-size:.68rem; color:var(--fg-mid);
  border:1px solid var(--line-strong); border-radius:99px; padding:2px 9px;
}
.row.now{position:relative;}
.row.now::before{
  content:""; position:absolute; left:-14px; top:50%; width:4px; height:4px;
  border-radius:50%; background:var(--accent); transform:translateY(-50%);
}
.row.tutor .row-tag{border-color:var(--fg); color:var(--fg);}

.todo{display:flex; align-items:flex-start; gap:13px; padding:14px 16px; margin-bottom:12px;
  border:1px solid var(--line); border-radius:var(--radius); cursor:pointer;}
.todo:last-child{margin-bottom:0;}
.todo-badge{
  flex:0 0 auto; font-size:.65rem; font-weight:500; letter-spacing:.02em;
  padding:2px 8px; border-radius:99px; margin-top:2px;
  background:color-mix(in srgb, var(--badge-c) 16%, var(--bg)); color:var(--badge-c);
}
.todo-title-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.box{
  flex:0 0 auto; width:17px; height:17px; border:1.5px solid var(--fg-faint); border-radius:5px;
  margin-top:2px; position:relative;
  transition:border-color calc(.3s * var(--speed)) var(--ease), background calc(.3s * var(--speed)) var(--ease);
}
.box svg{position:absolute; inset:2px; stroke:var(--bg); stroke-width:2.6; fill:none;
  stroke-dasharray:14; stroke-dashoffset:14;
  transition:stroke-dashoffset calc(.35s * var(--speed)) var(--ease);}
.todo.done .box{background:var(--ok); border-color:var(--ok);}
.todo.done .box svg{stroke-dashoffset:0;}
.todo-main{flex:1 1 auto; min-width:0;}
.todo-title{font-size:.96rem; transition:color calc(.3s * var(--speed)) var(--ease);}
.todo.done .todo-title{color:var(--fg-faint); text-decoration:line-through; text-decoration-thickness:1px;}
.todo-meta{font-size:.72rem; color:var(--fg-soft); margin-top:3px;}
.todo-meta .dot{margin:0 6px; color:var(--fg-faint);}
.todo.overdue .todo-meta{color:var(--accent);}

.empty{padding:26px 0; text-align:center; color:var(--fg-soft); font-size:.86rem;}
.empty span{display:block; margin-top:6px; font-size:.75rem; color:var(--fg-faint);}

/* ---------------------------------------------------------------
   CALENDAR
   --------------------------------------------------------------- */
.cal-head{display:flex; align-items:baseline; justify-content:space-between; padding:10px 0 16px;}
.cal-title{font-size:1.15rem; font-weight:400;}
.cal-nav{display:flex; gap:4px; align-items:center;}
.cal-nav button{padding:5px 11px; font-size:.78rem; color:var(--fg-mid); border-radius:var(--radius);}
.cal-nav button:hover{background:var(--field);}

.cal-grid{display:flex; flex-direction:column; flex:1 1 auto; min-height:0;}
.tg-head{display:grid; grid-template-columns:44px repeat(7,1fr); flex:0 0 auto; border-bottom:1px solid var(--line); padding-bottom:8px;}
.tg-headcell{text-align:center; padding-top:2px;}
.tg-headcell .cd-name{font-size:.68rem; color:var(--fg-soft); letter-spacing:.05em; display:block;}
.tg-headcell .cd-num{font-size:.85rem; color:var(--fg-mid); margin-top:2px;}
.tg-headcell.today .cd-name{color:var(--fg); font-weight:500;}
.tg-headcell.today .cd-num{color:var(--fg); font-weight:500;}
.tg-headcell{position:relative;}
.tg-scroll{flex:1 1 auto; overflow-y:auto; overflow-x:hidden; touch-action:pan-y; overscroll-behavior:contain;}
.tg-inner{display:grid; grid-template-columns:44px repeat(7,1fr); position:relative;}
.tg-hourlabels{display:flex; flex-direction:column;}
.tg-hourlabel{font-size:.6rem; color:var(--fg-faint); text-align:right; padding-right:8px; position:relative; top:-6px;}
.tg-col{position:relative; border-left:1px solid var(--line);
  background-image:repeating-linear-gradient(to bottom, var(--line) 0, var(--line) 1px, transparent 1px, transparent var(--hourpx));}
.tg-col.off{background-color:var(--field);}
.tg-block{
  position:absolute; left:3px; right:3px; border-radius:6px; overflow:hidden;
  background:var(--field); border:1px solid var(--line-strong);
  font-size:.66rem; line-height:1.35; padding:4px 7px;
}
.tg-block .tg-sub{font-weight:500;}
.tg-block .tg-t{color:var(--fg-soft); font-size:.62rem;}
.tg-block.tutor{border-color:var(--fg); background:var(--bg); box-shadow:inset 2px 0 0 var(--fg);}

@media (max-width:760px){
  .tg-scroll{overflow-x:auto;}
  .tg-head, .tg-inner{grid-template-columns:36px repeat(7,84px); min-width:640px;}
}

/* ---------------------------------------------------------------
   STOPWATCH / TIMER
   --------------------------------------------------------------- */
.tool{flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:30px; min-height:0;}
.tool-label{font-size:.72rem; color:var(--fg-soft); letter-spacing:.09em;}
.tool-time{
  font-size:clamp(3rem,11vw,6.6rem); font-weight:200; letter-spacing:-.04em; line-height:1;
  transition:color calc(.4s * var(--speed)) var(--ease);
}
.tool-time .ms{font-size:.42em; color:var(--fg-soft); letter-spacing:-.02em;}
.tool-time.fire{color:var(--accent);}
.tool-btns{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
.btn{
  border:1px solid var(--line-strong); border-radius:99px; padding:9px 24px; font-size:.84rem;
  color:var(--fg-mid);
  transition:border-color calc(.25s * var(--speed)) var(--ease), color calc(.25s * var(--speed)) var(--ease), background calc(.25s * var(--speed)) var(--ease);
}
.btn:hover{border-color:var(--fg); color:var(--fg);}
.btn.primary{background:var(--fg); color:var(--bg); border-color:var(--fg);}
.btn.primary:hover{opacity:.85;}
.btn.small{padding:6px 15px; font-size:.76rem;}
.presets{display:flex; gap:7px; flex-wrap:wrap; justify-content:center; max-width:460px;}
.preset{border:1px solid var(--line); border-radius:99px; padding:6px 15px; font-size:.78rem; color:var(--fg-mid); position:relative;}
.preset:hover{border-color:var(--fg-soft); color:var(--fg);}
.laps{max-height:150px; overflow-y:auto; touch-action:pan-y; width:min(340px,80vw); border-top:1px solid var(--line);}
.lap{display:flex; justify-content:space-between; padding:7px 0; font-size:.8rem; color:var(--fg-mid); border-bottom:1px solid var(--line);}
.lap span:first-child{color:var(--fg-soft); font-size:.72rem;}

/* ---------------------------------------------------------------
   SHEETS / PANELS
   --------------------------------------------------------------- */
.scrim{
  position:fixed; inset:0; background:rgba(0,0,0,.28); opacity:0; pointer-events:none; z-index:60;
  transition:opacity calc(.4s * var(--speed)) var(--ease);
}
.scrim.on{opacity:1; pointer-events:auto;}

.sheet{
  position:fixed; left:50%; bottom:0; width:min(520px,100%); max-height:92vh; z-index:70;
  background:var(--bg); border-radius:18px 18px 0 0;
  border:1px solid var(--line); border-bottom:none;
  transform:translate(-50%,102%);
  transition:transform calc(.5s * var(--speed)) var(--ease);
  display:flex; flex-direction:column; overflow:hidden;
  box-shadow:0 -8px 40px rgba(0,0,0,.07);
}
.sheet.on{transform:translate(-50%,0);}

#qaSheet{
  left:0; bottom:0; width:100%; height:100%; max-height:none;
  border-radius:0; border:none;
  transform:translateY(100%);
}
#qaSheet.on{transform:translateY(0);}
#qaSheet .sheet-grip{display:none;}
#qaSheet .sheet-head{
  padding:calc(16px + env(safe-area-inset-top,0px)) 22px 12px;
  border-bottom:1px solid var(--line); flex:0 0 auto;
  display:flex; align-items:center; justify-content:space-between;
}
#qaSheet .qa-clock{font-size:.82rem; color:var(--fg-mid); display:flex; gap:10px; align-items:baseline;}
#qaSheet .qa-clock b{color:var(--fg); font-weight:500;}
#qaSheet .sheet-body{flex:1 1 auto; max-width:520px; width:100%; margin:0 auto; padding:18px 22px calc(22px + env(safe-area-inset-bottom,0px));}
.sheet-grip{width:34px; height:3px; border-radius:99px; background:var(--fg-faint); margin:10px auto 0; flex:0 0 auto;}
.sheet-head{padding:14px 22px 10px; display:flex; align-items:baseline; justify-content:space-between; flex:0 0 auto;}
.sheet-title{font-size:1.02rem; font-weight:400;}
.sheet-body{padding:6px 22px 22px; overflow-y:auto; touch-action:pan-y; flex:1 1 auto;}

.panel{
  position:fixed; top:0; right:0; height:100%; width:min(430px,100%); z-index:70;
  background:var(--bg); border-left:1px solid var(--line);
  transform:translateX(102%);
  transition:transform calc(.5s * var(--speed)) var(--ease);
  display:flex; flex-direction:column;
  box-shadow:-8px 0 40px rgba(0,0,0,.07);
}
.panel.on{transform:none;}
.panel-head{padding:20px 22px 12px; display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--line); flex:0 0 auto;}
.panel-body{padding:4px 22px 40px; overflow-y:auto; touch-action:pan-y; flex:1 1 auto;}
.x{font-size:.8rem; color:var(--fg-soft); padding:4px 8px; border-radius:6px;}
.x:hover{color:var(--fg); background:var(--field);}

/* form bits */
.f{margin-bottom:15px;}
.f > label{display:block; font-size:.72rem; color:var(--fg-soft); margin-bottom:6px; letter-spacing:.02em;}
.f input[type=text], .f input[type=date], .f input[type=time], .f input[type=number], .f select, .f textarea{
  width:100%; background:var(--field); border:1px solid transparent; border-radius:var(--radius);
  padding:11px 13px; font-size:.92rem;
  transition:border-color calc(.25s * var(--speed)) var(--ease), background calc(.25s * var(--speed)) var(--ease);
}
.f input:focus, .f select:focus, .f textarea:focus{border-color:var(--fg-faint); background:var(--bg);}
.f select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,var(--fg-soft) 50%),linear-gradient(135deg,var(--fg-soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px;}
.f-row{display:flex; gap:10px;}
.f-row > *{flex:1 1 0; min-width:0;}
.f-hint{font-size:.71rem; color:var(--fg-soft); margin-top:5px; line-height:1.45;}
.f-actions{display:flex; gap:9px; margin-top:20px;}
.f-actions .btn{flex:1 1 auto; text-align:center;}
.chips{display:flex; gap:6px; flex-wrap:wrap;}
.chip{border:1px solid var(--line-strong); border-radius:99px; padding:6px 13px; font-size:.79rem; color:var(--fg-mid);}
.chip.on{background:var(--fg); color:var(--bg); border-color:var(--fg);}
.switch{display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.switch:last-child{border-bottom:none;}
.switch-t{font-size:.9rem;}
.switch-d{font-size:.71rem; color:var(--fg-soft); margin-top:3px; max-width:88%; line-height:1.4;}
.track{flex:0 0 auto; width:38px; height:22px; border-radius:99px; background:var(--fg-faint); position:relative; transition:background calc(.3s * var(--speed)) var(--ease);}
.track i{position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:var(--bg); transition:transform calc(.3s * var(--speed)) var(--ease);}
.switch.on .track{background:var(--fg);}
.switch.on .track i{transform:translateX(16px);}

.sect{margin:26px 0 0;}
.sect > h3{font-size:.72rem; color:var(--fg-soft); letter-spacing:.06em; margin-bottom:10px; font-weight:400;}
.sect-list{border-top:1px solid var(--line);}
.item{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--line);}
.item-main{flex:1 1 auto; min-width:0;}
.item-t{font-size:.9rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-d{font-size:.71rem; color:var(--fg-soft); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.item-btn{flex:0 0 auto; font-size:.74rem; color:var(--fg-soft); padding:5px 9px; border-radius:6px;}
.item-btn:hover{background:var(--field); color:var(--fg);}
.item-btn.danger:hover{color:var(--accent);}
.swatch{flex:0 0 auto; width:11px; height:11px; border-radius:3px; border:1px solid var(--line-strong);}
.add-line{display:flex; gap:8px; margin-top:12px;}
.add-line input{flex:1 1 auto;}
.add-line .btn{flex:0 0 auto;}

/* ---------------------------------------------------------------
   EDIT MODE
   --------------------------------------------------------------- */
#editbar{
  position:fixed; left:50%; bottom:20px; transform:translate(-50%,140%); z-index:55;
  background:var(--fg); color:var(--bg); border-radius:99px; padding:9px 10px 9px 18px;
  display:flex; align-items:center; gap:12px; font-size:.79rem;
  transition:transform calc(.45s * var(--speed)) var(--ease);
  box-shadow:0 6px 26px rgba(0,0,0,.16);
}
#editbar.on{transform:translate(-50%,0);}
#editbar button{background:var(--bg); color:var(--fg); border-radius:99px; padding:5px 13px; font-size:.76rem;}

.gear{
  position:absolute; z-index:20; width:22px; height:22px; border-radius:50%;
  background:var(--bg); border:1px solid var(--line-strong);
  display:none; align-items:center; justify-content:center;
  opacity:0; transform:scale(.7);
  transition:opacity calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease), border-color calc(.2s * var(--speed)) var(--ease);
}
.gear svg{width:12px; height:12px; stroke:var(--fg-mid); fill:none; stroke-width:1.7;}
.gear:hover{border-color:var(--fg);}
.gear:hover svg{stroke:var(--fg);}
body.edit .gear{display:flex; opacity:1; transform:none;}
body.edit .editable{position:relative;}
body.edit .editable::after{
  content:""; position:absolute; inset:-5px -8px; border:1px dashed var(--fg-faint);
  border-radius:8px; pointer-events:none;
}
.gear.g-tr{top:-9px; right:-9px;}
.gear.g-inline{position:static; margin-left:6px; flex:0 0 auto;}

#toast{
  position:fixed; left:50%; bottom:74px; transform:translate(-50%,20px); z-index:90;
  background:var(--fg); color:var(--bg); font-size:.79rem; padding:9px 17px; border-radius:99px;
  opacity:0; pointer-events:none;
  transition:opacity calc(.3s * var(--speed)) var(--ease), transform calc(.3s * var(--speed)) var(--ease);
}
#toast.on{opacity:1; transform:translate(-50%,0);}

.hint-up{
  position:absolute; left:50%; bottom:6px; transform:translateX(-50%);
  font-size:.7rem; color:var(--fg-faint); display:flex; align-items:center; gap:6px;
  pointer-events:none;
}

/* ---------------------------------------------------------------
   AUTH GATE / SETUP NOTICE
   --------------------------------------------------------------- */
#gate{
  position:fixed; inset:0; z-index:200; background:var(--bg);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
#gate.hidden{display:none;}
.gate-card{width:min(360px,100%);}
.gate-title{font-size:1.3rem; font-weight:300; margin-bottom:6px;}
.gate-sub{font-size:.82rem; color:var(--fg-mid); margin-bottom:26px; line-height:1.5;}
.gate-err{font-size:.78rem; color:var(--accent); min-height:1.2em; margin-top:2px;}
.gate-actions{display:flex; gap:9px; margin-top:18px;}
.gate-actions .btn{flex:1 1 auto; text-align:center;}
.gate-switch{font-size:.78rem; color:var(--fg-soft); margin-top:18px; text-align:center;}

/* =====================================================================

/*
 * Fill this in with your own Firebase project's config before the app
 * will sync. Firebase Console → Project settings → General → "Your apps"
 * → Web app → SDK setup and configuration → Config. Full setup steps are
 * in SETUP.md next to this file, and also show on screen if this is
 * left as the placeholder below.
 */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCQcjiGRKTDVtqxegu0lSmYHKyJHw2GjrY",
  authDomain: "bactrack-7e1d0.firebaseapp.com",
  projectId: "bactrack-7e1d0",
  storageBucket: "bactrack-7e1d0.firebasestorage.app",
  messagingSenderId: "690309417690",
  appId: "1:690309417690:web:378a047ee29e964d4bf3e3"
};

const FIREBASE_CONFIGURED = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

const LS_KEY="bacdash.v1";
const State = {
  settings:JSON.parse(JSON.stringify(DEFAULTS.settings)),
  taxonomy:JSON.parse(JSON.stringify(DEFAULTS.taxonomy)),
  schedule:JSON.parse(JSON.stringify(DEFAULTS.schedule)),
  todos:{},                       // id -> todo
  _v:{settings:0,taxonomy:0,schedule:0}
};
let fsDB=null, fsUser=null, fsReady=false;
const writeLocks={};

function mergeTaxonomy(payload){
  // Additive-safe: any top-level key missing from an older saved payload
  // (e.g. "repeats", added later) falls back to the seed default instead
  // of silently disappearing.
  return Object.assign(JSON.parse(JSON.stringify(DEFAULTS.taxonomy)), payload||{});
}
function loadLocal(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(!raw) return;
    const o=JSON.parse(raw);
    if(o.settings) Object.assign(State.settings,o.settings);
    if(o.taxonomy) State.taxonomy=mergeTaxonomy(o.taxonomy);
    if(o.schedule) State.schedule=o.schedule;
    if(o.todos)    State.todos=o.todos;
    if(o._v)       State._v=o._v;
  }catch(e){ /* corrupt cache: fall back to defaults */ }
}
function saveLocal(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify({
      settings:State.settings, taxonomy:State.taxonomy,
      schedule:State.schedule, todos:State.todos, _v:State._v
    }));
  }catch(e){}
}

function markSync(txt){ $("#tbSync").textContent = txt; }

// Firestore paths, scoped under the signed-in user so the security
// rules in SETUP.md can restrict each account to its own data.
const uroot = ()=> fsDB.collection("users").doc(fsUser.uid);
const configDoc  = which => uroot().collection("config").doc(which);
const todosCol    = ()   => uroot().collection("todos");
const todoDoc     = id   => todosCol().doc(id);

/*
 * Firestore's own offline persistence (IndexedDB) is what actually
 * queues writes while you're offline and flushes them on reconnect —
 * that's enabled once, in initSync(). These helpers just fire the
 * writes; a write made offline resolves once the tab is back online,
 * but the local cache (and onSnapshot listeners) update immediately
 * either way, so the UI never waits on the network.
 */
async function writeDoc(ref, body){
  const key=ref.path;
  if(writeLocks[key]){ writeLocks[key]=body; return; }   // coalesce bursts
  writeLocks[key]=true;
  try{
    await ref.set(body, {merge:false});
    const queued=writeLocks[key];
    writeLocks[key]=null;
    if(queued && queued!==true) await writeDoc(ref,queued);
  }catch(err){
    writeLocks[key]=null;
    if(err && err.code==="resource-exhausted"){ toast("Firestore's free quota is used up for now."); }
  }
}

function pushConfig(which){
  State._v[which]=Date.now();
  saveLocal();
  if(fsReady) writeDoc(configDoc(which), {payload:State[which], updatedAt:State._v[which]});
}
function pushTodo(t){
  saveLocal();
  if(fsReady) writeDoc(todoDoc(t.id), t);
}
async function removeTodo(id){
  delete State.todos[id]; saveLocal();
  if(fsReady){ try{ await todoDoc(id).delete(); }catch(e){} }
}

/* ---- auth gate ---- */
function showGate(view){
  const g=$("#gate"); g.classList.remove("hidden"); g.innerHTML="";
  if(view==="setup") g.appendChild(buildSetupNotice());
  else g.appendChild(buildSignIn(view==="signup"));
}
function hideGate(){ $("#gate").classList.add("hidden"); }

function buildSetupNotice(){
  const c=el("div","gate-setup");
  c.appendChild(el("h1","","Connect a Firebase project"));
  const p=el("div");
  p.innerHTML =
    "This copy of the dashboard isn't wired to a backend yet, so there's nothing to sync your laptop and phone through. It's a five-minute, free setup:"+
    "<ol>"+
    "<li>Go to <code>console.firebase.google.com</code> and create a project.</li>"+
    "<li>Build &rarr; Authentication &rarr; get started &rarr; enable <b>Email/Password</b>.</li>"+
    "<li>Build &rarr; Firestore Database &rarr; create database (any region, start in <i>production</i> mode).</li>"+
    "<li>Firestore &rarr; Rules &rarr; paste the rules below &rarr; Publish.</li>"+
    "<li>Project settings (gear icon) &rarr; General &rarr; scroll to \"Your apps\" &rarr; add a Web app &rarr; copy the <code>firebaseConfig</code> object.</li>"+
    "<li>Open this file in a text editor, find <code>FIREBASE_CONFIG</code> near the top of the script, and paste your values in. Save and reopen the file.</li>"+
    "</ol>";
  c.appendChild(p);
  const pre=el("pre",null,
`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{uid}/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }
  }
}`);
  c.appendChild(pre);
  c.appendChild(el("div",null,"Once it's connected, sign in with the same email on both the laptop and the phone and everything stays in sync between them."));
  return c;
}

function buildSignIn(signup){
  const c=el("div","gate-card");
  c.appendChild(el("div","gate-title", signup?"Create your account":"Sign in"));
  c.appendChild(el("div","gate-sub", "One account, shared between this laptop and your phone."));
  const email=field(c,"Email","text","");
  const pass=field(c,"Password","password","");
  const err=el("div","gate-err"); c.appendChild(err);
  const actions=el("div","gate-actions");
  const go=el("button","btn primary", signup?"Create account":"Sign in");
  actions.appendChild(go); c.appendChild(actions);
  const submit=async()=>{
    err.textContent="";
    const e=email.value.trim(), p=pass.value;
    if(!e || p.length<6){ err.textContent="Enter an email and a password of at least 6 characters."; return; }
    go.textContent="…";
    try{
      if(signup) await firebase.auth().createUserWithEmailAndPassword(e,p);
      else await firebase.auth().signInWithEmailAndPassword(e,p);
    }catch(ex){
      err.textContent = authErrorText(ex);
      go.textContent = signup?"Create account":"Sign in";
    }
  };
  go.addEventListener("click",submit);
  pass.addEventListener("keydown",ev=>{ if(ev.key==="Enter") submit(); });
  const sw=el("div","gate-switch");
  const link=el("button",null, signup?"Have an account already? Sign in":"New here? Create an account");
  link.addEventListener("click",()=>showGate(signup?"signin":"signup"));
  sw.appendChild(link); c.appendChild(sw);
  return c;
}
function authErrorText(ex){
  const m={
    "auth/email-already-in-use":"That email already has an account — sign in instead.",
    "auth/invalid-email":"That doesn't look like a valid email.",
    "auth/wrong-password":"Wrong password.",
    "auth/user-not-found":"No account with that email yet — create one instead.",
    "auth/weak-password":"Password needs to be at least 6 characters.",
    "auth/network-request-failed":"No connection right now — try again once you're online."
  };
  return (ex && m[ex.code]) || (ex && ex.message) || "Something went wrong.";
}

/* ---- boot sequence ---- */
let liveUnsubs=[];
function teardownListeners(){ liveUnsubs.forEach(u=>{ try{u();}catch(e){} }); liveUnsubs=[]; }

async function initSync(){
  if(!FIREBASE_CONFIGURED){ showGate("setup"); markSync("not connected"); return; }

  firebase.initializeApp(FIREBASE_CONFIG);
  fsDB=firebase.firestore();
  try{ await fsDB.enablePersistence({synchronizeTabs:true}); }
  catch(e){ /* multiple tabs open, or unsupported browser: app still works, just without offline cache */ }

  firebase.auth().onAuthStateChanged(async user=>{
    teardownListeners();
    if(!user){ fsUser=null; fsReady=false; markSync("signed out"); showGate("signin"); return; }
    fsUser=user; fsReady=true; hideGate(); markSync("");
    attachListeners();
  });

  window.addEventListener("online", ()=>{ if(fsReady) markSync(""); });
  window.addEventListener("offline", ()=>{ if(fsReady) markSync("offline"); });
}

function attachListeners(){
  ["settings","taxonomy","schedule"].forEach(which=>{
    const un=configDoc(which).onSnapshot(snap=>{
      if(!snap.exists) return;
      const d=snap.data();
      if(!d || typeof d.updatedAt!=="number") return;
      if(d.updatedAt <= (State._v[which]||0)) return;
      State._v[which]=d.updatedAt;
      if(which==="settings") Object.assign(State.settings, d.payload||{});
      else if(which==="taxonomy") State.taxonomy=mergeTaxonomy(d.payload);
      else State[which]=d.payload||State[which];
      saveLocal(); applyTokens(); renderAll();
      markSync(snap.metadata.fromCache?"offline":"");
    }, err=>{ markSync("offline"); });
    liveUnsubs.push(un);
  });

  const un2=todosCol().onSnapshot(snap=>{
    snap.docChanges().forEach(ch=>{
      const d=ch.doc.data();
      if(ch.type==="removed"){ delete State.todos[ch.doc.id]; }
      else if(d && d.id){
        const cur=State.todos[d.id];
        if(!cur || (d.updatedAt||0) >= (cur.updatedAt||0)) State.todos[d.id]=d;
      }
    });
    saveLocal(); renderAll();
    markSync(snap.metadata.fromCache?"offline":"");
  }, err=>{ markSync("offline"); });
  liveUnsubs.push(un2);

  // seed this account's first run
  configDoc("settings").get().then(s=>{
    if(!s.exists){ pushConfig("settings"); pushConfig("taxonomy"); pushConfig("schedule"); }
  }).catch(()=>{});
}

function signOut(){ firebase.auth().signOut(); }

function methodColor(id){
  const list=State.taxonomy.methods, i=list.findIndex(m=>m.id===id);
  return (list[i]&&list[i].color) || METHOD_BADGE_PALETTE[Math.max(0,i)%METHOD_BADGE_PALETTE.length];

const methodById  = id => State.taxonomy.methods.find(m=>m.id===id);

const typeName    = id => (typeById(id)||{}).name || "—";

  const list=(State.schedule.days[dow]||[]).slice();

function todosArray(){

function sortTodos(list){
  const s=State.settings;
  const arr=list.slice();
  arr.sort((a,b)=>{
    if(s.doneStyle==="bottom" && (!!a.done)!==(!!b.done)) return a.done?1:-1;
    if(s.taskSort==="subject"){ const d=subjectName(a.subject).localeCompare(subjectName(b.subject)); if(d) return d; }
    if(s.taskSort==="type"){ const d=typeName(a.type).localeCompare(typeName(b.type)); if(d) return d; }
    return (a.due||"").localeCompare(b.due||"") || (a.createdAt||0)-(b.createdAt||0);
  });
  return arr;
}

/* ---------------------------------------------------------------
   GRADIENT THEME (time-of-day, driven by real sunrise/sunset)
   --------------------------------------------------------------- */
function hexToRgb(hex){
  const h=hex.replace("#","");
  const n=parseInt(h.length===3?h.split("").map(c=>c+c).join(""):h,16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
function lerpColor(a,b,t){
  const A=hexToRgb(a), B=hexToRgb(b);
  const c=A.map((v,i)=>Math.round(v+(B[i]-v)*clamp(t,0,1)));
  return "#"+c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
const SUN_COLORS={ night:"#0d1117", dawn:"#e08a52", day:"#eaf4ff", dusk:"#e8623f" };

function fallbackSunTimes(base){
  // Used offline / if the sunrise-sunset.org fetch fails — a reasonable
  // year-round approximation for Algeria's latitude, so the gradient still
  // has *something* sensible to show instead of breaking.
  const mk=(h,m)=>{ const d=new Date(base); d.setHours(h,m,0,0); return d; };
  return {civilBegin:mk(5,45), sunrise:mk(6,15), sunset:mk(18,15), civilEnd:mk(18,45)};
}
async function fetchSunTimes(dateISO,lat,lng){
  const cacheKey="bacdash.sun."+lat+","+lng+"."+dateISO;
  try{
    const c=localStorage.getItem(cacheKey);
    if(c) return JSON.parse(c);
  }catch(e){}
  try{
    const res=await fetch("https://api.sunrise-sunset.org/json?lat="+lat+"&lng="+lng+"&date="+dateISO+"&formatted=0");
    const j=await res.json();
    if(j.status!=="OK") throw new Error("bad status");
    const out={
      civilBegin:j.results.civil_twilight_begin,
      sunrise:j.results.sunrise,
      sunset:j.results.sunset,
      civilEnd:j.results.civil_twilight_end
    };
    try{ localStorage.setItem(cacheKey,JSON.stringify(out)); }catch(e){}
    return out;
  }catch(e){ return null; }
}
let sunCache=null, sunCacheDate=null, sunFetchInFlight=false;
function ensureSunTimes(){
  const today=iso(new Date());
  if(sunCache && sunCacheDate===today) return;
  if(sunFetchInFlight) return;
  sunFetchInFlight=true;
  const s=State.settings;
  fetchSunTimes(today,s.gradientLat,s.gradientLng).then(r=>{
    sunFetchInFlight=false;
    if(r){
      sunCache={
        civilBegin:new Date(r.civilBegin), sunrise:new Date(r.sunrise),
        sunset:new Date(r.sunset), civilEnd:new Date(r.civilEnd)
      };
    }else{
      sunCache=fallbackSunTimes(new Date());
    }
    sunCacheDate=today;
    if(State.settings.theme==="gradient") updateGradientTheme();
  });
}
function updateGradientTheme(){
  if(!sunCache) sunCache=fallbackSunTimes(new Date());
  const now=new Date();
  const {civilBegin,sunrise,sunset,civilEnd}=sunCache;
  const dayMs=86400000;
  const anchors=[
    {t:civilEnd.getTime()-dayMs, c:SUN_COLORS.night, theme:"dark"},
    {t:civilBegin.getTime(),     c:SUN_COLORS.night, theme:"dark"},
    {t:sunrise.getTime(),        c:SUN_COLORS.dawn,  theme:"dark"},
    {t:sunrise.getTime()+40*60000, c:SUN_COLORS.day, theme:"light"},
    {t:sunset.getTime()-40*60000,  c:SUN_COLORS.day, theme:"light"},
    {t:sunset.getTime(),        c:SUN_COLORS.dusk,  theme:"light"},
    {t:civilEnd.getTime(),      c:SUN_COLORS.night, theme:"dark"},
    {t:civilBegin.getTime()+dayMs, c:SUN_COLORS.night, theme:"dark"}
  ];
  const nt=now.getTime();
  let seg=anchors[0];
  for(let i=0;i<anchors.length-1;i++){
    if(nt>=anchors[i].t && nt<anchors[i+1].t){
      const frac=(nt-anchors[i].t)/(anchors[i+1].t-anchors[i].t);
      const color=lerpColor(anchors[i].c,anchors[i+1].c,frac);
      applyGradient(color,anchors[i].theme);
      return;
    }
    seg=anchors[i+1];
  }
  applyGradient(seg.c,seg.theme);
}
function applyGradient(color,themeMode){
  const r=document.documentElement;
  r.setAttribute("data-theme",themeMode);
  const edge=lerpColor(color, themeMode==="dark"?"#000000":"#ffffff", 0.22);
  document.body.style.backgroundImage="linear-gradient(165deg,"+color+","+edge+")";
}

function currentSlot(){
  const s=State.settings, n=new Date(), dow=n.getDay();
  const cur=n.getHours()*60+n.getMinutes();
  if(isWeekend(dow) && s.weekendShowsTasks) return "tasks";
  if(cur>=minOf(s.morningStart) && cur<minOf(s.morningEnd))     return "morning";
  if(cur>=minOf(s.afternoonStart) && cur<minOf(s.afternoonEnd)) return "afternoon";
  return "tasks";
}

function renderSlot(){
  const s=State.settings;
  const mode=currentSlot();
  const body=$("#slotBody"); body.innerHTML="";
  const now=new Date(), dow=now.getDay(), cur=now.getHours()*60+now.getMinutes();

  if(mode==="tasks"){
    $("#slotTitle").textContent="Tasks";
    let list=todosArray().filter(t=>{
      if(!t.done) return true;
      if(s.doneStyle==="hide") return false;
      if(s.autoClearDays>0 && t.doneAt && (Date.now()-t.doneAt)/86400000 > s.autoClearDays) return false;
      return true;
    });
    // only today + overdue + next 14 days keeps the home list focused
    const horizon=iso(addDays(now,14));
    list=list.filter(t=>!t.due || t.due<=horizon);
    const open=list.filter(t=>!t.done).length;
    $("#slotRight").textContent = open ? open+" open" : "";
    if(!list.length){
      body.appendChild(emptyState("Nothing queued.","Swipe up to add a task."));
      return;
    }
    sortTodos(list).forEach(t=> body.appendChild(todoRow(t)));
    return;
  }

  const isM = mode==="morning";
  const from=isM?minOf(s.morningStart):minOf(s.afternoonStart);
  const to  =isM?minOf(s.morningEnd):minOf(s.afternoonEnd);
  $("#slotTitle").textContent = isM ? "This morning" : "This afternoon";
  $("#slotRight").textContent = (isM?s.morningStart:s.afternoonStart)+" – "+(isM?s.morningEnd:s.afternoonEnd);

  const list=sessionsFor(dow).filter(x=>minOf(x.start)<to && minOf(x.end)>from);
  if(!list.length){ body.appendChild(emptyState("No sessions in this block.","Right-click to edit "+DAY_NAMES[dow]+".")); return; }

  list.forEach(x=>{
    const r=el("div","row"+(x.kind==="tutoring"?" tutor":"")+((cur>=minOf(x.start)&&cur<minOf(x.end))?" now":""));
    r.appendChild(el("div","row-time", x.start+" – "+x.end));
    const m=el("div","row-main");
    m.appendChild(el("div","row-title", subjectName(x.subject)));
    r.appendChild(m);
    if(x.kind==="tutoring") r.appendChild(el("div","row-tag","tutoring"));
    body.appendChild(r);
  });
}

function renderTicker(){
  const s=State.settings, box=$("#ticker");
  if(!s.reminderOn){ box.classList.remove("show"); box.innerHTML=""; return; }
  const now=new Date();
  let best=null;
  for(let off=0; off<=2; off++){
    const d=addDays(now,off), dow=d.getDay();
    sessionsFor(dow).forEach(x=>{
      if(s.reminderTutoringOnly && x.kind!=="tutoring") return;
      const when=new Date(d.getFullYear(),d.getMonth(),d.getDate(),...x.start.split(":").map(Number));
      const hrs=(when-now)/3600000;
      if(hrs>0 && hrs<=s.reminderLeadHours && (!best||when<best.when)) best={when,x,off};
    });
  }
  if(!best){ box.classList.remove("show"); return; }
  const when = best.off===0?"today":(best.off===1?"tomorrow":DAY_NAMES[best.when.getDay()]);
  box.innerHTML="";
  const label = best.x.kind==="tutoring" ? "tutoring" : "class";
  box.appendChild(document.createTextNode(subjectName(best.x.subject)+" "+label+" "+when+" at "));
  box.appendChild(el("b",null,best.x.start));
  box.classList.add("show");
}

const SW={running:false,base:0,acc:0,laps:[],raf:null};
function swFmt(ms){
  const t=Math.floor(ms/10), cs=t%100, sec=Math.floor(t/100)%60,
        min=Math.floor(t/6000)%60, hr=Math.floor(t/360000);
  return (hr?hr+":":"")+pad(min)+":"+pad(sec)+'<span class="ms">.'+pad(cs)+"</span>";
}
function swNow(){ return SW.acc + (SW.running?Date.now()-SW.base:0); }
function swPaint(){
  $("#swDisplay").innerHTML = swFmt(swNow());
  if(SW.running) SW.raf=requestAnimationFrame(swPaint);
}
function swToggle(){
  if(SW.running){ SW.acc=swNow(); SW.running=false; cancelAnimationFrame(SW.raf); $("#swStart").textContent="Start"; }
  else{ SW.base=Date.now(); SW.running=true; $("#swStart").textContent="Pause"; swPaint(); }
}
function swResetFn(){ SW.running=false; cancelAnimationFrame(SW.raf); SW.acc=0; SW.laps=[]; $("#swStart").textContent="Start"; swPaint(); swRenderLaps(); }
function swLapFn(){
  if(!SW.running) return;
  SW.laps.unshift(swNow()); swRenderLaps();
}
function swRenderLaps(){
  const box=$("#swLaps");
  box.hidden = !State.settings.swLaps || !SW.laps.length;

const TM={running:false,end:0,left:0,dur:0,int:null};
function tmFmt(ms){
  const t=Math.ceil(ms/1000), s=t%60, m=Math.floor(t/60)%60, h=Math.floor(t/3600);
  return (h?h+":"+pad(m):String(m).padStart(2,"0"))+":"+pad(s);
}
function tmPaint(){
  const left = TM.running ? Math.max(0,TM.end-Date.now()) : TM.left;
  const d=$("#tmDisplay");
  d.textContent = tmFmt(left);
  d.classList.toggle("fire", TM.running && left<=10000 && left>0);
  if(TM.running && left<=0) tmFire();
}
function tmSet(mins){ TM.dur=mins*60000; TM.left=TM.dur; TM.running=false; clearInterval(TM.int); $("#tmStart").textContent="Start"; tmPaint(); }
function tmToggle(){
  if(TM.running){ TM.left=Math.max(0,TM.end-Date.now()); TM.running=false; clearInterval(TM.int); $("#tmStart").textContent="Start"; }
  else{
    if(TM.left<=0) return;
    TM.end=Date.now()+TM.left; TM.running=true; $("#tmStart").textContent="Pause";
    TM.int=setInterval(tmPaint,100);
  }
  tmPaint();
}
function tmFire(){
  TM.running=false; clearInterval(TM.int); TM.left=0; $("#tmStart").textContent="Start";
  $("#tmDisplay").classList.add("fire");
  if(State.settings.timerSound) beep();
  toast("Timer finished");
  setTimeout(()=>$("#tmDisplay").classList.remove("fire"),4000);
}
function beep(){
  try{
    const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    const ctx=new C();
    [0,0.28,0.56].forEach(t=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=660;
      g.gain.setValueAtTime(0.0001,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.25,ctx.currentTime+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+t+0.22);
      o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+0.25);
    });
    setTimeout(()=>ctx.close(),1400);
  }catch(e){}
}
function renderPresets(){
  const box=$("#tmPresets"); box.innerHTML="";
  State.settings.timerPresets.forEach(m=>{
    const b=el("button","preset", m+" min");
    b.addEventListener("click",()=>{ tmSet(m); if(!TM.running) tmToggle(); });
    box.appendChild(b);
  });
  const c=el("button","preset","Custom");
  c.addEventListener("click",openTimerCustom);
  box.appendChild(c);
}
function openTimerCustom(){
  openEditor("Custom timer", b=>{
    const mins=field(b,"Minutes","number",String(Math.round((TM.dur||1500)/60000)));
    actions(b,"Set",()=>{ tmSet(clamp(Number(mins.value)||1,1,600)); closeEditor(); });

}

function goTo(i,instant){

  if(instant){ t.style.transition="none"; }
  t.style.transform="translateX("+(-screenIdx*100)+"%)";
  if(instant) requestAnimationFrame(()=>{ t.style.transition=""; });
  $$("#dots i").forEach((d,k)=>d.classList.toggle("on",k===screenIdx));
  const cur=order[screenIdx];
  if(cur==="stopwatch") swPaint();
  if(cur==="timer") tmPaint();
  updateHint();
}
const homeIdx=()=>Math.max(0,ORDER().indexOf("home"));

function updateHint(){
  const h=$("#hintUp");
  h.textContent = (State.settings.hintsOn && ORDER()[screenIdx]==="home") ? "swipe up to add a task" : "";
}

/* gesture layer: trackpad wheel, touch, keyboard
   A single physical trackpad swipe fires many "wheel" events, including a
   short inertial tail after the fingers lift. Treat everything between the
   first event and a quiet gap as ONE gesture: decide at most once per
   gesture, then ignore the tail — but cap how long we'll ignore for, so a
   slow trickle of tiny residual events can never block the NEXT swipe. */
let wheelX=0, wheelY=0, wheelDecided=false, wheelQuietTimer=null, wheelCapTimer=null;
const WHEEL_QUIET_MS=90;   // no events for this long => gesture considered finished
const WHEEL_CAP_MS=260;    // hard ceiling on how long one gesture can suppress the next
function navStep(dir){ goTo(screenIdx+dir); }

function wheelGestureEnd(){
  wheelX=0; wheelY=0; wheelDecided=false;
  clearTimeout(wheelQuietTimer); clearTimeout(wheelCapTimer);
  wheelQuietTimer=null; wheelCapTimer=null;
}

window.addEventListener("wheel", e=>{
  if(sheetOpen()) return;
  const tgtEl = (e.target && e.target.closest) ? e.target : null;
  if(tgtEl && tgtEl.closest(".slot-body,.cal-day,.laps,.screen-scroll,.cal-grid,.tg-scroll")) {
    if(Math.abs(e.deltaY)>Math.abs(e.deltaX)) return;   // let inner lists scroll their own gesture
  }

  clearTimeout(wheelQuietTimer);
  wheelQuietTimer=setTimeout(wheelGestureEnd,WHEEL_QUIET_MS);
  if(!wheelCapTimer) wheelCapTimer=setTimeout(wheelGestureEnd,WHEEL_CAP_MS);

  if(wheelDecided) return;   // already navigated once for this gesture — ignore the inertial tail

  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){
    wheelX+=e.deltaX; wheelY=0;
    if(Math.abs(wheelX)>70){ navStep(wheelX>0?1:-1); wheelDecided=true; }
  }else{
    wheelY+=e.deltaY; wheelX=0;
    const up = State.settings.invertVertical ? wheelY<0 : wheelY>0;
    if(Math.abs(wheelY)>90 && up && ORDER()[screenIdx]==="home"){ openQuickAdd(); wheelDecided=true; }
  }
},{passive:true});

let tStart=null, tMoved=false, pressTimer=null;
window.addEventListener("touchstart", e=>{
  if(e.touches.length!==1) return;
  const t=e.touches[0];
  tStart={x:t.clientX,y:t.clientY,time:Date.now(),scroll:!!e.target.closest(".slot-body,.cal-day,.laps,.sheet-body,.panel-body,.cal-grid")};
  tMoved=false;
  clearTimeout(pressTimer);
  const tgt=e.target;
  pressTimer=setTimeout(()=>{ if(!tMoved && !tgt.closest(".sheet,.panel")) toggleEdit(); },600);
},{passive:true});
window.addEventListener("touchmove", e=>{
  if(!tStart) return;
  const t=e.touches[0];
  if(Math.abs(t.clientX-tStart.x)>8||Math.abs(t.clientY-tStart.y)>8){ tMoved=true; clearTimeout(pressTimer); }
},{passive:true});
window.addEventListener("touchend", e=>{
  clearTimeout(pressTimer);
  if(!tStart || sheetOpen()){ tStart=null; return; }
  const t=e.changedTouches[0];
  const dx=t.clientX-tStart.x, dy=t.clientY-tStart.y, dt=Date.now()-tStart.time;
  tStart=null;
  if(dt>700) return;
  if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.4){ navStep(dx<0?1:-1); return; }
  if(dy<-70 && Math.abs(dy)>Math.abs(dx)*1.4 && ORDER()[screenIdx]==="home"){ openQuickAdd(); }
},{passive:true});

window.addEventListener("keydown", e=>{
  if(e.target.matches("input,select,textarea")){
    if(e.key==="Escape") e.target.blur();
    return;
  }
  if(e.key==="ArrowRight") navStep(1);
  else if(e.key==="ArrowLeft") navStep(-1);
  else if(e.key==="ArrowUp" && ORDER()[screenIdx]==="home") openQuickAdd();
  else if(e.key==="Escape"){ if(qaHasDraft()) closeQuickAdd(); else if(sheetOpen()) closeAll(); else if(editMode) toggleEdit(); }
  else if(e.key===" " && ORDER()[screenIdx]==="stopwatch"){ e.preventDefault(); swToggle(); }
  else if(e.key===" " && ORDER()[screenIdx]==="timer"){ e.preventDefault(); tmToggle(); }
});

window.addEventListener("contextmenu", e=>{
  if(e.target.closest(".sheet,.panel")) return;
  e.preventDefault(); toggleEdit();
});

}
function syncMethodField(){
  const ty=typeById($("#qaType").value);

function syncRepeatField(){
  const r=repeatById($("#qaRepeat").value);
  $("#qaRepeatHint").textContent = r && r.intervals && r.intervals.length
    ? "Also creates follow-ups on days "+r.intervals.join(", ")+" after the due date."

  const wrap=$("#qaDueChips"); wrap.innerHTML="";

function saveQuickAdd(){
  const title=$("#qaName").value.trim();
  if(!title){ $("#qaName").focus(); toast("Give the task a name."); return; }
  const type=$("#qaType").value, subject=$("#qaSubject").value;
  const ty=typeById(type);
  const method=(ty&&ty.method)?$("#qaMethod").value:"";
  const due=$("#qaDate").value||iso(new Date());
  const rep=repeatById($("#qaRepeat").value);
  const series=(rep&&rep.intervals&&rep.intervals.length)?uid():null;
  const base=fromISO(due);

  const mk=(d,step)=>{
    const t={id:uid(),title,type,subject,method:method||null,due:iso(d),done:false,doneAt:null,
             seriesId:series,step:step||null,createdAt:Date.now(),updatedAt:Date.now()};
    State.todos[t.id]=t; pushTodo(t);
  };
  mk(base, series?"1/"+(rep.intervals.length+1):null);
  if(series) rep.intervals.forEach((off,i)=> mk(addDays(base,off), (i+2)+"/"+(rep.intervals.length+1)));

  closeAll(); renderAll();
  toast(series ? (rep.intervals.length+1)+" tasks scheduled" : "Task added");
}

function field(parent,label,type,value,opts){

function openTodoEditor(t){
  openEditor("Task", b=>{
    const name=field(b,"What is it","text",t.title);
    let ty,su,me;
    rowOf(b,r=>{
      ty=field(r,"Type","select",t.type,State.taxonomy.types);
      su=field(r,"Subject","select",t.subject,State.taxonomy.subjects);
    });
    me=field(b,"Method","select",t.method||"",[{id:"",name:"— none —"}].concat(methodsFor(t.subject)));
    const due=field(b,"Due","date",t.due);
    if(t.seriesId) hint(b,"Part of a repeating series ("+(t.step||"")+"). Deleting this one leaves the rest.");
    actions(b,"Save",()=>{
      t.title=name.value.trim()||t.title; t.type=ty.value; t.subject=su.value;
      t.method=me.value||null; t.due=due.value; t.updatedAt=Date.now();
      State.todos[t.id]=t; pushTodo(t); closeEditor(); renderAll();
    },"Delete",()=>{
      confirmDelete("this task",async()=>{ await removeTodo(t.id); renderAll(); toast("Task deleted"); });
    });
    if(t.seriesId){
      const extra=el("button","btn small","Delete whole series");
      extra.style.marginTop="10px";
      extra.addEventListener("click",()=>{
        confirmDelete("the whole series",async()=>{
          const ids=todosArray().filter(x=>x.seriesId===t.seriesId).map(x=>x.id);
          for(const id of ids) await removeTodo(id);
          renderAll(); toast(ids.length+" tasks deleted");
        });
      });
      b.appendChild(extra);
    }
  });
}

function openDayEditor(dow){
  openEditor(DAY_NAMES[dow], b=>{
    const list=el("div","sect-list");
    sessionsFor(dow).forEach(x=>{
      const it=el("div","item");
      const m=el("div","item-main");
      m.appendChild(el("div","item-t", subjectName(x.subject)));
      m.appendChild(el("div","item-d", x.start+"–"+x.end+(x.kind==="tutoring"?" · tutoring":"")));
      it.appendChild(m);
      const e=el("button","item-btn","Edit"); e.addEventListener("click",()=>openSessionEditor(dow,x)); it.appendChild(e);
      const d=el("button","item-btn danger","Remove");
      d.addEventListener("click",()=>confirmDelete("this session",()=>{
        State.schedule.days[dow]=sessionsFor(dow).filter(y=>y.id!==x.id);
        pushConfig("schedule"); openDayEditor(dow); renderAll();
      }));
      it.appendChild(d);
      list.appendChild(it);
    });
    if(!sessionsFor(dow).length) list.appendChild(el("div","empty","No sessions on this day."));
    b.appendChild(list);
    actions(b,"Add a session",()=>openSessionEditor(dow,null));
  });
}
function openSessionEditor(dow,x){
  const isNew=!x;
  x=x||{id:uid(),subject:State.taxonomy.subjects[0].id,start:"08:00",end:"10:00",kind:"class"};
  openEditor(isNew?"New session":"Session", b=>{
    const su=field(b,"Subject","select",x.subject,State.taxonomy.subjects);
    let st,en;
    rowOf(b,r=>{ st=field(r,"Starts","time",x.start); en=field(r,"Ends","time",x.end); });
    const kd=field(b,"Kind","select",x.kind,[{id:"class",name:"Class"},{id:"tutoring",name:"Tutoring"}]);
    hint(b,"Tutoring sessions are what the reminder line at the bottom watches for.");
    actions(b,"Save",()=>{
      x.subject=su.value; x.start=st.value||x.start; x.end=en.value||x.end; x.kind=kd.value;
      const arr=State.schedule.days[dow]||[];
      if(isNew) arr.push(x); else{ const i=arr.findIndex(y=>y.id===x.id); if(i>=0) arr[i]=x; }
      State.schedule.days[dow]=arr; pushConfig("schedule");
      openDayEditor(dow); renderAll();
    },"Back",()=>openDayEditor(dow));
  });
}

function renderSettings(){
  const s=State.settings, b=$("#stBody"); b.innerHTML="";

  let sec=section(b,"Countdown","countdown");
  rowOf(sec,r=>{
    bindInput(field(r,"Date","date",s.targetDate),v=>{ s.targetDate=v; pushConfig("settings"); tickCountdown(); });
    bindInput(field(r,"Time","time",s.targetTime),v=>{ s.targetTime=v; pushConfig("settings"); tickCountdown(); });
  });
  bindInput(field(sec,"Label","text",s.countdownLabel),v=>{ s.countdownLabel=v; pushConfig("settings"); tickCountdown(); });
  sw(sec,"Show seconds","A fourth column that updates every second.",s.showSeconds,
    v=>{ s.showSeconds=v; if(v) s.showDaysOnly=false; pushConfig("settings"); buildCountShell(); tickCountdown(); renderSettings(); });
  sw(sec,"Days only","Drop hours and minutes entirely.",s.showDaysOnly,
    v=>{ s.showDaysOnly=v; if(v) s.showSeconds=false; pushConfig("settings"); buildCountShell(); tickCountdown(); renderSettings(); });
  sw(sec,"Colour the last stretch","Numbers turn accent-coloured near the end.",s.urgentColor,

  /* --- appearance --- */
  sec=section(b,"Appearance","appearance");
  bindInput(field(sec,"Theme","select",s.theme,
    [{id:"light",name:"Light"},{id:"dark",name:"Dark"},{id:"auto",name:"Follow the system"},{id:"gradient",name:"Gradient (time of day)"}]),
    v=>{ s.theme=v; pushConfig("settings"); applyTokens(); renderSettings(); });
  if(s.theme==="gradient"){
    rowOf(sec,r=>{
      bindInput(field(r,"Latitude","number",s.gradientLat),v=>{ s.gradientLat=Number(v)||s.gradientLat; pushConfig("settings"); sunCacheDate=null; applyTokens(); });
      bindInput(field(r,"Longitude","number",s.gradientLng),v=>{ s.gradientLng=Number(v)||s.gradientLng; pushConfig("settings"); sunCacheDate=null; applyTokens(); });
    });

  }
  const acc=field(sec,"Accent colour","text",s.accent);
  bindInput(acc,v=>{ s.accent=v.trim()||"#c0392b"; pushConfig("settings"); applyTokens(); });
  hint(sec,"Used for urgency, overdue tasks and the live-session marker. Any CSS colour works.");
  bindInput(field(sec,"Text size","select",String(s.fontScale),
    [{id:"0.9",name:"Small"},{id:"1",name:"Normal"},{id:"1.12",name:"Large"},{id:"1.28",name:"Extra large"}]),
    v=>{ s.fontScale=Number(v); pushConfig("settings"); applyTokens(); });
  sw(sec,"Animations","Turn off if the machine struggles to keep up.",s.animations,
    v=>{ s.animations=v; pushConfig("settings"); applyTokens(); });

  /* --- day structure --- */

    bindInput(field(r,"Morning from","time",s.morningStart),v=>{ s.morningStart=v; pushConfig("settings"); renderSlot(); });

  });
  rowOf(sec,r=>{
    bindInput(field(r,"Afternoon from","time",s.afternoonStart),v=>{ s.afternoonStart=v; pushConfig("settings"); renderSlot(); });
    bindInput(field(r,"until","time",s.afternoonEnd),v=>{ s.afternoonEnd=v; pushConfig("settings"); renderSlot(); });
  });
  hint(sec,"Outside these two blocks the home screen shows your tasks instead.");
  const wf=el("div","f");

    const c=el("button","chip"+(isWeekend(i)?" on":""),d);

      const k=s.weekendDays.indexOf(i);
      if(k>=0) s.weekendDays.splice(k,1); else s.weekendDays.push(i);
      c.classList.toggle("on"); pushConfig("settings"); renderAll();
    });
    chips.appendChild(c);
  });

        const ids=todosArray().filter(t=>t.subject===su.id).map(t=>t.id);
        for(const id of ids) await removeTodo(id);
        pushConfig("taxonomy"); pushConfig("schedule"); renderAll(); renderSettings();
      });
    });
    it.appendChild(d);
    sl.appendChild(it);
  });
  sec.appendChild(sl);
  addLine(sec,"Add a subject",name=>{
    State.taxonomy.subjects.push({id:uid(),name,color:"#2b2b2b"});
    pushConfig("taxonomy"); renderSettings();
  });

  /* --- types --- */
  sec=section(b,"Task types","types");
  const tl=el("div","sect-list");
  State.taxonomy.types.forEach(ty=>{
    const it=el("div","item");
    const m=el("div","item-main");
    m.appendChild(el("div","item-t",ty.name));
    m.appendChild(el("div","item-d", ty.method?"Asks for a method":"No method field"));
    it.appendChild(m);
    const e=el("button","item-btn","Edit");
    e.addEventListener("click",()=>openEditor("Task type",bb=>{
      const nm=field(bb,"Name","text",ty.name);
      let flag=ty.method;
      sw(bb,"Ask for a study method","Shows the method dropdown when you pick this type.",ty.method,v=>flag=v);
      actions(bb,"Save",()=>{ ty.name=nm.value.trim()||ty.name; ty.method=flag; pushConfig("taxonomy"); closeEditor(); renderSettings(); });
    }));
    it.appendChild(e);
    const d=el("button","item-btn danger","Remove");
    d.addEventListener("click",()=>{
      const used=todosArray().filter(t=>t.type===ty.id).length;
      confirmDelete(used?("\""+ty.name+"\" — "+used+" tasks use it and will go too"):("\""+ty.name+"\""),async()=>{
        State.taxonomy.types=State.taxonomy.types.filter(z=>z.id!==ty.id);
        const ids=todosArray().filter(t=>t.type===ty.id).map(t=>t.id);
        for(const id of ids) await removeTodo(id);
        pushConfig("taxonomy"); renderAll(); renderSettings();
      });
    });
    it.appendChild(d);
    tl.appendChild(it);
  });
  sec.appendChild(tl);
  addLine(sec,"Add a type",name=>{
    State.taxonomy.types.push({id:uid(),name,method:false});
    pushConfig("taxonomy"); renderSettings();
  });

  /* --- methods --- */
  sec=section(b,"Study methods","methods");
  const ml=el("div","sect-list");
  State.taxonomy.methods.forEach(me=>{
    const it=el("div","item");
    const m=el("div","item-main");
    m.appendChild(el("div","item-t",me.name));
    const scope=(!me.subjects||!me.subjects.length)?"Every subject":me.subjects.map(subjectName).join(", ");
    m.appendChild(el("div","item-d",scope));
    it.appendChild(m);
    const e=el("button","item-btn","Edit"); e.addEventListener("click",()=>openMethodEditor(me)); it.appendChild(e);
    const d=el("button","item-btn danger","Remove");
    d.addEventListener("click",()=>confirmDelete("\""+me.name+"\"",()=>{
      State.taxonomy.methods=State.taxonomy.methods.filter(z=>z.id!==me.id);
      todosArray().forEach(t=>{ if(t.method===me.id){ t.method=null; t.updatedAt=Date.now(); pushTodo(t); } });
      pushConfig("taxonomy"); renderAll(); renderSettings();
    }));
    it.appendChild(d);
    ml.appendChild(it);
  });
  sec.appendChild(ml);
  addLine(sec,"Add a method",name=>{
    State.taxonomy.methods.push({id:uid(),name,subjects:[]});
    pushConfig("taxonomy"); renderSettings();
  });

  /* --- repetition presets --- */
  sec=section(b,"Repetition","repetition");
  hint(sec,"These are the choices offered under \"Repetition\" when adding a task — independent of Method.");
  const rl=el("div","sect-list");
  State.taxonomy.repeats.forEach(rp=>{
    const it=el("div","item");
    const m=el("div","item-main");
    m.appendChild(el("div","item-t",rp.name));
    m.appendChild(el("div","item-d", rp.intervals.length?("Follow-ups on days "+rp.intervals.join(", ")):"Single task, no follow-ups"));
    it.appendChild(m);
    const e=el("button","item-btn","Edit"); e.addEventListener("click",()=>openRepeatEditor(rp)); it.appendChild(e);
    if(rp.id!=="none"){
      const d=el("button","item-btn danger","Remove");
      d.addEventListener("click",()=>confirmDelete("\""+rp.name+"\"",()=>{
        State.taxonomy.repeats=State.taxonomy.repeats.filter(z=>z.id!==rp.id);
        pushConfig("taxonomy"); renderAll(); renderSettings();
      }));
      it.appendChild(d);
    }
    rl.appendChild(it);
  });
  sec.appendChild(rl);
  addLine(sec,"Add a repetition preset",name=>{
    State.taxonomy.repeats.push({id:uid(),name,intervals:[]});
    pushConfig("taxonomy"); renderSettings();
  });

  /* --- due date shortcuts --- */
  sec=section(b,"Due date shortcuts","duepresets");
  hint(sec,"Quick chips shown under the due-date field when adding a task.");
  const dpl=el("div","sect-list");
  State.settings.dueDatePresets.forEach(dp=>{
    const it=el("div","item");
    const m=el("div","item-main");
    m.appendChild(el("div","item-t",dp.label));
    m.appendChild(el("div","item-d", dp.days===0?"Today":(dp.days+" day"+(dp.days===1?"":"s")+" from now")));
    it.appendChild(m);
    const d=el("button","item-btn danger","Remove");
    d.addEventListener("click",()=>{
      State.settings.dueDatePresets=State.settings.dueDatePresets.filter(z=>z.id!==dp.id);
      pushConfig("settings"); renderSettings();
    });
    it.appendChild(d);
    dpl.appendChild(it);
  });
  sec.appendChild(dpl);
  rowOf(sec,r=>{
    const lb=field(r,"Label","text","");
    const dy=field(r,"Days from now","number","1");
    const btn=el("button","btn small","Add");
    btn.addEventListener("click",()=>{
      const label=lb.value.trim(); if(!label) return;
      State.settings.dueDatePresets.push({id:uid(),label,days:clamp(Number(dy.value)||0,0,365)});
      pushConfig("settings"); renderSettings();
    });
    r.appendChild(btn);
  });

  /* --- tasks --- */
  sec=section(b,"Tasks","tasks");
  bindInput(field(sec,"Order them by","select",s.taskSort,
    [{id:"due",name:"Due date"},{id:"subject",name:"Subject"},{id:"type",name:"Type"}]),
    v=>{ s.taskSort=v; pushConfig("settings"); renderAll(); });
  bindInput(field(sec,"When a task is done","select",s.doneStyle,
    [{id:"strike",name:"Cross it out in place"},{id:"bottom",name:"Move it to the bottom"},{id:"hide",name:"Hide it"}]),
    v=>{ s.doneStyle=v; pushConfig("settings"); renderAll(); });
  bindInput(field(sec,"Clear finished tasks after (days)","number",s.autoClearDays),
    v=>{ s.autoClearDays=clamp(Number(v)||0,0,365); pushConfig("settings"); renderAll(); });
  hint(sec,"Set to 0 to keep them forever.");

  /* --- reminder --- */
  sec=section(b,"Reminder line","reminder");
  sw(sec,"Show it","The line along the bottom of the screen.",s.reminderOn,
    v=>{ s.reminderOn=v; pushConfig("settings"); renderTicker(); });
  bindInput(field(sec,"How far ahead (hours)","number",s.reminderLeadHours),
    v=>{ s.reminderLeadHours=clamp(Number(v)||1,1,168); pushConfig("settings"); renderTicker(); });
  sw(sec,"Tutoring only","Otherwise regular classes appear here too.",s.reminderTutoringOnly,
    v=>{ s.reminderTutoringOnly=v; pushConfig("settings"); renderTicker(); });

  /* --- timers --- */
  sec=section(b,"Stopwatch and timer","timers");
  bindInput(field(sec,"Timer presets (minutes, comma separated)","text",s.timerPresets.join(", ")),
    v=>{
      const arr=v.split(",").map(x=>clamp(parseInt(x.trim(),10)||0,1,600)).filter(Boolean).slice(0,10);
      if(arr.length){ s.timerPresets=arr; pushConfig("settings"); renderPresets(); }
    });
  sw(sec,"Sound when the timer ends","A short tone. Needs the tab to have been clicked once.",s.timerSound,
    v=>{ s.timerSound=v; pushConfig("settings"); });
  sw(sec,"Track laps on the stopwatch",null,s.swLaps,
    v=>{ s.swLaps=v; pushConfig("settings"); swRenderLaps(); });

  /* --- screens --- */
  sec=section(b,"Screens and gestures","screens");
  const order=el("div","sect-list");
  const NAMES={home:"Countdown",calendar:"Calendar",stopwatch:"Stopwatch",timer:"Timer"};
  ["timer","stopwatch","home","calendar"].forEach(k=>{
    const on=s.screens.indexOf(k)>=0;
    const it=el("div","item");
    const m=el("div","item-main"); m.appendChild(el("div","item-t",NAMES[k]));
    m.appendChild(el("div","item-d", on? "Position "+(s.screens.indexOf(k)+1) : "Hidden"));
    it.appendChild(m);
    if(k!=="home"){
      const u=el("button","item-btn","◀"); u.title="Move left";
      u.addEventListener("click",()=>moveScreen(k,-1)); it.appendChild(u);
      const dn=el("button","item-btn","▶"); dn.title="Move right";
      dn.addEventListener("click",()=>moveScreen(k,1)); it.appendChild(dn);
      const t=el("button","item-btn", on?"Hide":"Show");
      t.addEventListener("click",()=>{
        if(on) s.screens=s.screens.filter(z=>z!==k); else s.screens.push(k);
        pushConfig("settings"); layoutScreens(); renderSettings();
      });
      it.appendChild(t);
    }
    order.appendChild(it);
  });
  sec.appendChild(order);
  hint(sec,"The countdown is always here — it's the anchor everything swipes away from.");
  bindInput(field(sec,"Open on","select",s.startScreen,
    [{id:"auto",name:"Countdown on the laptop, new task on the phone"},
     {id:"home",name:"Always the countdown"},{id:"quickadd",name:"Always a new task"}]),
    v=>{ s.startScreen=v; pushConfig("settings"); });
  sw(sec,"Flip the swipe-up direction","If two-finger up on the trackpad feels backwards.",s.invertVertical,
    v=>{ s.invertVertical=v; pushConfig("settings"); });
  sw(sec,"Ask before deleting","A confirmation step on anything destructive.",s.confirmDelete,
    v=>{ s.confirmDelete=v; pushConfig("settings"); });
  sw(sec,"Show gesture hints","The small prompt under the countdown.",s.hintsOn,
    v=>{ s.hintsOn=v; pushConfig("settings"); updateHint(); });

  /* --- data --- */
  sec=section(b,"Data","data");
  hint(sec, !FIREBASE_CONFIGURED ? "No Firebase project connected yet — see the setup notice."
           : fsReady ? "Signed in as "+fsUser.email+". Changes reach your other device within a few seconds."
           : "Not signed in.");
  if(fsReady){
    const so=el("button","btn small","Sign out");
    so.style.marginTop="10px"; so.addEventListener("click",signOut);
    sec.appendChild(so);
  }
  const exp=el("button","btn small","Copy everything as JSON");
  exp.addEventListener("click",async()=>{
    const blob=JSON.stringify({settings:State.settings,taxonomy:State.taxonomy,schedule:State.schedule,todos:State.todos},null,2);
    try{ await navigator.clipboard.writeText(blob); toast("Copied"); }catch(e){ toast("Couldn't reach the clipboard"); }
  });
  exp.style.marginTop="10px"; sec.appendChild(exp);
  const rst=el("button","btn small","Reset everything");
  rst.style.marginTop="10px"; rst.style.marginLeft="8px";
  rst.addEventListener("click",()=>confirmDelete("everything — schedule, tasks and settings",async()=>{
    for(const id of Object.keys(State.todos)) await removeTodo(id);
    State.settings=JSON.parse(JSON.stringify(DEFAULTS.settings));
    State.taxonomy=JSON.parse(JSON.stringify(DEFAULTS.taxonomy));
    State.schedule=JSON.parse(JSON.stringify(DEFAULTS.schedule));
    pushConfig("settings"); pushConfig("taxonomy"); pushConfig("schedule");
    applyTokens(); buildCountShell(); layoutScreens(); renderAll(); renderSettings();
    toast("Back to defaults");
  }));
  sec.appendChild(rst);
}

function addLine(parent,label,fn){
  const w=el("div","add-line");
  const i=el("input"); i.type="text"; i.placeholder=label; i.autocomplete="off";
  const b=el("button","btn small","Add");
  const go=()=>{ const v=i.value.trim(); if(!v) return; fn(v); };
  b.addEventListener("click",go);
  i.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  w.appendChild(i); w.appendChild(b); parent.appendChild(w);
}

function moveScreen(k,dir){
  const s=State.settings, i=s.screens.indexOf(k);
  if(i<0) return;
  const j=clamp(i+dir,0,s.screens.length-1);
  if(i===j) return;
  s.screens.splice(i,1); s.screens.splice(j,0,k);
  pushConfig("settings"); layoutScreens(); renderSettings();
}

function openRepeatEditor(rp){
  openEditor("Repetition preset", b=>{
    const nm=field(b,"Name","text",rp.name);
    const iv=field(b,"Follow-up days","text",(rp.intervals||[]).join(", "));
    hint(b,"Days after the due date. \"1, 3, 7, 16, 35\" creates six tasks in total. Leave blank for a single task.");
    actions(b,"Save",()=>{
      rp.name=nm.value.trim()||rp.name;
      rp.intervals=iv.value.split(",").map(x=>parseInt(x.trim(),10)).filter(x=>x>0).slice(0,12);
      pushConfig("taxonomy"); closeEditor(); renderSettings();
    });
  });
}

function openMethodEditor(me){
  openEditor("Study method", b=>{
    const nm=field(b,"Name","text",me.name);
    const f=el("div","f");
    f.appendChild(el("label",null,"Offer it for"));
    const chips=el("div","chips");
    const all=el("button","chip"+((!me.subjects||!me.subjects.length)?" on":""),"Every subject");
    all.addEventListener("click",()=>{ me.subjects=[]; openMethodEditor(me); });
    chips.appendChild(all);
    State.taxonomy.subjects.forEach(su=>{
      const on=me.subjects&&me.subjects.indexOf(su.id)>=0;
      const c=el("button","chip"+(on?" on":""),su.name);
      c.addEventListener("click",()=>{
        me.subjects=me.subjects||[];
        const k=me.subjects.indexOf(su.id);
        if(k>=0) me.subjects.splice(k,1); else me.subjects.push(su.id);
        openMethodEditor(me);
      });
      chips.appendChild(c);
    });
    f.appendChild(chips); b.appendChild(f);
    hint(b,"Repetition is set separately, per task, from the Repetition field when adding it.");
    actions(b,"Save",()=>{
      me.name=nm.value.trim()||me.name;
      pushConfig("taxonomy"); closeEditor(); renderSettings();
    });
  });
}

/* =====================================================================
   17. RENDER ORCHESTRATION
   ===================================================================== */
function renderAll(){
  renderSlot(); renderCalendar(); renderTicker(); mountGears(); updateHint();
}

/* =====================================================================
   18. BOOT
   ===================================================================== */
function boot(){
  loadLocal();
  applyTokens();
  buildCountShell();
  layoutScreens();
  renderPresets();
  tmSet(State.settings.timerPresets[2]||25);
  swPaint();
  tickClock(); tickCountdown(); renderAll();

  const s=State.settings;
  const narrow=window.matchMedia("(max-width:760px)").matches;
  if(s.startScreen==="quickadd" || (s.startScreen==="auto" && narrow)){
    setTimeout(()=>openQuickAdd(),450);
  }

  setInterval(tickClock,1000);
  setInterval(tickCountdown, State.settings.showSeconds?500:15000);
  setInterval(()=>{ renderSlot(); renderTicker(); },60000);
  setInterval(()=>{ if(State.settings.theme==="gradient"){ ensureSunTimes(); updateGradientTheme(); } },60000);

  $("#swStart").addEventListener("click",swToggle);
  $("#swReset").addEventListener("click",swResetFn);
  $("#swLap").addEventListener("click",swLapFn);
  $("#tmStart").addEventListener("click",tmToggle);
  $("#tmReset").addEventListener("click",()=>tmSet(TM.dur/60000||25));
  $("#calPrev").addEventListener("click",()=>{ calOffset--; renderCalendar(); });
  $("#calNext").addEventListener("click",()=>{ calOffset++; renderCalendar(); });
  $("#calToday").addEventListener("click",()=>{ calOffset=0; renderCalendar(); });

  initSync();
}

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",boot);
else boot();

})();
</script>
</body>
</html>
